  :root { --sky1:#bfe6ef; --sky2:#fdf3dc; --grass:#8cc084; --grass2:#5f9e6e; --title-shadow:#b03a2e; --strip:rgba(255,255,255,.45); --strip-line:rgba(60,110,70,.6); }
  h1 { font-size:7.4vmin; padding:0 14vmin; }
  .sun { background:#ff8a65; box-shadow:0 0 0 3vmin rgba(255,138,101,.25); }
  .peak { position:absolute; bottom:22vmin; left:-4%; width:60vmin; height:40vmin; background:#9fc3cc; clip-path:polygon(0 100%, 28% 22%, 44% 52%, 62% 0, 100% 100%); opacity:.8; }
  .peak.p2 { left:auto; right:-6%; width:70vmin; height:30vmin; background:#b5d3d9; }

  .frac { display:inline-flex; flex-direction:column; align-items:center; line-height:1; font-weight:bold; vertical-align:middle; }
  .frac b { border-bottom:.6vmin solid currentColor; padding:0 1vmin .4vmin; font-weight:bold; }
  .frac i { font-style:normal; padding-top:.4vmin; }
  .shapebox { width:30vmin; height:22vmin; }
  .graphbox { width:40vmin; height:27vmin; }
  /* Canadian coins */
  .toks { display:flex; flex-wrap:wrap; gap:.8vmin; max-width:46vmin; justify-content:center; align-items:center; }
  .coin { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; font-style:normal; font-weight:bold; border:.5vmin solid rgba(0,0,0,.25); background:#cfd6e4; font-size:2.3vmin; width:6vmin; height:6vmin; }
  .coin.c10 { width:5vmin; height:5vmin; font-size:1.9vmin; } .coin.c25 { width:7vmin; height:7vmin; } .coin.c100 { width:7.6vmin; height:7.6vmin; background:#e2b84a; }
  .coin.c200 { width:8.2vmin; height:8.2vmin; background:radial-gradient(circle, #e2b84a 0 46%, #cfd6e4 49%); }

<script>
"use strict";
/* =====================================================================
   DR. SOMEBODY IN ANCIENT CHINA  -  the Grade 3 game
   Story: the clock balloon lands in ancient China, about two thousand
   years ago, and tears on the Great Wall. It needs six rolls of silk
   to patch it. Win at a place and an animal friend brings a roll.
   The engine that runs the game is in shared/story.js.
   ===================================================================== */

// Dr. Somebody dressed for China: a pointed straw hat.
const HOST = owl("", `<polygon points="50,32 100,-8 150,32" fill="#e8c26a"/><ellipse cx="100" cy="32" rx="54" ry="7" fill="#c99a3e"/>`);
const tier = (y, w) => `<path d="M${42 - w} ${y + 16} Q50 ${y - 6} ${58 + w} ${y + 16} L${50 + w} ${y + 22} L${50 - w} ${y + 22} Z" fill="#c0392b"/><rect x="${54 - w}" y="${y + 22}" width="${2 * w - 8}" height="16" fill="#f6e3c5"/>`;
const PAGODA = `<svg class="pagoda" viewBox="0 0 100 140"><line x1="50" y1="0" x2="50" y2="14" stroke="#c0392b" stroke-width="3"/>${tier(8, 14)}${tier(44, 22)}${tier(80, 30)}<rect x="16" y="118" width="68" height="8" fill="#8d6e63"/></svg>`;

// ---------- helpers ----------
const wordCard = (w, color) => `<span style="font-size:${w.length <= 4 ? 8 : w.length <= 6 ? 6 : w.length <= 8 ? 4.8 : 4}vmin${color ? ";color:" + color : ""}">${w}</span>`;
const ansCard = text => `<span class="ans">${text}</span>`;
const blank = s => s.replace("___", "<u>&nbsp;</u>");
const near = (ans, list) => numCards(ans, 0, 1200, 4, list);
// pick-the-word questions: a sentence with a gap
function gapQuestion(item, ask, count) {
  const [s, a, wrongs] = item, cols = shuffle(INK), full = w => s.replace("___", w);
  return { bubble: `<div class="sentence">${blank(s)}</div>`, key: s, say: `${s.replace("___", "blank")} ${ask}`, again: ask, yay: `Yes! ${full(a)}`,
    choices: shuffle(shuffle(wrongs).slice(0, count - 1).concat(a)).map((w, i) => ({ html: wordCard(w, cols[i]), ok: w === a, wrong: "Not quite." })) };
}
// fractions
const PARTS = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["quarter", "quarters"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"], 7: ["seventh", "sevenths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"] };
const fracSaid = (k, d) => `${NUM[k]} ${PARTS[d][k > 1 ? 1 : 0]}`;
const frac = (k, d) => `<span class="frac"><b>${k}</b><i>${d}</i></span>`;
function pie(d, k) {
  const pt = a => `${(50 + 44 * Math.cos(a)).toFixed(1)},${(50 + 44 * Math.sin(a)).toFixed(1)}`;
  let s = "";
  for (let i = 0; i < d; i++) { const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
    s += `<path d="M50,50 L${pt(a0)} A44,44 0 0 1 ${pt(a1)} Z" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
function bar(d, k) {
  let s = "";
  for (let i = 0; i < d; i++) s += `<rect x="${(4 + i * 92 / d).toFixed(1)}" y="32" width="${(92 / d).toFixed(1)}" height="36" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
// a garden drawn as a rectangle, w wide and h tall, with its sides labelled; "grid" also draws the unit squares
function garden(w, h, grid) {
  const s = Math.min(84 / w, 56 / h), W = w * s, H = h * s, x = (130 - W) / 2 + 8, y = (96 - H) / 2 + 6;
  let lines = "";
  if (grid) { for (let i = 1; i < w; i++) lines += `<line x1="${x + i * s}" y1="${y}" x2="${x + i * s}" y2="${y + H}"/>`; for (let j = 1; j < h; j++) lines += `<line x1="${x}" y1="${y + j * s}" x2="${x + W}" y2="${y + j * s}"/>`; }
  return `<svg viewBox="0 0 130 96"><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#bfe8b0" stroke="#3f8f4f" stroke-width="2.5"/><g stroke="#3f8f4f" stroke-width="1">${lines}</g>
    <text x="${x + W / 2}" y="${y - 4}" font-size="9" text-anchor="middle" font-weight="bold" fill="#2b2d42">${w} m</text><text x="${x - 4}" y="${y + H / 2 + 3}" font-size="9" text-anchor="end" font-weight="bold" fill="#2b2d42">${h} m</text></svg>`;
}

// Canadian coins. Amounts are kept in cents: 325 means $3.25.
const coin = c => `<i class="coin c${c}">${c < 100 ? c + "¢" : "$" + c / 100}</i>`;
const fmt = c => c < 100 ? `${c}¢` : c % 100 ? `$${(c / 100).toFixed(2)}` : `$${c / 100}`;                        // how an amount is written
const moneySaid = c => { const d = Math.floor(c / 100), r = c % 100; return d ? `${d} dollar${d > 1 ? "s" : ""}${r ? ` and ${r} cents` : ""}` : `${r} cents`; }; // how it is said
// Money answer cards: the right amount and three believable wrong ones (always real coin amounts, never odd cents).
function moneyCards(c, list) {
  const wrong = shuffle([...new Set(list.concat([c + 5, c + 10, c + 15]))].filter(x => x >= 5 && x !== c)).slice(0, 3);
  return wrong.concat(c).sort((a, b) => a - b).map(x => ({ html: `<span style="font-size:6vmin">${fmt(x)}</span>`, ok: x === c, wrong: `That is ${moneySaid(x)}.` }));
}
// A bar graph: one bar for each name. "scale" is how much each line on the side is worth.
function barGraph(names, vals, scale) {
  const top = Math.max(...vals), x0 = 16, y0 = 78, unit = 66 / top;
  let s = "";
  for (let i = 0; i <= top; i++) { const y = (y0 - i * unit).toFixed(1); s += `<line x1="${x0}" y1="${y}" x2="126" y2="${y}" stroke="#d9dbe6" stroke-width=".6"/><text x="${x0 - 2}" y="${+y + 2}" font-size="5.5" text-anchor="end" fill="#2b2d42">${i * scale}</text>`; }
  names.forEach((n, i) => { const x = x0 + 6 + i * 27, h = vals[i] * unit; s += `<rect x="${x}" y="${(y0 - h).toFixed(1)}" width="18" height="${h.toFixed(1)}" fill="${INK[i]}"/><text x="${x + 9}" y="${y0 + 8}" font-size="7" text-anchor="middle" font-weight="bold" fill="#2b2d42">${n}</text>`; });
  return `<svg viewBox="0 0 130 90">${s}<line x1="${x0}" y1="${y0}" x2="126" y2="${y0}" stroke="#2b2d42" stroke-width="1.2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="8" stroke="#2b2d42" stroke-width="1.2"/></svg>`;
}

// ---------- words, grammar and facts ----------
const SOUND_SAME = [["I have ___ apples.", "two", ["to", "too"]], ["We went ___ the market.", "to", ["two", "too"]], ["It is ___ hot today.", "too", ["to", "two"]], ["Can you ___ the drum?", "hear", ["here", "hair"]], ["Come over ___.", "here", ["hear", "hare"]],
  ["The boat sailed on the ___.", "sea", ["see", "seen"]], ["I can ___ the Great Wall.", "see", ["sea", "seen"]], ["I ___ the answer.", "know", ["no", "now"]], ["Please ___ your name.", "write", ["right", "rite"]],
  ["Turn ___ at the gate.", "right", ["write", "rite"]], ["The pandas ate ___ bamboo.", "their", ["there", "they're"]], ["Put the lantern over ___.", "there", ["their", "they're"]], ["___ flying a kite.", "They're", ["Their", "There"]],
  ["What will you ___ to the festival?", "wear", ["where", "were"]], ["___ is the dragon?", "Where", ["Wear", "Were"]], ["She ate the ___ dumpling.", "whole", ["hole", "hold"]], ["The cook needs ___ to make noodles.", "flour", ["flower", "floor"]],
  ["A ___ grew in the garden.", "flower", ["flour", "floor"]], ["The dog wagged ___ tail.", "its", ["it's", "is"]], ["___ time for tea.", "It's", ["Its", "Is"]], ["Is that ___ kite?", "your", ["you're", "yore"]], ["___ a good friend.", "You're", ["Your", "Yore"]]];
const WORD_PARTS = [["unhappy", "not happy", ["very happy", "happy again"]], ["rewrite", "write again", ["not write", "write badly"]], ["careless", "without care", ["full of care", "caring again"]], ["helpful", "full of help", ["without help", "not helping"]],
  ["preheat", "heat before", ["heat again", "not hot"]], ["unlock", "open the lock", ["lock again", "lock tightly"]], ["teacher", "a person who teaches", ["to teach again", "not teaching"]], ["fearless", "without fear", ["full of fear", "afraid again"]],
  ["replay", "play again", ["not play", "play before"]], ["joyful", "full of joy", ["without joy", "joy again"]], ["dislike", "not like", ["like again", "like a lot"]], ["painter", "a person who paints", ["paint again", "without paint"]],
  ["misspell", "spell wrongly", ["spell again", "spell well"]], ["quickly", "in a quick way", ["not quick", "quick again"]]];
const CLUES = [
  ["The Great Wall is enormous. It stretches for thousands of miles.", "enormous", "very big", ["very old", "very small", "very new"]],
  ["The emperor was furious when the vase broke. He shouted loudly.", "furious", "very angry", ["very happy", "very sleepy", "very kind"]],
  ["The traveller was exhausted after walking all day. She fell asleep at once.", "exhausted", "very tired", ["very hungry", "very fast", "very clean"]],
  ["Silk is a delicate cloth. It can tear easily.", "delicate", "easily damaged", ["very heavy", "very cheap", "very loud"]],
  ["The market was bustling. People were rushing everywhere.", "bustling", "busy and full of people", ["quiet and empty", "dark and cold", "small and tidy"]],
  ["The ancient vase was made long, long ago.", "ancient", "very old", ["very shiny", "very tall", "very new"]],
  ["The panda devoured the bamboo. Soon there was none left.", "devoured", "ate quickly", ["planted carefully", "looked at", "hid away"]],
  ["The lanterns glowed in the dark. They lit up the whole street.", "glowed", "gave off light", ["fell down", "made noise", "got wet"]],
  ["The path was treacherous. One wrong step and you could fall.", "treacherous", "dangerous", ["pretty", "short", "flat"]],
  ["The farmer was weary after the harvest. He needed a long rest.", "weary", "tired", ["excited", "angry", "rich"]],
  ["The kite soared above the rooftops. It went higher and higher.", "soared", "flew high", ["sank down", "broke apart", "stood still"]]];
// [sentence, noun, verb, adjective]
const SENTENCE_PARTS = [["The red dragon flew.", "dragon", "flew", "red"], ["The hungry panda ate.", "panda", "ate", "hungry"], ["A brave soldier marched.", "soldier", "marched", "brave"], ["The tiny silkworm spins.", "silkworm", "spins", "tiny"],
  ["The old emperor smiled.", "emperor", "smiled", "old"], ["A bright lantern glowed.", "lantern", "glowed", "bright"], ["The noisy drum boomed.", "drum", "boomed", "noisy"], ["The clever inventor worked.", "inventor", "worked", "clever"],
  ["A long river flows.", "river", "flows", "long"], ["The golden kite soared.", "kite", "soared", "golden"], ["The busy trader walked.", "trader", "walked", "busy"]];
const WHEN = [["Yesterday the trader ___ to the market.", "walked", ["walks", "will walk"]], ["Tomorrow we ___ a kite.", "will fly", ["flew", "flies"]], ["Right now the panda ___ bamboo.", "is eating", ["ate", "will eat"]],
  ["Last year the farmers ___ rice.", "grew", ["grow", "will grow"]], ["Next week the emperor ___ the wall.", "will visit", ["visited", "visits"]], ["Long ago, people ___ paper.", "invented", ["invent", "will invent"]],
  ["Every day the scholar ___ a poem.", "writes", ["wrote", "will write"]], ["Yesterday the dancers ___ in the street.", "danced", ["dance", "will dance"]], ["Tomorrow she ___ a silk robe.", "will wear", ["wore", "wears"]],
  ["Last night the lanterns ___ brightly.", "glowed", ["glow", "will glow"]]];
const MATCHING = [["The pandas ___ sleeping.", "are", ["is", "am"]], ["The emperor ___ a big palace.", "has", ["have", "having"]], ["She ___ to school every day.", "goes", ["go", "going"]], ["They ___ making noodles.", "were", ["was", "is"]],
  ["I ___ a kite.", "have", ["has", "having"]], ["The dragon ___ very long.", "is", ["are", "am"]], ["Mei and Lin ___ friends.", "are", ["is", "am"]], ["He ___ not like tea.", "does", ["do", "doing"]], ["The traders ___ silk.", "sell", ["sells", "selling"]],
  ["My sister ___ dumplings.", "loves", ["love", "loving"]]];
const WRITTEN_RIGHT = [["The panda eats bamboo.", "the panda eats bamboo.", "The panda eats bamboo"], ["Where is the Great Wall?", "Where is the Great Wall.", "where is the great wall?"], ["Mei lives in China.", "mei lives in china.", "Mei lives in china"],
  ["Look out for the dragon!", "look out for the dragon!", "Look out for the dragon"], ["Did you see the lanterns?", "Did you see the lanterns", "did you see the lanterns?"], ["I can't wait for the festival.", "I cant wait for the festival.", "i can't wait for the festival"],
  ["The emperor's robe was silk.", "The emperors robe was silk", "the emperor's robe was silk."], ["We flew kites and lit lanterns.", "we flew kites and lit lanterns.", "We flew kites and lit lanterns"]];
// [what the scroll says, the question, the right answer, three wrong answers]
const SCROLLS = [
  ["The Great Wall of China is thousands of miles long. It was built to keep enemies out. It took many, many years to build.", "Why was the Great Wall built?", "to keep enemies out", ["to grow rice", "to hold back the sea", "to fly kites from"]],
  ["Silk is a soft, shiny cloth. It is made from the thread of tiny silkworms. For a long time, only people in China knew how to make it.", "What makes the thread for silk?", "silkworms", ["sheep", "spiders", "cotton plants"]],
  ["Paper was invented in China about two thousand years ago. Before that, people wrote on bamboo strips or silk. Paper was lighter and cheaper.", "What did people write on before paper?", "bamboo strips or silk", ["only stone", "leaves and sand", "glass"]],
  ["The compass was invented in China. Its needle always points the same way. Sailors used it to find their way at sea.", "Who used the compass to find their way?", "sailors", ["farmers", "painters", "cooks"]],
  ["Kites were first flown in China. Some were made of silk and bamboo. Long ago, armies even used kites to send signals.", "What were early kites made of?", "silk and bamboo", ["metal and rope", "leaves and mud", "glass and string"]],
  ["Giant pandas live in the mountains of China. They eat bamboo for most of the day. A panda can eat for more than ten hours!", "What do pandas eat most?", "bamboo", ["rice", "fish", "tea leaves"]],
  ["People in China have drunk tea for thousands of years. Tea is made by putting dried leaves in hot water. Later, tea spread all around the world.", "How is tea made?", "dried leaves in hot water", ["rice in cold water", "flowers in milk", "bamboo in soup"]],
  ["Fireworks were invented in China. People believed the loud bangs scared away bad luck. Today fireworks light up the sky at festivals.", "Why did people like the loud bangs?", "to scare away bad luck", ["to wake the farmers", "to call the pandas", "to start the rain"]],
  ["An emperor ruled ancient China. He lived in a huge palace with many rooms. Ordinary people were not allowed inside.", "Where did the emperor live?", "in a huge palace", ["on the Great Wall", "in a small hut", "on a boat"]],
  ["The Silk Road was a long trade route. Traders carried silk, tea and spices along it. They often travelled with camels.", "What was the Silk Road used for?", "trading goods", ["racing horses", "building walls", "growing silk"]],
  ["Thousands of clay soldiers were buried near an emperor's tomb. Each soldier has a different face. They are called the Terracotta Army.", "What is the Terracotta Army made of?", "clay", ["gold", "wood", "silk"]],
  ["Chinese writing uses characters instead of letters. Each character stands for a word or an idea. Writing them beautifully with a brush is called calligraphy.", "What is calligraphy?", "beautiful writing with a brush", ["a kind of kite", "a clay soldier", "a way to make tea"]],
  ["Farmers in China grew rice in flooded fields. The fields are called paddies. Rice needs lots of water to grow.", "What does rice need lots of?", "water", ["sand", "snow", "shade"]],
  ["At the New Year festival, dancers carry a long dragon on poles. The dragon is a sign of good luck. Drums and cymbals play as it dances.", "What is the dragon a sign of?", "good luck", ["bad weather", "a long winter", "a lost battle"]]
];
const SHARE = [
  (n, b) => `${n} rolls of silk are shared equally between ${b} traders. How many rolls does each trader get?`,
  (n, b) => `${n} dumplings go on ${b} plates, with the same number on each plate. How many dumplings are on each plate?`,
  (n, b) => `${n} lanterns hang in ${b} equal rows. How many lanterns are in each row?`,
  (n, b) => `${n} bundles of tea are packed into boxes of ${b}. How many boxes are needed?`
];

// ---------- the places (mini-games) ----------
// Each has 4 difficulty steps. makeQuestion(step) returns { bubble, say, yay, choices: [{ html, ok, wrong }], pause, key, again, tall }.
const GAMES = {
  times: {
    name: "Great Wall Times", icon: "✖️", intro: "The Great Wall was built row by row. Let's multiply!",
    makeQuestion(step) {
      const t = pick(step === 1 ? [2, 5, 10] : step === 2 ? [3, 4] : step === 3 ? [6, 7, 8, 9] : [2, 3, 4, 5, 6, 7, 8, 9, 10]), o = 2 + rand(9), [a, b] = shuffle([t, o]), n = a * b;
      if (step === 4) return { bubble: `<span class="sum">${a} × <b>?</b> = ${n}</span>`, key: a + "x?" + b, say: `${a} times what makes ${n}?`, yay: `Yes! ${a} times ${b} is ${n}!`, choices: near(b, [b + 1, b - 1, b + 2, a]) };
      return { bubble: `<span class="sum">${a} × ${b} = <b>?</b></span>`, key: a + "x" + b, say: `What is ${a} times ${b}?`, yay: `Yes! ${a} times ${b} is ${n}!`, choices: near(n, [n + a, n - a, n + b, n - b, a + b]) };
    }
  },
  share: {
    name: "Silk Road Sharing", icon: "➗", intro: "Traders on the Silk Road shared things out equally. Let's divide!",
    makeQuestion(step) {
      const b = pick(step === 1 ? [2, 5, 10] : step === 2 ? [3, 4] : step === 3 ? [6, 7, 8, 9] : [2, 3, 4, 5, 6, 7, 8, 9]), q = 2 + rand(9), n = b * q;
      const why = `Yes! ${n} divided by ${b} is ${q}, because ${q} times ${b} is ${n}.`;
      if (step === 4) { const text = pick(SHARE)(n, b); return { bubble: `<div class="passage">${text}</div>`, tall: true, key: n + "/" + b, say: text, yay: why, choices: near(q, [q + 1, q - 1, q + 2, b, n - b]) }; }
      return { bubble: `<span class="sum">${n} ÷ ${b} = <b>?</b></span>`, key: n + "/" + b, say: `What is ${n} divided by ${b}?`, yay: why, choices: near(q, [q + 1, q - 1, q + 2, b]) };
    }
  },
  fractions: {
    name: "Dumpling Fractions", icon: "🥟", intro: "A fraction is a part of a whole. Let's share out the dumplings fairly!",
    makeQuestion(step) {
      const cols = shuffle(INK), shape = (d, k) => (d <= 8 && rand(2) ? pie : bar)(d, k);
      if (step === 4) { // a fraction of a number
        const d = pick([2, 3, 4, 5, 10]), m = 2 + rand(9), n = d * m;
        return { bubble: `<span class="sum" style="font-size:8vmin">${frac(1, d)} of ${n}</span>`, key: d + "of" + n, say: `What is one ${PARTS[d][0]} of ${n}?`,
          yay: `Yes! One ${PARTS[d][0]} of ${n} is ${m}. That is ${n} shared into ${d} equal groups.`, choices: near(m, [m + 1, m - 1, n - d, d, m + 2]) };
      }
      if (step === 3) { // which is bigger?
        const bigger = rand(2) === 0; let A, B;
        if (rand(2)) { const d = pick([3, 4, 5, 6, 8]), ks = shuffle(Array.from({ length: d - 1 }, (_, i) => i + 1)); A = [ks[0], d]; B = [ks[1], d]; }
        else { const ds = shuffle([2, 3, 4, 6, 8]); A = [1, ds[0]]; B = [1, ds[1]]; }
        const val = f => f[0] / f[1], right = (val(A) > val(B)) === bigger ? A : B, other = right === A ? B : A, word = bigger ? "bigger" : "smaller";
        return { bubble: big(word, 6), key: A.join("/") + B.join("/") + word, say: `Which fraction is ${word}?`, yay: `Yes! ${cap(fracSaid(...right))} is ${word} than ${fracSaid(...other)}.`,
          choices: [A, B].map(f => ({ html: `<div class="art" style="width:52%;height:52%">${pie(f[1], f[0])}</div><span style="font-size:4.4vmin;margin-top:1vmin">${frac(f[0], f[1])}</span>`, ok: f === right, wrong: `${cap(fracSaid(...f))} is ${bigger ? "smaller" : "bigger"}. Look at the orange parts.` })) };
      }
      const d = step === 1 ? pick([2, 3, 4]) : pick([3, 4, 5, 6, 8]), k = step === 1 ? 1 : 1 + rand(d - 1);
      const opts = step === 1 ? [[1, 2], [1, 3], [1, 4]] : [[k, d], [d - k, d], [k < d - 1 ? k + 1 : k - 1, d], [k, d + 1], [k, d - 1]].filter(f => f[0] > 0 && f[0] < f[1]);
      const seen = new Set(), cards = opts.filter(f => { const id = f.join("/"); if (seen.has(id)) return false; seen.add(id); return true; }).slice(0, step === 1 ? 3 : 4);
