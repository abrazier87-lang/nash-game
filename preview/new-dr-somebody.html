<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The new Dr. Somebody</title>
<link rel="stylesheet" href="shared/kit.css?v=33">
<style>
  /* A try-out page (not on the Story Shelf yet): Dr. Somebody changes into his new look for Grades 5 to 8. */
  :root { --sky1:#8fd3f4; --sky2:#fdebd0; --grass:#8cc084; --grass2:#5f9e6e; }
  #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vmin; padding:2vmin; }
  #who { width:44vmin; height:50vmin; position:relative; }
  #who svg { width:100%; height:100%; }
  #say { min-height:13vmin; max-width:88vmin; background:#fff; border-radius:5vmin; padding:2.4vmin 4vmin; font-size:4.6vmin; font-weight:bold; text-align:center; line-height:1.3; box-shadow:0 1vmin 0 rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center; }
  #say b { color:#e63946; }
  #go { width:20vmin; height:20vmin; }
  #go .tri { border-left-width:8vmin; border-top-width:5.5vmin; border-bottom-width:5.5vmin; margin-left:2vmin; }
  .spark { position:absolute; left:50%; top:50%; width:5vmin; height:5vmin; margin:-2.5vmin; font-size:5vmin; line-height:1; pointer-events:none; }
  .note { position:absolute; left:0; right:0; bottom:1.5vmin; text-align:center; font-size:2.4vmin; color:#3d5a3d; }
</style>
</head>
<body class="game">
<div id="app">
  <div class="layer"><div class="sun"></div><div class="cloud"></div><div class="cloud c2"></div><div class="hill back"></div><div class="hill"></div></div>
  <div class="layer" id="fx"></div>
  <div id="stage">
    <div id="who"></div>
    <div id="say">Tap ▶ to watch Dr. Somebody change.</div>
    <button class="bigbtn" id="go" aria-label="Play"><span class="tri"></span></button>
  </div>
  <div class="note">Try-out page: the change that will play at the end of Grade 4.</div>
</div>

<script src="shared/kit.js?v=33"></script>
<script src="shared/story.js?v=33"></script>
<script>
"use strict";
// ---------- the new Dr. Somebody (Grades 5 to 8): flying cap and goggles, white coat with gold buttons, red scarf ----------
// Drawn with bold outlines, after the picture the family liked from the image generator. "blink" marks the pupils, as on the first owl.
const NEW_OWL = `<svg viewBox="0 0 200 232"><g stroke="#2b1a10" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="80" cy="218" rx="17" ry="9" fill="#ffa62b"/><ellipse cx="120" cy="218" rx="17" ry="9" fill="#ffa62b"/>
  <ellipse cx="100" cy="160" rx="57" ry="56" fill="#e2b178"/>
  <path d="M45 150 Q44 110 100 106 Q156 110 155 150 Q157 186 139 198 Q120 187 100 191 Q80 187 61 198 Q43 186 45 150 Z" fill="#fff"/>
  <path d="M48 124 Q28 150 37 186 Q53 180 55 150 Z" fill="#fff"/><path d="M152 124 Q172 150 163 186 Q147 180 145 150 Z" fill="#fff"/>
  <path d="M60 164 h22 v13 q-11 7 -22 0 z" fill="#fff"/><path d="M118 164 h22 v13 q-11 7 -22 0 z" fill="#fff"/>
  <circle cx="100" cy="146" r="5.5" fill="#f4b942"/><circle cx="100" cy="168" r="5.5" fill="#f4b942"/>
  <ellipse cx="100" cy="74" rx="63" ry="53" fill="#7a4a24"/>
  <path d="M100 48 Q72 30 52 56 Q42 98 100 114 Q158 98 148 56 Q128 30 100 48 Z" fill="#fff"/>
  <circle cx="73" cy="74" r="24" fill="#f4b942"/><circle cx="127" cy="74" r="24" fill="#f4b942"/>
  <circle class="blink" cx="75" cy="75" r="15" fill="#1c1c1c"/><circle class="blink" cx="125" cy="75" r="15" fill="#1c1c1c"/>
  <g stroke="none" fill="#fff"><circle cx="81" cy="68" r="5"/><circle cx="131" cy="68" r="5"/><circle cx="70" cy="81" r="2.4"/><circle cx="120" cy="81" r="2.4"/></g>
  <polygon points="91,88 109,88 100,108" fill="#ff8a3d"/>
  <path d="M52 110 Q100 132 148 110 L152 124 Q100 148 48 124 Z" fill="#e63946"/>
  <path d="M76 132 L66 182 L78 176 L84 184 L92 134 Z" fill="#e63946"/><circle cx="84" cy="130" r="9" fill="#e63946"/>
  <path d="M42 56 Q32 62 39 80 Q51 76 53 58 Z" fill="#fff"/><path d="M158 56 Q168 62 161 80 Q149 76 147 58 Z" fill="#fff"/>
  <path d="M42 56 Q42 6 100 5 Q158 6 158 56 Q130 38 100 38 Q70 38 42 56 Z" fill="#fff"/>
  <path d="M56 32 Q100 20 144 32" fill="none" stroke="#c98a1b" stroke-width="7"/>
  <circle cx="74" cy="30" r="16" fill="#f4b942"/><circle cx="126" cy="30" r="16" fill="#f4b942"/><circle cx="100" cy="29" r="9" fill="#f4b942"/>
  <circle cx="74" cy="30" r="10" fill="#35c2e0"/><circle cx="126" cy="30" r="10" fill="#35c2e0"/><circle cx="100" cy="29" r="5" fill="#35c2e0"/>
  <g stroke="none" fill="#fff" opacity=".8"><circle cx="70" cy="26" r="3"/><circle cx="122" cy="26" r="3"/></g>
</g></svg>`;

const TAG = "Out with the old, in with the new! It's been a hoooot!"; // his words as he changes (recorded in audio/g5/intro/)
const who = document.getElementById("who"), sayBox = document.getElementById("say"), go = document.getElementById("go");
const { sfx, confetti } = Kit;
const old = () => { who.innerHTML = owl(); sayBox.textContent = "Tap ▶ to watch Dr. Somebody change."; };
old();

let busy = false;
go.addEventListener("click", async () => {
  if (busy) return; busy = true; Kit.audio(); sfx.tap(); go.style.visibility = "hidden";
  old(); await wait(300);
  sayBox.innerHTML = `Out with the old, in with the new&hellip; it's been a <b>HOOOOOT!</b>`;
  who.firstElementChild.animate([{ rotate: "0deg" }, { rotate: "-6deg" }, { rotate: "6deg" }, { rotate: "0deg" }], { duration: 500, iterations: 3 });
  await Promise.all([Kit.playClip("../audio/g5/intro/" + Kit.clipName(TAG) + ".mp3", TAG), wait(2600)]);
  // the change: a spin, a burst of sparkles, and out he pops in his new gear
  sfx.sparkle();
  await who.firstElementChild.animate([{ rotate: "0deg", scale: "1" }, { rotate: "720deg", scale: ".1" }], { duration: 900, easing: "ease-in", fill: "forwards" }).finished;
  for (let i = 0; i < 12; i++) { const s = document.createElement("div"); s.className = "spark"; s.textContent = "✨"; who.appendChild(s); const a = i / 12 * 2 * Math.PI;
    s.animate([{ translate: "0 0", opacity: 1, scale: ".4" }, { translate: `${Math.cos(a) * 26}vmin ${Math.sin(a) * 26}vmin`, opacity: 0, scale: "1.4" }], { duration: 900, easing: "ease-out" }).finished.then(() => s.remove()); }
  who.querySelector("svg").remove(); who.insertAdjacentHTML("afterbegin", NEW_OWL);
  sfx.party(); confetti(70);
  who.firstElementChild.animate([{ scale: ".1", rotate: "-360deg" }, { scale: "1.15", rotate: "0deg" }, { scale: "1" }], { duration: 800, easing: "ease-out" });
  sayBox.innerHTML = `New goggles, same owl!`;
  await wait(2200);
  go.style.visibility = ""; busy = false;
});
</script>
<div style="position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:99;background:#ff5a5f;color:#fff;font:bold 12px sans-serif;padding:3px 10px;border-radius:999px;pointer-events:none;opacity:.85">PREVIEW</div>
</body>
</html>
