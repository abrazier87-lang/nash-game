// A stone sundial showing an o'clock time: the shadow points at the hour, like the short hand of a clock.
function sundial(h) {
  const a = (h % 12) / 12 * 2 * Math.PI, sx = 50 + 31 * Math.sin(a), sy = 50 - 31 * Math.cos(a), px = Math.cos(a) * 5, py = Math.sin(a) * 5;
  let marks = "";
  for (let i = 1; i <= 12; i++) { const b = i / 12 * 2 * Math.PI, x = 50 + 39 * Math.sin(b), y = 50 - 39 * Math.cos(b);
    marks += i % 3 ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.8" fill="#8a6a34"/>` : `<text x="${x.toFixed(1)}" y="${(y + 3.6).toFixed(1)}" font-size="10" font-weight="bold" text-anchor="middle" fill="#5c4520">${i}</text>`; }

// ---------- teaching helpers: lessons ("watch me do one"), hints and step-by-step explanations ----------
const T = n => `<span class="t">${n}</span>`, O = n => `<span class="o">${n}</span>`; // tens in blue, ones in green
const art = html => `<div class="lessonart">${html}</div>`;
// A lesson, or a worked explanation, is a list of [picture, words]: each picture shows while the host says the words.
async function frames(L, list) { for (const [html, words] of list) { L.frame(art(html)); if (!(await L.say(words))) return false; } return true; }

// Lights up the right answer card and says why.
function pointTo(H, words) { const c = H.cards().find(c => c.ch.ok); if (c) H.glow(c.el, true); return H.say(words); }
// Adding by splitting into tens and ones: 37 + 28 is 30 + 20, then 7 + 8, then put them together.
function addSteps(a, b) {
  const at = a - a % 10, bt = b - b % 10, ao = a % 10, bo = b % 10, t = at + bt, o = ao + bo;
  const tens = bt ? `${T(at)} + ${T(bt)} = ${T(t)}` : `${T(at)}`, ones = `${O(ao)} + ${O(bo)} = ${O(o)}`;
  return [
    [`<span class="big">${a} + ${b}</span>`, `Let's add ${a} and ${b}. Split the numbers into tens and ones.`],
    [tens, bt ? `Add the tens. ${at} plus ${bt} is ${t}.` : `${b} has no tens, so the tens stay ${at}.`],
    [`${tens}<br>${ones}`, `Add the ones. ${ao} plus ${bo} is ${o}.${o >= 10 ? " That's more than 10, so it makes one more ten." : ""}`],
    [`${T(t)} + ${O(o)} = <b>${a + b}</b>`, `${t} and ${o}, make ${a + b}!`]];
}
// Taking away by splitting into tens and ones (when no borrowing is needed): 47 − 25 is 40 − 20, then 7 − 5.
function subSteps(a, b) {
  const at = a - a % 10, bt = b - b % 10, ao = a % 10, bo = b % 10, t = at - bt, o = ao - bo;
  const tens = bt ? `${T(at)} − ${T(bt)} = ${T(t)}` : `${T(at)}`, ones = `${O(ao)} − ${O(bo)} = ${O(o)}`;
  return [
    [`<span class="big">${a} − ${b}</span>`, `Let's take ${b} away from ${a}. Split the numbers into tens and ones.`],
    [tens, bt ? `Take away the tens. ${at} take away ${bt} is ${t}.` : `${b} has no tens, so the tens stay ${at}.`],
    [`${tens}<br>${ones}`, `Take away the ones. ${ao} take away ${bo} is ${o}.`],
    [`${T(t)} + ${O(o)} = <b>${a - b}</b>`, `${t} and ${o}, make ${a - b}!`]];
}
// Counting up from a smaller number to a bigger one: jump to the next ten, then jump the rest. The jumps add up to the answer.
function jumpSteps(lo, hi, show = String, said = String) {
  const ten = Math.ceil(lo / 10) * 10, js = ten === lo || ten >= hi ? [[lo, hi]] : [[lo, ten], [ten, hi]], lines = [], out = [];
  js.forEach(([a, b]) => { lines.push(`${show(a)} → ${show(b)}: <b>${show(b - a)}</b>`); out.push([lines.join("<br>"), `From ${said(a)}, up to ${said(b)}, is ${said(b - a)}.`]); });
  if (js.length > 1) out.push([`${js.map(([a, b]) => show(b - a)).join(" + ")} = <b>${show(hi - lo)}</b>`, `Add up the jumps, and that makes ${said(hi - lo)}.`]);
  return out;
}
const countUpLesson = (lo, hi, ask, start) => [[`<span class="big">${ask}</span>`, start]].concat(jumpSteps(lo, hi));
// Coins: start with the biggest coin and count on. "values" are in cents, biggest first.
const coinRow = (values, lit) => `<div class="toks" style="max-width:none">${values.map((c, i) => coin(c).replace('class="coin', `class="coin${i === lit ? " glow" : ""}`)).join("")}</div>`;
function coinSteps(values) {
  let total = 0;
  return values.map((c, i) => { total += c; return [coinRow(values, i) + `<b>${fmt(total)}</b>`, i ? `${c < 100 ? "Count on " + c : "Count on " + moneySaid(c)}. That's ${moneySaid(total)}.` : `Start with the biggest coin. ${moneySaid(c)}.`]; });
}
// Spelling: letter teams that make one sound (rain, boat, night), and the tricky part of heart words.

const HEART = { friend: [2, 2], because: [3, 2], people: [1, 2], said: [1, 2], school: [1, 2], again: [2, 2], little: [4, 2], water: [1, 1], would: [1, 3], they: [2, 2], were: [1, 3], once: [0, 1], every: [2, 1], laugh: [1, 4] };
const marked = (w, at, len) => `${w.slice(0, at)}<b>${w.slice(at, at + len)}</b>${w.slice(at + len)}`;
const spelled = w => w.toUpperCase().split("").join(", ");
// The rule for making "more than one".
function pluralRule(one, many) {
  if (many !== one + "s" && many !== one + "es" && many !== one.slice(0, -1) + "ies" && many !== one.slice(0, -1) + "ves")
    return { hint: `${cap(one)} is a special word. It changes when there is more than one, instead of adding s.`, why: `One ${one}, two ${many}. This one we learn by heart.` };
  if (one.endsWith("f")) return { hint: `${cap(one)} ends in f. Some words that end in f change the f to v, then add e s.`, why: `Change the f to v and add e s. One ${one}, two ${many}.` };
  if (/[^aeiou]y$/.test(one)) return { hint: `${cap(one)} ends in y. When a word ends in y after a consonant, change the y to i and add e s.`, why: `Change the y to i and add e s. One ${one}, two ${many}.` };

// The rule for "yesterday" words.
function pastRule(now, then) {

    time: ["seconds, minutes or hours?", "which takes longest?", "how many hours did it take?", "what time will it end?"],
    words: ["opposites", "words that mean the same", "both kinds, 4 choices", "naming, action and describing words"],
    scribe: ["spelling common words", "spelling tricky words", "more than one (plurals)", "yesterday words (past tense)"],
    scroll: ["read aloud, 2 answers", "read aloud, 3 answers", "reads it alone, 3 answers", "reads it alone, 4 answers"],
    rows: ["equal groups with pictures", "rows of stones", "adding the same number again and again", "rows in words only"]
  },
  rewards: [["cat", "🐈"], ["crocodile", "🐊"], ["hippo", "🦛"], ["frog", "🐸"], ["duck", "🦆"], ["fish", "🐟"], ["scorpion", "🦂"], ["snake", "🐍"], ["lion", "🦁"], ["monkey", "🐒"], ["beetle", "🪲"]],
  progress: list => `<div class="balloon">${BALLOON}</div>` + slots(list, "⚙️"),
  finaleTitle: "The clock is fixed!", stickersLabel: "Egypt friends:",
  finaleArt: list => `<div class="balloon">${BALLOON}</div>` + list.map(e => `<span class="pop">${e}</span>`).join(""),
  lines: {
    hello: name => `Hello${name ? ", " + name : ""}! Doctor Somebody here. At least, I think that is my name. The clock balloon has landed in ancient Egypt, thousands of years ago! But a sandstorm blew four golden gears out of my clock. Tap a place to help me find one.`,
    start: "We need four golden gears to fix the clock balloon. Tap a place to find one.",
    left: n => `We need ${NUM[n]} more golden gear${n === 1 ? "" : "s"}. Tap a place!`,
    won: who => `You did it! The ${who} found a golden gear. Tap the ${who}!`,
    boarded: who => `Thank you, ${who}! One more golden gear for the clock!`,
    finale: name => `Tick tock! The clock is fixed! Thank you${name ? ", " + name : ""}! Goodbye, Egypt! Now, when was I going next? I forget!`,
    again: "Oh no. Another sandstorm! The gears have blown away again. Let's find them.",
    replay: "Great job! You did it again!",
    test: name => `Hello${name ? ", " + name : ""}! I am Doctor Somebody, in ancient Egypt. Tick tock!`
  }
});
</script>
