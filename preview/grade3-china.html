<script>
"use strict";
/* =====================================================================
   DR. SOMEBODY IN ANCIENT CHINA  -  the Grade 3 game
   Story: the clock balloon lands in ancient China, about two thousand
   years ago, and tears on the Great Wall. It needs six rolls of silk
   to patch it. Win at a place and an animal friend brings a roll.
   The engine that runs the game is in shared/story.js.
   ===================================================================== */

// Dr. Somebody dressed for China: a pointed straw hat.
const HOST = owl("", `<polygon points="50,32 100,-8 150,32" fill="#e8c26a"/><ellipse cx="100" cy="32" rx="54" ry="7" fill="#c99a3e"/>`);
const tier = (y, w) => `<path d="M${42 - w} ${y + 16} Q50 ${y - 6} ${58 + w} ${y + 16} L${50 + w} ${y + 22} L${50 - w} ${y + 22} Z" fill="#c0392b"/><rect x="${54 - w}" y="${y + 22}" width="${2 * w - 8}" height="16" fill="#f6e3c5"/>`;
const PAGODA = `<svg class="pagoda" viewBox="0 0 100 140"><line x1="50" y1="0" x2="50" y2="14" stroke="#c0392b" stroke-width="3"/>${tier(8, 14)}${tier(44, 22)}${tier(80, 30)}<rect x="16" y="118" width="68" height="8" fill="#8d6e63"/></svg>`;

// ---------- helpers ----------
const wordCard = (w, color) => `<span style="font-size:${w.length <= 4 ? 8 : w.length <= 6 ? 6 : w.length <= 8 ? 4.8 : 4}vmin${color ? ";color:" + color : ""}">${w}</span>`;
const ansCard = text => `<span class="ans">${text}</span>`;
const blank = s => s.replace("___", "<u>&nbsp;</u>");
const near = (ans, list) => numCards(ans, 0, 1200, 4, list);
// pick-the-word questions: a sentence with a gap
function gapQuestion(item, ask, count) {
  const [s, a, wrongs] = item, cols = shuffle(INK), full = w => s.replace("___", w);
  return { bubble: `<div class="sentence">${blank(s)}</div>`, key: s, say: `${s.replace("___", "blank")} ${ask}`, read: ask, again: ask, yay: `Yes! ${full(a)}`,
    choices: shuffle(shuffle(wrongs).slice(0, count - 1).concat(a)).map((w, i) => ({ html: wordCard(w, cols[i]), ok: w === a, wrong: "Not quite." })) };
}
// fractions
const PARTS = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["quarter", "quarters"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"], 7: ["seventh", "sevenths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"] };
const fracSaid = (k, d) => `${NUM[k]} ${PARTS[d][k > 1 ? 1 : 0]}`;
const frac = (k, d) => `<span class="frac"><b>${k}</b><i>${d}</i></span>`;
function pie(d, k) {
  const pt = a => `${(50 + 44 * Math.cos(a)).toFixed(1)},${(50 + 44 * Math.sin(a)).toFixed(1)}`;
  let s = "";
  for (let i = 0; i < d; i++) { const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
    s += `<path d="M50,50 L${pt(a0)} A44,44 0 0 1 ${pt(a1)} Z" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
function bar(d, k) {
  let s = "";
  for (let i = 0; i < d; i++) s += `<rect x="${(4 + i * 92 / d).toFixed(1)}" y="32" width="${(92 / d).toFixed(1)}" height="36" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
// a place-value abacus showing the number n: one rod per digit, as many beads as the digit, a label under each rod
function abacusArt(n) {
  const ds = String(n).split(""), L = ds.length, W = L * 26 + 14, x0 = 60 - W / 2, cols = ["#ff5a5f", "#4d9de0", "#58b368", "#ff9f43"];
  let s = `<rect x="${x0}" y="2" width="${W}" height="46" rx="5" fill="#a0643c"/><rect x="${x0 + 3}" y="5" width="${W - 6}" height="40" rx="3" fill="#f6e3c5"/>`;
  ds.forEach((c, i) => { const x = 60 + (i - (L - 1) / 2) * 26;
    s += `<line x1="${x}" y1="6" x2="${x}" y2="44" stroke="#8d6e63" stroke-width="2"/>`;
    for (let j = 0; j < +c; j++) s += `<ellipse cx="${x}" cy="${41 - j * 4}" rx="8" ry="1.9" fill="${cols[i % 4]}" stroke="#2b2d42" stroke-width=".6"/>`;
    s += `<text x="${x}" y="61" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b2d42">${c}</text>`; });
  return `<svg viewBox="0 0 120 64" style="width:30vmin;height:16vmin;display:block">${s}</svg>`;
}
const tileIcon = b => `<svg viewBox="0 0 100 100" style="width:1.6em;height:1.6em;vertical-align:middle">${b}</svg>`;
// a garden drawn as a rectangle, w wide and h tall, with its sides labelled; "grid" also draws the unit squares
function garden(w, h, grid) {
  const s = Math.min(84 / w, 56 / h), W = w * s, H = h * s, x = (130 - W) / 2 + 8, y = (96 - H) / 2 + 6;
  let lines = "";
  if (grid) { for (let i = 1; i < w; i++) lines += `<line x1="${x + i * s}" y1="${y}" x2="${x + i * s}" y2="${y + H}"/>`; for (let j = 1; j < h; j++) lines += `<line x1="${x}" y1="${y + j * s}" x2="${x + W}" y2="${y + j * s}"/>`; }
  return `<svg viewBox="0 0 130 96"><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#bfe8b0" stroke="#3f8f4f" stroke-width="2.5"/><g stroke="#3f8f4f" stroke-width="1">${lines}</g>
    <text x="${x + W / 2}" y="${y - 4}" font-size="9" text-anchor="middle" font-weight="bold" fill="#2b2d42">${w} m</text><text x="${x - 4}" y="${y + H / 2 + 3}" font-size="9" text-anchor="end" font-weight="bold" fill="#2b2d42">${h} m</text></svg>`;
}

// Canadian coins. Amounts are kept in cents: 325 means $3.25.
const coin = c => `<i class="coin c${c}">${c < 100 ? c + "¢" : "$" + c / 100}</i>`;
const fmt = c => c < 100 ? `${c}¢` : c % 100 ? `$${(c / 100).toFixed(2)}` : `$${c / 100}`;                        // how an amount is written
const moneySaid = c => { const d = Math.floor(c / 100), r = c % 100; return d ? `${d} dollar${d > 1 ? "s" : ""}${r ? ` and ${r} cents` : ""}` : `${r} cents`; }; // how it is said
// Money answer cards: the right amount and three believable wrong ones (always real coin amounts, never odd cents).
function moneyCards(c, list, pad = [c + 5, c + 10, c + 15]) {
  const wrong = shuffle([...new Set(list.concat(pad))].filter(x => x >= 5 && x !== c)).slice(0, 3);
  return wrong.concat(c).sort((a, b) => a - b).map(x => ({ html: `<span style="font-size:6vmin">${fmt(x)}</span>`, ok: x === c, wrong: `That is ${moneySaid(x)}.` }));
}
// A bar graph: one bar for each name. "scale" is how much each line on the side is worth.
function barGraph(names, vals, scale) {
  const top = Math.max(...vals), x0 = 16, y0 = 78, unit = 66 / top;
  let s = "";
  for (let i = 0; i <= top; i++) { const y = (y0 - i * unit).toFixed(1); s += `<line x1="${x0}" y1="${y}" x2="126" y2="${y}" stroke="#d9dbe6" stroke-width=".6"/><text x="${x0 - 2}" y="${+y + 2}" font-size="5.5" text-anchor="end" fill="#2b2d42">${i * scale}</text>`; }
  names.forEach((n, i) => { const x = x0 + 6 + i * 27, h = vals[i] * unit; s += `<rect x="${x}" y="${(y0 - h).toFixed(1)}" width="18" height="${h.toFixed(1)}" fill="${INK[i]}"/><text x="${x + 9}" y="${y0 + 8}" font-size="7" text-anchor="middle" font-weight="bold" fill="#2b2d42">${n}</text>`; });
  return `<svg viewBox="0 0 130 90">${s}<line x1="${x0}" y1="${y0}" x2="126" y2="${y0}" stroke="#2b2d42" stroke-width="1.2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="8" stroke="#2b2d42" stroke-width="1.2"/></svg>`;
}

// ---------- words, grammar and facts ----------

const SHARE = [
  (n, b) => `${n} rolls of silk are shared equally ${b > 2 ? "among" : "between"} ${b} traders. How many rolls does each trader get?`,

// ---------- teaching helpers: lessons ("watch me do one"), hints and step-by-step explanations ----------
const art = html => `<div class="lessonart">${html}</div>`;
async function frames(L, list) { for (const [html, words] of list) { L.frame(art(html)); if (!(await L.say(words))) return false; } return true; }
async function talkThrough(H, list) { for (const [html, words] of list) { H.show(art(html)); if (!(await H.say(words))) return false; } return true; }
function pointTo(H, words) { const c = H.cards().find(c => c.ch.ok); if (c) H.glow(c.el, true); return H.say(words); }
const skipList = (by, times) => Array.from({ length: times }, (_, i) => (i + 1) * by);
// Reading: find the sentence in a passage that holds the answer (the one sharing the most words with the answer and the question).
const STOP = new Set("the a an and of to in on is was were it its they them their what who why where which how did do does for with from that this there be by at as are has have".split(" "));
function answerSentence(text, ask, ans) {
  const sents = text.match(/[^.!?]+[.!?]/g) || [text], words = s => s.toLowerCase().replace(/'s\b/g, "").match(/[a-z]+/g) || [];
  const keys = [...words(ans).map(w => [w, 2]), ...words(ask).map(w => [w, 1])].filter(([w]) => w.length > 2 && !STOP.has(w));
  const score = s => { const ws = words(s); return keys.reduce((n, [k, v]) => n + (ws.some(w => w === k || w.startsWith(k.slice(0, Math.max(4, k.length - 2)))) ? v : 0), 0); };
  return sents.map(s => s.trim()).reduce((best, s) => score(s) > score(best) ? s : best, sents[0].trim());
}
const passageHtml = (text, ask) => `<div class="passage">${(text.match(/[^.!?]+[.!?]/g) || [text]).map(s => `<span class="sent">${s.trim()}</span>`).join(" ")}${ask ? `<b>${ask}</b>` : ""}</div>`;
const litSentence = (H, s) => { const el = [...H.bubble.querySelectorAll(".sent")].find(x => x.textContent === s); H.glow(el, true); return el; };
// what each sound-alike word means
const MEANS = { two: "the number 2", to: "toward a place", too: "also, or very", hear: "listening with your ears", here: "this place", hair: "what grows on your head", hare: "an animal like a rabbit",
  sea: "the ocean", see: "looking with your eyes", seen: "already looked at", know: "having it in your head", no: "the opposite of yes", now: "at this moment", write: "putting words on paper", right: "correct, or the opposite of left", rite: "a special ceremony",
  their: "belonging to them", there: "that place", "they're": "they are", wear: "putting clothes on", where: "which place", were: "the past of are", whole: "all of it", hole: "an opening or a gap", hold: "keeping it in your hands",
  flour: "powder for baking", flower: "a plant with petals", floor: "what you stand on", its: "belonging to it", "it's": "it is", is: "a word like am and are", your: "belonging to you", "you're": "you are", yore: "long, long ago" };
const means = w => MEANS[w.toLowerCase()] || "";

      [`<div class="passage">Mei has 3 bags with 4 buns in each bag. She gives away 5 buns. How many buns are left?</div>`, "Watch me solve a two step problem. First, what do I need to find? How many buns are left."],
      [`3 × 4 = 12`, "Step one. 3 bags of 4 buns is 12 buns."], [`12 − 5 = <b>7</b>`, "Step two. She gives away 5. 12 take away 5 is 7. So 7 buns are left!"]]),
    makeQuestion(step) {
      let text, ans, trap, work; // trap: the answer you get if you stop after the first step. work: Dr. Somebody's worked steps.
      const g = 2 + rand(8), k = 2 + rand(9);
      if (step === 1) { const a = 30 + rand(60), b = 11 + rand(a - 20);
        if (rand(2)) { text = `A trader has ${a} rolls of silk. He sells ${b}. How many rolls are left?`; ans = a - b; trap = a + b; work = [[`${a} − ${b} = <b>${ans}</b>`, `He sells some, so take away. ${a} take away ${b} is ${ans}.`]]; }
        else { const c = 11 + rand(60); text = `${a} kites are flying. ${c} more go up. How many kites are flying now?`; ans = a + c; trap = Math.abs(a - c); work = [[`${a} + ${c} = <b>${ans}</b>`, `More go up, so add. ${a} plus ${c} is ${ans}.`]]; } }
      else if (step === 2) {
        if (rand(2)) { text = `There are ${g} tables. Each table has ${k} bowls. How many bowls are there altogether?`; ans = g * k; trap = g + k; work = [[`${g} × ${k} = <b>${ans}</b>`, `${g} groups of ${k}, so multiply. ${g} times ${k} is ${ans}.`]]; }
        else { text = `${g * k} dumplings are shared equally by ${g} children. How many dumplings does each child get?`; ans = k; trap = g * k - g; work = [[`${g * k} ÷ ${g} = <b>${k}</b>`, `Shared equally, so divide. ${g * k} divided by ${g} is ${k}.`]]; } }
      else if (step === 3) { const kind = rand(3);
        if (kind === 0) { const b = 1 + rand(g * k - 2); text = `Mei has ${g} bags with ${k} buns in each bag. She gives away ${b} bun${b === 1 ? "" : "s"}. How many buns are left?`; ans = g * k - b; trap = g * k;
          work = [[`${g} × ${k} = ${g * k}`, `Step one. ${g} bags of ${k} is ${g * k} buns.`], [`${g * k} − ${b} = <b>${ans}</b>`, `Step two. ${g * k} take away ${b} is ${ans}.`]]; }
        else if (kind === 1) { const a = 20 + rand(40), b = 5 + rand(30), c = 5 + rand(a + b - 10); text = `Lin has ${a} coins. He earns ${b} more, then spends ${c}. How many coins does he have now?`; ans = a + b - c; trap = a + b;
          work = [[`${a} + ${b} = ${a + b}`, `Step one. ${a} plus ${b} is ${a + b}.`], [`${a + b} − ${c} = <b>${ans}</b>`, `Step two. ${a + b} take away ${c} is ${ans}.`]]; }
        else { const total = g * k, a = 1 + rand(total - 1); text = `A farmer picks ${a} basket${a === 1 ? "" : "s"} of tea in the morning and ${total - a} in the afternoon. She packs them equally into ${g} carts. How many baskets go in each cart?`; ans = k; trap = total;
          work = [[`${a} + ${total - a} = ${total}`, `Step one. ${a} plus ${total - a} is ${total} baskets.`], [`${total} ÷ ${g} = <b>${k}</b>`, `Step two. ${total} shared into ${g} carts is ${k} each.`]]; } }
      else { const kind = rand(3);
        if (kind === 0) { const b = 10 + rand(31); text = `A wall has ${g} rows of ${k} stones. Workers add ${b} more stones. How many stones are in the wall now?`; ans = g * k + b; trap = g * k;
          work = [[`${g} × ${k} = ${g * k}`, `Step one. ${g} rows of ${k} is ${g * k} stones.`], [`${g * k} + ${b} = <b>${ans}</b>`, `Step two. ${g * k} plus ${b} is ${ans}.`]]; }
        else if (kind === 1) { const left = 5 + rand(40); text = `Mei reads ${k} pages each day for ${g} days. Her book has ${g * k + left} pages. How many pages does she have left to read?`; ans = left; trap = g * k;
          work = [[`${g} × ${k} = ${g * k}`, `Step one. ${k} pages for ${g} days is ${g * k} pages read.`], [`${g * k + left} − ${g * k} = <b>${left}</b>`, `Step two. ${g * k + left} take away ${g * k} is ${left}.`]]; }
        else { const p = 5 + rand(6), q = 2 + rand(3); text = `A boat ride costs ${p} coins for an adult and ${q} coins for a child. How much does it cost for 2 adults and 3 children?`; ans = 2 * p + 3 * q; trap = p + q;
          work = [[`2 × ${p} = ${2 * p} &nbsp; 3 × ${q} = ${3 * q}`, `Step one. 2 adults cost ${2 * p}. 3 children cost ${3 * q}.`], [`${2 * p} + ${3 * q} = <b>${ans}</b>`, `Step two. ${2 * p} plus ${3 * q} is ${ans}.`]]; } }
      return { bubble: `<div class="passage">${text}</div>`, tall: true, key: text, say: step <= 2 ? text : "Read the problem carefully. Tap me if you need help reading it.", again: "Read the problem again.", help: text, yay: `Yes! The answer is ${ans}.`,
        hint: H => H.say(step >= 3 ? "This one has two steps. What do you need to find first? Then what do you do with that answer?" : "What happens in the story? Are things joined, taken away, grouped, or shared?"),
        explain: async H => (await talkThrough(H, work)) && pointTo(H, `So the answer is ${ans}.`),
        choices: near(ans, [trap, ans + 1, ans - 1, ans + 10, ans - 10].filter(x => x !== ans && x >= 0)) };
    }
  }
};
