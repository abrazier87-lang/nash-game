/* =====================================================================
   DR. SOMEBODY GOES EAST  -  the Grade 6 story
   The clock pointed east at the end of Grade 5. Dr. Somebody follows the St. Lawrence River to the Atlantic coast,
   meeting a child in each place today and looking through the clock's window at the same place long ago.
   New in this grade: the chapters are places on a map, he collects French words as he goes, and now and then
   the child chooses what he does next. The engine is shared/chapters.js; the drawing tools are shared/inkart.js.
   Every line is shown in writing only for now: the words are recorded once they are settled.
   Chapter 1 is in this page. Chapters 2 to 6 are in shared/g6-ch2.js to shared/g6-ch6.js.
   ===================================================================== */

  <g stroke="#7a4a24" stroke-width="1.4">${Array.from({ length: 9 }, (_, i) => `<line x1="${x + (-40 + i * 10) * s}" y1="${y - 20 * s}" x2="${x + (-40 + i * 10) * s}" y2="${y}"/>`).join("")}</g>`;

  ${water(196, "#6cc0ea")}${canoe(176, 212, .5, { who: 0, packs: 2 })}${fnTrader(186, 136, .5, "#3f9a80", "#e63946")}${fnTrader(214, 140, .5, "#c9602e", "#3b6ea5")}${trader(274, 142, .5)}${furs(204, 180, .7)}${kettle(250, 178, .8)}${blanket(278, 182, .7)}`;
const ART = {
  qc_arrive: () => frame(`${sky("#9fd8f2", "#f4f1d8", [344, 40, 20], [[90, 36, .8], [210, 26, .6]])}${cliff(96)}${chateau(318, 92, .8)}${house(22, 72, 30, 22, "#e63946")}${house(58, 76, 26, 20, "#3b82c4")}

  qc_windowtrade: () => frame(`${sky("#9fd8f2", "#f4f1d8", null, [[60, 40, .7]])}${water(176)}<g ${INKED}><path d="M-10 214 Q100 200 210 216 T410 214 V250 H-10 Z" fill="#d9c7a0"/></g>${windowAt(236, 112, 92, tradeLongAgo)}${owlAt(18, 118, 108)}${kidAt(118, 150, .95, LEA)}`),
  qc_choice: () => frame(`${sky("#9fd8f2", "#f4f1d8", [56, 40, 20], [[240, 30, .8]])}<g ${INKED}><path d="M-10 60 H410 V250 H-10 Z" fill="#b9a58c"/><path d="M-10 60 Q200 48 410 60" fill="none" stroke="#4aa862" stroke-width="10"/></g>${chateau(200, 58, .7)}
    <g ${INKED}><path d="M40 210 L70 190 L70 176 L100 156 L100 142 L130 122 L130 108 L160 88" fill="none" stroke-width="9" stroke="#2b1a10"/><path d="M40 210 L70 190 L70 176 L100 156 L100 142 L130 122 L130 108 L160 88" fill="none" stroke="#d9d3c6" stroke-width="5"/>
    <path d="M360 214 L250 84" fill="none" stroke-width="9" stroke="#2b1a10"/><path d="M360 214 L250 84" fill="none" stroke="#8d877b" stroke-width="5"/><rect x="286" y="118" width="34" height="26" rx="5" fill="#bfe6f7" transform="rotate(50 303 131)"/></g>
    <g ${INKED}><path d="M-10 214 H410 V250 H-10 Z" fill="#c9c3b6"/></g>${owlAt(150, 148, 84)}${kidAt(236, 172, .8, LEA)}`),
  qc_stairs: () => frame(`${sky("#9fd8f2", "#f4f1d8", [56, 40, 20], [[250, 30, .8]])}${house(-6, 70, 96, 150, "#e63946")}${house(310, 60, 100, 160, "#3b82c4")}
    <g ${INKED}>${Array.from({ length: 9 }, (_, i) => `<rect x="${104 + i * 2}" y="${200 - i * 18}" width="${192 - i * 4}" height="18" fill="${i % 2 ? "#c9c3b6" : "#d9d3c6"}"/>`).join("")}<path d="M100 214 L120 46 M300 214 L280 46" fill="none" stroke-width="4"/></g>
    <g ${INKED}><path d="M-10 218 H410 V250 H-10 Z" fill="#c9c3b6"/></g>${kidAt(214, 60, .7, LEA)}${owlAt(150, 128, 90)}`),
  qc_funicular: () => frame(`${sky("#9fd8f2", "#f4f1d8", [56, 40, 20], [[250, 30, .8]])}<g ${INKED}><path d="M-10 250 V214 L120 214 L330 50 H410 V250 Z" fill="#b9a58c"/><path d="M330 50 H410" fill="none" stroke="#4aa862" stroke-width="10"/>
    <path d="M110 222 L334 46 M130 222 L354 46" fill="none" stroke-width="4" stroke="#6a5a4c"/></g>${chateau(372, 48, .45)}
    <g transform="translate(226 132) rotate(-38)" ${INKED}><rect x="-34" y="-30" width="68" height="44" rx="8" fill="#bfe6f7"/><path d="M-34 0 H34" fill="none"/><rect x="-34" y="4" width="68" height="12" rx="4" fill="#e63946"/></g>
    <svg x="196" y="92" width="34" height="40" viewBox="0 0 200 232">${NEW_OWL.replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg><g ${INKED}><path d="M-10 222 H140 V250 H-10 Z" fill="#c9c3b6"/></g>${house(20, 176, 50, 40, "#f4b942")}`),

    <g ${INKED}><path d="M-10 190 H410 V250 H-10 Z" fill="#c89a5e"/><path d="M-10 168 H410" fill="none" stroke-width="5"/>${Array.from({ length: 14 }, (_, i) => `<path d="M${10 + i * 30} 168 V190" fill="none"/>`).join("")}</g><g stroke="#8a5a2b" stroke-width="1.4">${[204, 218, 232].map(yy => `<path d="M-10 ${yy} H410"/>`).join("")}</g>
    ${chateau(346, 168, .5)}${owlAt(70, 112, 110)}${kidAt(206, 140, 1.05, LEA)}`)

// ---------- the map: the places of this grade, along the river and the coast ----------
const eastMap = () => `<svg viewBox="0 0 400 240" preserveAspectRatio="none"><rect width="400" height="240" fill="#6cc0ea"/>
  <g ${INKED}><path d="M-10 -10 H320 Q296 30 250 44 Q190 60 150 84 Q110 104 60 118 Q30 126 -10 130 Z" fill="#a9cf86"/>
  <path d="M-10 250 V150 Q60 138 120 118 Q170 100 214 104 Q226 112 214 124 Q196 134 196 150 Q206 164 226 168 Q232 190 214 214 Q200 232 196 250 Z" fill="#b9d98f"/>
  <path d="M212 228 Q232 196 276 180 Q312 166 338 170 Q346 184 326 198 Q286 216 250 242 Q224 252 212 228 Z" fill="#b9d98f"/><path d="M340 164 Q348 138 368 142 Q380 162 362 180 Q346 184 340 164 Z" fill="#b9d98f"/>
  <path d="M246 150 Q270 138 296 148 Q270 160 246 150 Z" fill="#f2c9a0"/><path d="M318 62 Q350 34 386 56 Q398 88 372 110 Q340 118 322 96 Q310 78 318 62 Z" fill="#a9cf86"/></g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M250 100 q8 -5 16 0 t16 0 M290 126 q8 -5 16 0 t16 0 M360 214 q8 -5 16 0 M150 226 q0 0 0 0"/></g>
  <g font-size="11" font-weight="bold" fill="#2b1a10" opacity=".7"><text x="60" y="44">Quebec</text><text x="150" y="74" transform="rotate(-24 150 74)">the St. Lawrence River</text><text x="318" y="28">Newfoundland</text><text x="40" y="210">New Brunswick</text><text x="300" y="232" fill="#fff" opacity="1">Atlantic Ocean</text></g></svg>`;

// ---------- Chapter 1: the city on the cliff ----------
const cards = (n, near) => numCards(n, 1, 1000000, 4, near.filter(k => k > 0 && k !== n && Number.isInteger(k)));
const tenths = n => (n / 10).toFixed(1);
const textCards = (right, wrongs, make) => shuffle([...new Set(wrongs.filter(w => w !== right))].slice(0, 3).concat([right])).map(x => ({ html: make ? make(x) : x, ok: x === right }));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const CHAPTERS = [
  { title: "The City on the Cliff", where: "Quebec City", beats: [
    { art: "qc_arrive", word: ["bonjour", "hello"], say: ["East we go! The clock pointed this way, and look what it found. A city on a cliff, with a castle on top.",
      "This is <em>Quebec City</em>. It is one of the oldest cities in all of North America. And nearly everyone here speaks French.",
      "I know one French word. <em>Bonjour!</em> It means hello. I have said it to nine people and a pigeon."] },
    { art: "qc_lea", word: ["le fleuve", "the river"], say: ["This is Léa. She has lived here all her life, and she speaks French at home and at school.",
      "She says the castle is really a hotel, called the <em>Château Frontenac</em>. But the river is the real star.",
      "That is the St. Lawrence. Léa calls it <em>le fleuve</em>, the river. It runs all the way to the ocean, and for a long time it was the only road there was. Clock, show us!"] },
    { art: "qc_window1608", who: "The clock", say: ["Tick, tock. Time to look back. My window is open."] },
    { art: "qc_window1608", say: ["The window into the past! The year is <em>1608</em>. A French explorer named Samuel de Champlain has just built a wooden fort right here, at the foot of the cliff.",
      "First Nations peoples had lived along this river for thousands of years before he came. The name Quebec comes from an Algonquin word. It means <em>where the river narrows</em>.",
      "Long before the French city, a St. Lawrence Iroquoian village called <em>Stadacona</em> stood right here. Today the Huron-Wendat community of <em>Wendake</em> is right beside Quebec City.",
      "Champlain's ship took about two months to cross the ocean. Two months! I get restless in the bath. Let's work out that journey."] },
    { ask: "crossing", intro: "Sail the ocean with Champlain. Three right answers and we climb to the walls." },
    { art: "qc_walls", word: ["la porte", "the gate"], say: ["The little fort grew into a town, and the town became the heart of <em>New France</em>.",
      "To protect it, people built stone walls all the way around. They are still here! Quebec is the only city north of Mexico that has kept its old walls.",
      "You walk in through a great stone gate. Léa says a gate is <em>la porte</em>. The walls are 4.6 kilometres around. Léa has a map. Shall we measure?"] },
    { ask: "walls", intro: "Read Léa's map. Three right answers and the window opens again." },
    { art: "qc_windowtrade", who: "The clock", say: ["Tick, tock. The window opens again."] },
    { art: "qc_windowtrade", word: ["merci", "thank you"], say: ["Back to the window. The riverbank is busy! People are trading.",
      "The French wanted beaver furs, to make hats back in France. First Nations hunters and traders brought the furs, and traded them for things like kettles, cloth and blankets.",
      "First Nations trappers and traders were skilled partners. They knew the land, and they drove the trade. Later, the rush for beaver brought over-trapping, fighting, and new sicknesses that killed very many people.",

    { ask: "trade", intro: "Make a fair trade. Three right answers and we head up the cliff." },
    { art: "qc_choice", pick: "The old town is at the top of the cliff, and we are at the bottom. Léa says there are two ways up. Which shall we take?", options: [
      { label: "The Breakneck Stairs", art: "qc_stairs", word: ["l'escalier", "the stairs"], say: ["The stairs it is! They are called the Breakneck Stairs, and they are the oldest stairs in the city.",
        "Fifty-nine steps. Léa skipped up. I counted every one, out loud. In French, stairs are <em>l'escalier</em>."] },
      { label: "The funicular", art: "qc_funicular", word: ["le funiculaire", "the cliff railway"], say: ["The funicular it is! A little glass cabin that rides up the cliff on rails.",
        "It has carried people up and down since 1879. Léa says it is <em>le funiculaire</em>. I say it is my new favourite word."] }] },
    { ask: "climb", intro: "Nearly at the top. Three right answers finishes the chapter." },
    { art: "qc_terrace", word: ["au revoir", "goodbye"], say: ["We made it to the top. What a view! The whole river, and ships still sailing for the sea.",
      "Léa says about nine out of every ten people in this city speak French first. It has been spoken here for more than 400 years.",
      "Merci, Léa. And <em>au revoir</em>. That means goodbye, or really, until we see each other again.",
      "The river keeps going east, and so shall we. But that is another chapter. Tick tock!"] }

  { title: "The Long Farms", where: "Along the St. Lawrence" },
  { title: "Holding Back the Sea", where: "The Acadian shore, Nova Scotia" },

  { title: "The Harbour of Arrivals", where: "Halifax" },

// The questions. Each maker returns { html, text, choices, why }.  "why" is shown after two wrong tries, and after a right answer.
const ASK = {
  crossing() { // rates and ratios: an ocean crossing
    const kind = rand(3);
    if (kind === 0) { const perDay = pick([80, 90, 100, 110, 120]), days = 45 + rand(21), D = perDay * days; return { html: "", text: `A ship sails about <b>${perDay} km</b> a day. The crossing is <b>${D.toLocaleString("en-CA")} km</b>. About how many days does it take?`, choices: cards(days, [days + 1, days - 1, days + 10, days - 10, days + 5]), why: `Distance divided by speed. ${D.toLocaleString("en-CA")} ÷ ${perDay} = ${days} days.` }; }
    if (kind === 1) { const perDay = pick([12, 15, 18, 24]), days = pick([50, 60, 70]), total = perDay * days; return { html: "", text: `The ship carries <b>${total.toLocaleString("en-CA")} litres</b> of fresh water for a voyage of <b>${days} days</b>. How many litres is that for each day?`, choices: cards(perDay, [perDay + 1, perDay - 1, perDay + 6, perDay * 2, perDay - 3]), why: `Share the water over the days. ${total.toLocaleString("en-CA")} ÷ ${days} = ${perDay} litres a day.` }; }
    const [a, b] = pick([[3, 2], [4, 1], [5, 2], [3, 1], [5, 3], [7, 2]]), m = pick([4, 5, 6, 8]), right = `${a} : ${b}`;
    return { html: "", text: `On board are <b>${a * m} sailors</b> and <b>${b * m} passengers</b>. What is the ratio of sailors to passengers, in its simplest form?`, choices: textCards(right, [`${b} : ${a}`, `${a * m} : ${b}`, `${a + 1} : ${b}`, `${a} : ${b + 1}`, `${a * 2} : ${b}`], x => `<span class="ratio">${x}</span>`), why: `Divide both numbers by ${m}. ${a * m} ÷ ${m} = ${a}, and ${b * m} ÷ ${m} = ${b}. The ratio is ${a} to ${b}.` };
  },
  walls() { // map scale: a ratio between the map and the real world

    if (kind === 0) { const km = 20 + rand(60), n = km * 100; return { html: "", text: `The walls are measured in kilometres, but Léa's map uses metres. How many <b>metres</b> is <b>${tenths(km)} km</b>?`, choices: cards(n, [n / 10, n * 10, n + 100, n - 100, km]), why: `There are 1,000 metres in a kilometre. ${tenths(km)} × 1,000 = ${n.toLocaleString("en-CA")} metres.` }; }
    if (kind === 1) { const cm2 = 3 + rand(14), n = scale * cm2 / 2; return { html: "", text: `On the map, <b>1 cm</b> stands for <b>${scale} m</b>. A street measures <b>${tenths(cm2 * 5)} cm</b> on the map. How long is the real street, in metres?`, choices: cards(n, [n + scale, n - scale, scale + cm2, n * 2, n + scale / 2]), why: `Multiply by the scale. ${tenths(cm2 * 5)} × ${scale} = ${n.toLocaleString("en-CA")} metres.` }; }

    if (kind === 1) { const each = 3 + rand(5), q = 6 + rand(9), r = 1 + rand(each - 1), N = each * q + r; return { html: "", text: `A hunter brings <b>${N} furs</b>. One kettle costs <b>${each} furs</b>. He trades for as many kettles as he can. How many furs does he have left over?`, choices: cards(r, [q, r + 1, r - 1, each, r + 2].filter(k => k !== r)), why: `${q} kettles cost ${q} × ${each} = ${q * each} furs. ${N} − ${q * each} = ${r} left over.` }; }
    const [pc, part, whole] = pick([[25, 20, 80], [50, 30, 60], [75, 60, 80], [20, 10, 50], [40, 20, 50], [60, 30, 50], [80, 40, 50], [25, 15, 60], [75, 45, 60], [10, 8, 80]]);

  },
  climb() { // percents of an amount
    const kind = rand(3);

    if (kind === 1) { const [pc, done] = pick([[25, 15], [50, 30], [75, 45], [20, 12], [40, 24], [60, 36], [80, 48], [10, 6], [90, 54]]); return { html: "", text: `Another staircase in the old city has <b>60</b> steps. Léa has climbed <b>${done}</b> of them. What percent of the way up is she?`, choices: textCards(pc + "%", [pc + 10, pc - 10, done, 100 - pc, pc + 5].filter(k => k > 0 && k < 100).map(k => k + "%")), why: `${done} out of 60. ${done} ÷ 60 = ${(done / 60).toFixed(2).replace(/0$/, "")}, which is ${pc} percent.` }; }
    const price = pick([4, 5, 6]), people = pick([4, 5, 6, 8, 10]), total = price * people, pc = pick([10, 20, 50]), off = total * pc / 100, n = total - off;
    return { html: "", text: `A ride up costs <b>$${price}</b> each. A group of <b>${people}</b> gets <b>${pc}% off</b> the total. How much do they pay altogether?`, choices: textCards(`$${n % 1 ? n.toFixed(2) : n}`, [total, total - pc, n + price, off, n - price].filter(k => k > 0).map(k => `$${k % 1 ? k.toFixed(2) : k}`)), why: `The total is ${people} × $${price} = $${total}. ${pc}% of $${total} is $${off % 1 ? off.toFixed(2) : off}. $${total} − $${off % 1 ? off.toFixed(2) : off} = $${n % 1 ? n.toFixed(2) : n}.` };
  }
};
