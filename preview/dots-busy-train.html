<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dot's Train">
<link rel="manifest" href="manifest.webmanifest">
<title>Dot's Busy Train</title>
<link rel="stylesheet" href="shared/kit.css?v=48">
<style>
  :root { --sky1:#ffd9a0; --sky2:#fff6e0; --grass:#8fd694; --grass2:#5fb96a; --title-shadow:#c7383d; }
  #title .host { width:34vmin; height:28vmin; }
  /* the train */
  .train { display:flex; align-items:flex-end; gap:.8vmin; margin-top:3vmin; padding:0 3vmin; border-bottom:1.2vmin solid #6b4a2b; }
  .engine { width:26vmin; height:21vmin; }
  .car { width:15vmin; height:16vmin; position:relative; }
  .car .box { position:absolute; left:0; right:0; bottom:2.6vmin; height:7vmin; border-radius:1.5vmin; box-shadow:inset 0 -1.5vmin 0 rgba(0,0,0,.15); }
  .car .rider { position:absolute; left:0; right:0; bottom:8.6vmin; text-align:center; font-size:8vmin; line-height:1; }
  .car .rider.empty { font-size:5vmin; bottom:10vmin; color:rgba(43,45,66,.35); font-weight:bold; }
  .car i { position:absolute; bottom:0; width:5.4vmin; height:5.4vmin; border-radius:50%; background:#8d93ab; border:1.4vmin solid #39405a; }
  .car i.w1 { left:1.4vmin; } .car i.w2 { right:1.4vmin; }
  .stickers { display:flex; gap:.6vmin; margin-top:1.5vmin; height:6vmin; align-items:center; font-size:4.6vmin; }
  .stickers small { font-size:2.6vmin; font-weight:bold; margin-right:1vmin; }
  /* picking up a passenger */
  #board .stage { width:46vmin; height:46vmin; font-size:34vmin; line-height:46vmin; text-align:center; }
  /* the big finish */
  #finale .train { border-bottom:none; animation:arrive 2.4s ease-out both; }
  @keyframes arrive { from { transform:translateX(-130vw); } to { transform:translateX(0); } }
  .word { font-size:9vmin; } .word.long { font-size:7vmin; }
  /* the passenger waiting at a station gently bobs */
  .place .badge.wait { animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-1vmin); } }
  /* counting along: Dot points at each picture in turn and its number appears above it */
  .grid5 span { display:inline-block; position:relative; transition:transform .15s; }
  .grid5 span.lit { transform:scale(1.35); filter:drop-shadow(0 0 1vmin #ffd23f); }
  .grid5 span.counted::after { content:attr(data-n); position:absolute; left:50%; top:-.9em; transform:translateX(-50%); font-size:.5em; font-weight:bold; color:#ff8a3d; }
  /* the fair */
  #fair { justify-content:space-around; }
  .fairground { font-size:15vmin; line-height:1; letter-spacing:2vmin; }
  .friends, .souvenirs { display:flex; gap:3vmin; justify-content:center; flex-wrap:wrap; }
  .friends button { font-size:15vmin; line-height:1.1; }
  .souvenirs { visibility:hidden; } .souvenirs.show { visibility:visible; }
  .souvenirs button { width:18vmin; height:18vmin; border-radius:4vmin; background:var(--card,#fffdf5); border:1vmin solid #fff; box-shadow:0 1.2vmin 0 rgba(0,0,0,.18); font-size:11vmin; line-height:1; }
  .souvenirs button.picked { background:#d6ffc4; border-color:#55b85c; }
  .souvenirs button.dim { opacity:.35; }
  .souvenirs .pickline { flex-basis:100%; margin:0; text-align:center; font-size:3.4vmin; font-weight:bold; }
  #fair h1 { margin:0; }
  /* lessons: the big ▶ skips Dot's "watch me" (on a phone held upright it sits between Dot and the cards) */
  #myTurn { position:absolute; right:3vmin; bottom:3vmin; width:19vmin; height:19vmin; z-index:6; }
  #myTurn .tri { border-left-width:7vmin; border-top-width:4.6vmin; border-bottom-width:4.6vmin; margin-left:1.6vmin; }
  @media (orientation:portrait) { #myTurn { right:auto; left:calc(50% - 9.5vmin); bottom:auto; top:61%; } }
  #bubble .glow { outline:none; filter:drop-shadow(0 0 .8vmin #ffb300) drop-shadow(0 0 .8vmin #ffd23f); transform:scale(1.15); }
  /* dice dots (see how many at a glance) and the ten-frame (how many more make ten?) */
  .dice { display:grid; grid-template-columns:repeat(3, 5vmin); grid-template-rows:repeat(3, 5vmin); gap:1vmin; padding:1.6vmin; border:.7vmin solid #39405a; border-radius:3vmin; background:#fff; }
  .dice i { border-radius:50%; } .dice i.on { background:#39405a; }
  .tenframe { display:grid; grid-template-columns:repeat(5, 7.5vmin); gap:.8vmin; }
  .tenframe i { height:7.5vmin; border:.5vmin solid #8d93ab; border-radius:1.4vmin; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:5vmin; line-height:1; background:#fff; }
  .tenframe i.counted::after { content:attr(data-n); font-size:4vmin; font-weight:bold; color:#ff8a3d; }
  .pattern { display:flex; gap:1vmin; align-items:center; font-size:7vmin; }
</style>
</head>
<body class="game">
<div id="app">
  <div class="layer"><div class="sun"></div><div class="cloud"></div><div class="cloud c2"></div>
  <div class="hill back"></div><div class="hill"></div></div>
  <div class="layer" id="fx"></div>

  <div class="screen on" id="title">
    <h1>Dot's Busy Train</h1>
    <p class="sub" id="titleSub">A kindergarten adventure</p>
    <div class="host" id="titleDot"></div>
    <button class="bigbtn" id="playBtn" aria-label="Play"><span class="tri"></span></button>
  </div>

  <div class="screen" id="map">
    <div class="places" id="places"></div>
    <div class="train" id="train"></div>
    <div class="stickers" id="stickers"></div>
  </div>

  <div class="screen" id="game">
    <div class="stars" id="stars"></div>
    <div class="cheer" id="cheer"></div>
    <div class="ask">
      <button class="host" id="gameDot" aria-label="Say it again"></button>
      <div class="bubble" id="bubble"></div>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="screen" id="board">
    <button class="stage" id="boardStage" aria-label="Tap the animal"></button>
    <button class="bigbtn go" id="boardGo" aria-label="Keep going"><span class="tri"></span></button>
  </div>

  <div class="screen" id="scene"><div class="scenestage" id="sceneStage"></div><div class="scenecap" id="sceneCap"></div><button class="bigbtn sceneskip" id="sceneGo" aria-label="Keep going"><span class="tri"></span></button></div>
  <div class="screen" id="finale">
    <h1>Off to the fair!</h1>
    <div class="train" id="finaleTrain"></div>
    <button class="bigbtn go" id="finaleGo" aria-label="Go to the fair"><span class="tri"></span></button>
  </div>

  <div class="screen" id="fair">
    <h1>At the fair!</h1>
    <div class="fairground" aria-hidden="true">🎡🎪🎠</div>
    <div class="friends" id="fairFriends"></div>
    <div class="souvenirs" id="souvenirs"></div>
    <button class="bigbtn go" id="fairGo" aria-label="Back to the train"><span class="tri"></span></button>
  </div>

  <button class="corner left" id="homeBtn" aria-label="Back to the stations" style="display:none">🏠</button>
  <button class="corner left" id="shelfBtn" aria-label="Back to the book shelf">📚</button>
  <button class="corner right" id="grownBtn" aria-label="Grown-ups: press and hold">⚙️</button>
  <button class="corner right hint" id="hintBtn" aria-label="Hint (one each round)" style="display:none">💡</button>
  <button class="corner right lesson" id="lessonBtn" aria-label="Show me how" style="display:none">📖</button>
  <button class="bigbtn" id="myTurn" aria-label="My turn" style="display:none"><span class="tri"></span></button>

  <div id="grown"><div class="panel" id="grownPanel"></div></div>
</div>

<script src="shared/kit.js?v=48"></script>

function letterHint(H, L, lower) {
  const [w, e] = LETTER_WORDS[L], shown = lower ? L.toLowerCase() : L;
  if (L === "X") { H.show(`${e} fo<b>${shown}</b>`); return H.say("Fox ends with X. Look at the last letter of fox."); }
  H.show(`${e} <b>${shown}</b>${w.slice(1)}`);

}
function soundHint(H, L, byLetter, model, answer) {

  H.show(`<b>${L}</b>${model[0].slice(1)}`);
  return H.say(`${cap(model[0])} starts with ${L}. Say each picture's name. Which one starts with ${L} too?`);
}
// Counts the number tiles with the child (in Dot's own voice), then asks the last part.
async function countTiles(H, last) {
  for (const t of H.bubble.querySelectorAll(".tile")) {
    const n = +t.textContent; H.glow(t, true);
    const ok = await H.say(String(n), n >= 1 && n <= 20 ? () => speak("num-" + n, cap(NUM[n])) : null);
    H.glow(t, false); if (!ok) return false;

  return H.say(last);
}

//     choices: [{ html, ok, wrong: what Dot says if this wrong card is tapped }], pause: optional wait in ms,
//     hint(P): Dot's nudge (the 💡, and the "try together" questions after a lesson),

// lesson(P, step): the "watch me" lesson on the first visit (and from the 📖 button).
// Runs a little show: each step changes the picture, then Dot says the words (or plays a recorded number).
async function steps(P, list) { for (const [change, words, clip] of list) { if (change) change(); if (!(await P.say(words, clip))) return false; } return true; }

  const still = () => G && G.q === q && !G.busy && G.counting === me;
  const items = [...$("bubble").querySelectorAll(".grid5 span")].filter(s => !s.classList.contains("gone"));
  items.forEach(s => s.classList.remove("lit", "counted"));
  if (voiced && !(await speak("count-along", "Let's count them together."))) return;
  let finished = true;
  for (let i = 0; i < items.length; i++) {
    if (!still()) { finished = false; break; }
    items.forEach(s => s.classList.remove("lit"));
    items[i].dataset.n = i + 1; items[i].classList.add("lit", "counted");
    const ok = voiced ? await speak("num-" + (i + 1), cap(NUM[i + 1])) : (await wait(700), true);
    if (!ok) { finished = false; break; }
  }
  items.forEach(s => s.classList.remove("lit"));
  if (finished && still() && voiced) talk(q.again || q.say);
}
// Quietly make a station harder after 3 right in a row, easier after 2 hard questions in a row.
function adjust(firstTry) {
  if (!S.auto) return;
  if (firstTry) { G.streak++; G.rough = 0; if (G.streak >= 3 && S.skill[G.id] < 4) { S.skill[G.id]++; G.streak = 0; } }
  else { G.rough++; G.streak = 0; if (G.rough >= 2 && S.skill[G.id] > 1) { S.skill[G.id]--; G.rough = 0; } }
  save();
}
function finishGame() {
  const id = G.id; G = null; Kit.finish("k", id); // a round was won here: the lesson is finished (for the progress report)
  if (S.aboard[id]) { // this station's passenger is already on the train: just celebrate
    sfx.party(); confetti(30);
    Promise.all([speak("replay", "Great job! You did it again!"), wait(2600)]).then(() => { if (current === "game") showMap(); }); // back to the stations once Dot has finished
  } else { // a short celebration scene first, starring the passenger, with a fun fact about that animal. The very first time, Dr. Somebody floats by too.
    const p = passengerAt(id), stops = (S.metDoc ? [] : [DOC_HELLO]).concat({ say: ANIMAL_FACTS[p.name], show: [[p.pic, 4, 8, 30], ["engine", 34, 6, 26], [p.snack[2], 60, 28, 12], [p.snack[2], 66, 12, 10]] });
    S.metDoc = true; save();
    playScene(stops, () => startBoard(id));
  }
}

// ---------- celebration scenes ----------
// Dr. Somebody's clock balloon (a time machine, from the older grades' games) drifts across, the passenger pops up with their
// snacks and Dot's train, and Dot says a fun fact about that animal. The ▶ skips ahead.
// Dot's lines are recorded in pieces in audio/dot/l/; Dr. Somebody's line is in audio/dot/doc/.
const BALLOON = `<svg viewBox="0 0 160 200"><path d="M80 6 C28 6 14 50 20 82 C26 112 56 132 80 140 C104 132 134 112 140 82 C146 50 132 6 80 6 Z" fill="#ff5a5f"/>
  <path d="M80 6 C58 20 50 60 56 96 C60 118 72 134 80 140 C88 134 100 118 104 96 C110 60 102 20 80 6 Z" fill="#ffd23f"/>
  <circle cx="80" cy="70" r="34" fill="#fff" stroke="#39405a" stroke-width="5"/>
  <g stroke="#39405a" stroke-width="4" stroke-linecap="round"><line x1="80" y1="42" x2="80" y2="48"/><line x1="80" y1="92" x2="80" y2="98"/><line x1="52" y1="70" x2="58" y2="70"/><line x1="102" y1="70" x2="108" y2="70"/></g>
  <line x1="80" y1="70" x2="80" y2="50" stroke="#39405a" stroke-width="5" stroke-linecap="round"/><line x1="80" y1="70" x2="97" y2="79" stroke="#ff5a5f" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="70" r="4" fill="#39405a"/>
  <line x1="56" y1="130" x2="62" y2="162" stroke="#c9a37a" stroke-width="3"/><line x1="104" y1="130" x2="98" y2="162" stroke="#c9a37a" stroke-width="3"/>
  <circle cx="80" cy="154" r="13" fill="#9c6b3f"/><circle cx="75" cy="152" r="5" fill="#fff"/><circle cx="85" cy="152" r="5" fill="#fff"/><circle cx="75" cy="152" r="2" fill="#2b2d42"/><circle cx="85" cy="152" r="2" fill="#2b2d42"/>
  <rect x="56" y="160" width="48" height="32" rx="7" fill="#c48a4a"/><rect x="56" y="160" width="48" height="7" rx="3" fill="#9c6830"/></svg>`;
const DOC_HELLO = { doc: true, say: "Hello, Dot! Doctor Somebody here, floating by in my clock balloon. Have a wonderful time at the fair!", show: [["engine", 14, 6, 30], ["🎡", 52, 8, 22]] };
const ANIMAL_FACTS = { lion: "Fun fact! A lion's roar can be heard from far, far away!", elephant: "Fun fact! Elephants use their trunks to drink, to smell, and to say hello!",
  monkey: "Fun fact! Monkeys are great climbers, and some use their tails like an extra hand!", panda: "Fun fact! Pandas spend most of the day eating bamboo!",
  penguin: "Fun fact! Penguins can't fly, but they are super swimmers!", giraffe: "Fun fact! Giraffes are the tallest animals in the whole world!",
  koala: "Fun fact! Koalas sleep for most of the day and night!", tiger: "Fun fact! Every tiger has its very own pattern of stripes!",
  zebra: "Fun fact! No two zebras have the same stripes!", rabbit: "Fun fact! Rabbits can hop very fast, and zig-zag to get away!",
  fox: "Fun fact! Foxes curl their big, bushy tails around them to keep warm!", bear: "Fun fact! Many bears sleep through the winter in a cozy den!",
  frog: "Fun fact! Frogs start life as tadpoles, swimming in the water!", pig: "Fun fact! Pigs roll in the mud to stay cool!" };
let SC = null;
async function playScene(stops, then) {
  const me = SC = { then, done: false }, alive = () => SC === me && !me.done;
  show("scene"); const stage = $("sceneStage"); stage.innerHTML = `<div class="sballoon">${BALLOON}</div>`; sfx.party(); confetti(25);
  for (const stop of stops) {
    if (!alive()) return;
    stage.querySelectorAll(".sitem").forEach(e => e.classList.add("gone"));
    stop.show.forEach(([pic, x, y, size], i) => { const d = document.createElement("div"); d.className = "sitem"; d.style.cssText = `left:${x}%;bottom:${y}%;width:${size}vmin;height:${size}vmin;font-size:${(size * .85).toFixed(1)}vmin;animation-delay:${(i * .35).toFixed(2)}s`;
      d.innerHTML = pic === "engine" ? ENGINE : PASSENGER_ART[pic] ? faceSvg(pic, "100%") : `<span class="emo">${pic}</span>`; stage.appendChild(d); });
    $("sceneCap").textContent = stop.say;
    const said = Kit.settings.voice ? await (stop.doc ? Kit.playClip("../audio/dot/doc/" + Kit.clipName(stop.say) + ".mp3", stop.say) : talk(stop.say, true)) : (await wait(1500 + stop.say.length * 45), true); // fun facts are recorded whole
    if (!said || !alive()) return;
    await wait(700);
  }
  if (alive()) { await wait(600); endScene(me); }
}
function endScene(me) { if (!me || me.done || SC !== me) return; me.done = true; SC = null; Kit.hush(); me.then(); }
$("sceneGo").addEventListener("click", () => { sfx.tap(); endScene(SC); });

// ---------- a passenger gets on ----------
let B = null;
function startBoard(id) {
  const who = passengerAt(id); // the passenger the child chose to help
  B = { id, who, taps: 0, done: false };
  $("boardStage").innerHTML = faceSvg(who.pic);
  $("boardGo").classList.remove("show");
  show("board"); sfx.party(); confetti(25); animate($("boardStage"), "pop");
  speak("won-" + who.name, `You did it! The ${who.name} wants a ride. Tap the ${who.name}!`);
  Kit.loadClip("../audio/dot/boarded-" + who.name + ".mp3").catch(() => {}); // get the next line ready so it starts without a pause
}
$("boardStage").addEventListener("click", () => {
  if (!B || B.done) return;
  B.taps++; sfx.tap(); animate($("boardStage"), "bounce");
  if (B.taps >= 2) {
    B.done = true;
    S.aboard[B.id] = B.who.pic; S.stickers.push(B.who.pic); save();
    sfx.whistle(); confetti(50);
    speak("boarded-" + B.who.name, `All aboard! The ${B.who.name} is on the train!`);
    setTimeout(() => $("boardGo").classList.add("show"), 1200);
  }
});
$("boardGo").addEventListener("click", () => {
  sfx.tap(); B = null;
  if (riders().length >= rideSize()) showFinale(); else showMap();
});

// ---------- the big finish (when the train is full) ----------
function showFinale() {
  $("finaleTrain").innerHTML = trainHTML(riders().slice(0, rideSize()));
  $("finaleGo").classList.remove("show");
  show("finale"); sfx.chug(); sfx.whistle(); confetti(80);
  speak("finale", `Choo choo! The train is full! Off to the fair we go! Thank you${NAME ? ", " + NAME : ""}!`);
  setTimeout(() => $("finaleGo").classList.add("show"), 3000);
}
$("finaleGo").addEventListener("click", () => {
  sfx.tap();
  const went = riders().slice(0, rideSize()).map(pic => PASSENGERS.find(p => p.pic === pic)).filter(Boolean);
  S.aboard = {}; S.waiting = null; S.trips++; save(); Kit.stamp("k");
  showFair(went);
});

// ---------- the fair: the passengers react when tapped, then the child picks a souvenir ----------
let F = null;
function showFair(went) {
  F = { went, tapped: new Set(), offered: false, picked: false, since: performance.now(), lastTap: performance.now(), timer: null };
  $("fairFriends").innerHTML = "";
  went.forEach(p => {
    const b = document.createElement("button"); b.innerHTML = faceSvg(p.pic); b.setAttribute("aria-label", p.name);
    b.addEventListener("click", () => {
      if (!F) return; sfx.tap(); animate(b, "bounce"); F.tapped.add(p.name); F.lastTap = performance.now();
      speak("fair-" + p.name, p.fair).then(finished => { if ((finished || !Kit.settings.voice) && F && F.tapped.size >= F.went.length) offerSouvenirs(); }); // once everyone has had their turn
    });
    $("fairFriends").appendChild(b);
  });
  $("souvenirs").classList.remove("show"); $("souvenirs").innerHTML = "";
  $("fairGo").classList.remove("show");
  show("fair"); sfx.party(); confetti(60);
  went.forEach(p => Kit.loadClip("../audio/dot/fair-" + p.name + ".mp3").catch(() => {}));
  speak("fair", "We made it to the fair! Tap your friends to see what they like best.");
  // if the child does not tap everyone, the souvenirs still appear after a while (but never in the middle of tapping)
  F.timer = setInterval(() => {
    if (!F || current !== "fair") return;
    const now = performance.now();
    if (!F.offered && now - F.since > 12000 && now - F.lastTap > 5000) offerSouvenirs();
  }, 1000);
}
function offerSouvenirs() {
  if (!F || F.offered) return; F.offered = true;
  const have = S.souvenirs || [], fresh3 = shuffle(SOUVENIRS.filter(s => !have.includes(s)));
  const box = $("souvenirs"); box.innerHTML = `<p class="pickline">Pick a souvenir to take home!</p>`;
  (fresh3.length >= 3 ? fresh3 : shuffle(SOUVENIRS)).slice(0, 3).forEach(s => {
    const b = document.createElement("button"); b.textContent = s; b.setAttribute("aria-label", "souvenir");
    b.addEventListener("click", () => pickSouvenir(b, s)); box.appendChild(b);
  });
  box.classList.add("show"); animate(box, "pop");
  speak("souvenir", "Now pick a souvenir to take home!");
}
function pickSouvenir(b, s) {
  if (!F || F.picked) return; F.picked = true; clearInterval(F.timer);
  sfx.yes(); b.classList.add("picked"); [...$("souvenirs").querySelectorAll("button")].forEach(x => { if (x !== b) x.classList.add("dim"); });
  S.souvenirs = (S.souvenirs || []).concat(s); save();
  speak("souvenir-picked", "Great choice! You can keep it forever.");
  setTimeout(() => $("fairGo").classList.add("show"), 1200);
}
$("fairGo").addEventListener("click", () => { sfx.tap(); if (F) clearInterval(F.timer); F = null; showMap("again"); });

// ---------- the stations (map) ----------
function showMap(line) {
  const on = riders(), size = rideSize();
  if (on.length >= size) { showFinale(); return; }
  $("places").innerHTML = "";
  GAME_IDS.forEach(id => {
    const g = GAMES[id], p = passengerAt(id), b = document.createElement("button");
    b.className = "place" + (S.aboard[id] ? " done" : "");
    // each station shows the passenger waiting there (bobbing), or the one already helped
    b.innerHTML = `<div class="pic">${g.icon}</div><div class="name">${g.name}</div><div class="badge${S.aboard[id] ? "" : " wait"}">${faceSvg(p.pic)}</div>`;
    b.setAttribute("aria-label", `${g.name}: help the ${p.name}`);
    b.addEventListener("click", () => { sfx.tap(); startGame(id); });
    $("places").appendChild(b);
  });
  $("train").innerHTML = trainHTML(Array.from({ length: size }, (_, i) => on[i] || null));
  const keep = (S.souvenirs || []).slice(-14);
  $("stickers").innerHTML = keep.length ? `<small>Souvenirs:</small>` + keep.map(e => `<span>${e}</span>`).join("") : "";
  show("map");
  const left = size - on.length; // empty seats on this ride's train
  if (line === "hello") speak("hello", `Hi${NAME ? " " + NAME : ""}! I'm Dot. The animals want to go to the fair! Tap a station to pick up a passenger.`);
  else if (line === "again") speak("again", "The train is back! More animals want a ride. Tap a station!");
  else if (left === size && S.trips === 0) speak("first", "Let's start with a short ride! Pick one passenger to take to the fair.");
  else if (left === size) speak("start", "The animals want to go to the fair! Tap a station to pick up a passenger.");
  else speak("left" + left, left === 1 ? "One more seat on the train! Tap a station." : `${cap(NUM[left])} more seats on the train! Tap a station.`);
}

// ---------- buttons ----------
$("titleDot").innerHTML = DOT;
if (NAME) $("titleSub").textContent = "A kindergarten adventure for " + NAME;
$("playBtn").addEventListener("click", () => {
  Kit.audio(); sfx.tap();
  // get the most-used recorded lines ready, so they start without a pause (a missing file is simply skipped)
  ["hello", "start", "first", "left1", "left2", "left3", "again", "replay", "finale", "count-along", "fair", "souvenir", "souvenir-picked"]
    .concat(GAME_IDS.map(id => "intro-" + id), GAME_IDS.map(id => "wish-" + passengerAt(id).name), Array.from({ length: 10 }, (_, i) => "num-" + (i + 1)))
    .forEach(n => Kit.loadClip("../audio/dot/" + n + ".mp3").catch(() => {}));
  showMap(riders().length ? undefined : "hello");
});
$("gameDot").addEventListener("click", () => { if (G && G.q && !G.busy) { animate($("gameDot"), "wobble"); talk(G.q.sayParts || G.q.say); } });
// little surprises: tap the scenery (the sun, a cloud) and it hops or spins; every 7th tap throws a little confetti
let sceneryPokes = 0;
$("app").addEventListener("click", e => {
  if (!e.target.classList || !e.target.classList.contains("screen")) return; // only taps on the empty background
  const things = [...document.querySelector("#app > .layer").children].reverse();
  const hit = things.find(el => { const r = el.getBoundingClientRect(); return r.width && r.width < innerWidth * .6 && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom && getComputedStyle(el).opacity !== "0"; });
  if (!hit || !hit.animate) return;
  Kit.audio(); sfx.boing(); sceneryPokes++;
  if (hit.classList.contains("sun")) hit.animate([{ rotate: "0deg", scale: "1" }, { rotate: "180deg", scale: "1.25" }, { rotate: "360deg", scale: "1" }], { duration: 800, easing: "ease-in-out" });
  else hit.animate([{ translate: "0 0", rotate: "0deg" }, { translate: "0 -4vmin", rotate: "-5deg" }, { translate: "0 0", rotate: "4deg" }, { translate: "0 -1.5vmin", rotate: "0deg" }, { translate: "0 0" }], { duration: 650, easing: "ease-out" });
  if (sceneryPokes % 7 === 0) { sfx.sparkle(); confetti(14); }
});
$("homeBtn").addEventListener("click", () => { sfx.tap(); G = null; Kit.hush(); showMap(); });
// The hint button: one per round. It takes away one wrong answer, then shows how to think about the question.
$("hintBtn").addEventListener("click", async () => {
  if (!G || G.busy || !G.q || G.hints <= 0) return;
  const q = G.q; G.hints--; G.hinted = true; G.asked = true; G.perfect = false; G.run = 0; $("hintBtn").classList.add("used"); sfx.tap(); Kit.hush();
  Kit.dropOneWrong($("choices"));
  const g = G, H = helper(q, () => G === g && g.q === q && !g.busy);
  if (q.hint) await q.hint(H); else if (q.teach) await countAlong(q); else await H.say(q.say);
});
// 📖: watch Dot's lesson again. ▶: skip the lesson and start playing.
$("lessonBtn").addEventListener("click", () => { if (!G || G.lesson || !GAMES[G.id].lesson || (G.busy && G.q)) return; sfx.tap(); runLesson(false); });
$("myTurn").addEventListener("click", () => { if (G && G.lesson) { sfx.tap(); endLesson(G); } });
$("shelfBtn").addEventListener("click", () => { Kit.hush(); location.href = "index.html"; });

// ---------- grown-ups corner (press and hold the gear) ----------
function openGrown() {
  Kit.hush();
  $("grownPanel").innerHTML = `<h2>Grown-ups <small class="soon" style="font-size:13px;font-weight:normal">Version ${Kit.VERSION}</small></h2>
    <p><b>Kindergarten (ages 5-6).</b> ${NAME ? "Playing as <b>" + Kit.esc(NAME) + "</b>." : `<span class="soon">No name picked. Pick one on the book shelf to keep each child's progress separate.</span>`}</p>
    <p><a href="progress.html" style="font-weight:bold">📊 Progress report</a>: what is going well and what to practise next.</p>
    <p>Passengers picked up so far: <b>${S.stickers.length}</b> &nbsp;|&nbsp; Trains sent to the fair: <b>${S.trips}</b> &nbsp;|&nbsp; Souvenirs: <b>${(S.souvenirs || []).length}</b></p>
    <p class="soon">Rides grow as a child plays: the first ride takes 1 passenger and 3 right answers, the second takes 2 passengers, then a full train of 4.</p>
    ${GAME_IDS.map(id => `<div class="line"><div><b>${GAMES[id].name}</b><br><small>Step ${S.skill[id]} of 4: ${STEP_NAMES[id][S.skill[id] - 1]}</small></div>
      <div class="pm"><button data-act="down" data-id="${id}">-</button><button data-act="up" data-id="${id}">+</button></div></div>`).join("")}
    <div class="line"><div>Adjust difficulty automatically</div><button data-act="auto">${S.auto ? "On" : "Off"}</button></div>
    <div class="line"><div>Dot's talking voice</div><button data-act="voice">${Kit.settings.voice ? "On" : "Off"}</button></div>
    <div class="line"><div>Sound effects</div><button data-act="sound">${Kit.settings.sound ? "On" : "Off"}</button></div>
    <div class="line"><div>Music</div><button data-act="music">${Kit.settings.music ? "On" : "Off"}</button></div>
    <div class="foot"><button class="warn" data-act="reset">Start over (erase progress)</button><button class="main" data-act="close">Done</button></div>`;
  $("grown").classList.add("on");
}
Kit.hold($("grownBtn"), openGrown);
$("grownPanel").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === "up") S.skill[id] = Math.min(4, S.skill[id] + 1);
  if (act === "down") S.skill[id] = Math.max(1, S.skill[id] - 1);
  if (act === "auto") S.auto = !S.auto;
  if (act === "voice") Kit.settings.voice = !Kit.settings.voice;
  if (act === "sound") Kit.settings.sound = !Kit.settings.sound;
  if (act === "music") { Kit.settings.music = !Kit.settings.music; if (!Kit.settings.music) Kit.stopMusic(); }
  if (act === "reset") { if (!confirm("Erase this game's progress and start over?")) return; S = fresh(); }
  save(); Kit.saveSettings();
  if (act === "close") { $("grown").classList.remove("on"); if (current === "map") showMap(); return; }
  if (act === "reset") { $("grown").classList.remove("on"); show("title"); return; }
  openGrown();
});
$("grownPanel").addEventListener("change", e => {
});
</script>
