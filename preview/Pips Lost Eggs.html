<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pip's Eggs">
<link rel="manifest" href="manifest.webmanifest">
<title>Pip's Lost Eggs</title>
<style>
  :root { --sky1:#9be3ff; --sky2:#e8fbff; --grass:#7ed67a; --grass2:#55b85c; --ink:#2b2d42; --card:#fffdf5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--sky1);
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; overscroll-behavior:none; }
  #app { position:fixed; inset:0; background:linear-gradient(var(--sky1),var(--sky2) 60%); overflow:hidden; overflow:clip; }
  .layer { position:absolute; inset:0; overflow:hidden; overflow:clip; pointer-events:none; }
  #fx { z-index:8; }
  /* scenery */
  .hill { position:absolute; left:-10%; right:-10%; bottom:-22vmin; height:50vmin; background:var(--grass); border-radius:50% 50% 0 0; }
  .hill.back { bottom:-12vmin; left:30%; right:-40%; height:56vmin; background:var(--grass2); }
  .sun { position:absolute; top:4vmin; right:6vmin; width:16vmin; height:16vmin; border-radius:50%; background:#ffd84d; box-shadow:0 0 0 3vmin rgba(255,216,77,.3); }
  .cloud { position:absolute; top:10vmin; left:-30vmin; width:26vmin; height:8vmin; background:#fff; border-radius:8vmin; opacity:.85; animation:drift 70s linear infinite; }
  .cloud::before { content:""; position:absolute; left:5vmin; top:-4vmin; width:12vmin; height:10vmin; background:#fff; border-radius:50%; }
  .cloud.c2 { top:24vmin; animation-duration:100s; animation-delay:-40s; transform:scale(.7); }
  @keyframes drift { to { left:110vw; } }

  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:2vmin; }
  .screen.on { display:flex; }
  button { font:inherit; color:inherit; border:none; background:none; padding:0; margin:0; cursor:pointer; touch-action:manipulation; }
  svg { display:block; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .m { fill:var(--m,#58b368); } .d { fill:var(--d,#2f7d44); } .b { fill:#fff3c9; } .e { fill:#fff; } .p { fill:#2b2d42; }
  .shadow svg * { fill:#39405a !important; stroke:#39405a !important; }

  h1 { font-size:9vmin; margin:0 0 1vmin; text-align:center; color:#fff; text-shadow:0 .6vmin 0 #2f7d44, 0 1vmin 2vmin rgba(0,0,0,.25); letter-spacing:.2vmin; }
  .sub { font-size:3.2vmin; margin:0 0 2vmin; text-align:center; }
  .bigbtn { width:30vmin; height:30vmin; border-radius:50%; background:#ff8a3d; box-shadow:0 1.6vmin 0 #c85a12, 0 3vmin 4vmin rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; animation:pulse 1.6s ease-in-out infinite; }
  .bigbtn:active { transform:translateY(1vmin); box-shadow:0 .6vmin 0 #c85a12; }
  .bigbtn .tri { width:0; height:0; border-left:12vmin solid #fff; border-top:8vmin solid transparent; border-bottom:8vmin solid transparent; margin-left:3vmin; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  @keyframes bounce { 0%,100% { transform:translateY(0); } 40% { transform:translateY(-5vmin) rotate(-4deg); } 70% { transform:translateY(0) rotate(3deg); } }
  @keyframes wobble { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-7deg); } 75% { transform:rotate(7deg); } }
  @keyframes pop { 0% { transform:scale(.3); opacity:0; } 70% { transform:scale(1.15); opacity:1; } 100% { transform:scale(1); } }
  .bounce { animation:bounce .7s ease; } .wobble { animation:wobble .35s ease 2; } .pop { animation:pop .5s ease both; }

  .corner { position:absolute; top:2vmin; width:11vmin; height:11vmin; border-radius:50%; background:rgba(255,255,255,.75); font-size:6vmin; line-height:11vmin; text-align:center; z-index:5; }
  .corner.left { left:2vmin; } .corner.right { right:2vmin; opacity:.55; font-size:5vmin; }
  .corner.holding { background:#ffd84d; opacity:1; transition:background 1.5s; }

  /* title */
  #title .pip { width:34vmin; height:28vmin; }
  /* map */
  #map .places { display:flex; gap:3vmin; flex-wrap:wrap; justify-content:center; align-items:flex-end; }
  .place { width:29vmin; height:34vmin; border-radius:5vmin; background:var(--card); box-shadow:0 1.2vmin 0 rgba(0,0,0,.18); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; border:1vmin solid #fff; }
  .place:active { transform:translateY(.8vmin); }
  .place .pic { width:20vmin; height:20vmin; }
  .place .name { font-size:2.8vmin; font-weight:bold; margin-top:1vmin; }
  .place .badge { position:absolute; top:-3vmin; right:-3vmin; width:11vmin; height:11vmin; }
  .place.done { background:#eaffd9; border-color:#7ed67a; }
  .nest { display:flex; gap:2vmin; align-items:flex-end; justify-content:center; margin-top:3vmin; background:#c48a4a; border-radius:3vmin 3vmin 12vmin 12vmin; padding:1.5vmin 5vmin 2.5vmin; box-shadow:inset 0 -2vmin 0 #9c6830; }
  .nest .slot { width:11vmin; height:12vmin; }
  .nest .slot.empty { border:.8vmin dashed rgba(255,255,255,.7); border-radius:50%; }
  .nest .pipslot { width:15vmin; height:13vmin; }
  .family { display:flex; gap:.5vmin; margin-top:1.5vmin; height:7vmin; align-items:flex-end; }
  .family div { width:7vmin; height:6vmin; }

  /* game */
  #game { justify-content:space-between; padding-top:3vmin; padding-bottom:4vmin; }
  .stars { display:flex; gap:1.5vmin; height:9vmin; align-items:center; }
  .star { width:8vmin; height:8vmin; opacity:.3; filter:grayscale(1); transition:all .3s; font-size:7vmin; line-height:8vmin; text-align:center; }
  .star.got { opacity:1; filter:none; transform:scale(1.15); }
  /* the fun pack: a cheer made of pictures, and a glowing row of stars after a perfect round */
  .stars.perfect .star.got { filter:drop-shadow(0 0 1.6vmin #ffd23f) drop-shadow(0 0 .8vmin #fff3a0); transform:scale(1.3); }
  .cheer { position:absolute; top:13vmin; left:50%; translate:-50% 0; padding:.8vmin 3vmin; border-radius:6vmin; background:#ffd84d; box-shadow:0 .6vmin 0 #d9a400; font-size:6vmin; font-weight:bold; white-space:nowrap; pointer-events:none; z-index:6; opacity:0; }
  .cheer.show { animation:cheerPop 1.9s ease both; }
  @keyframes cheerPop { 0% { opacity:0; transform:scale(.3); } 12% { opacity:1; transform:scale(1.15); } 22% { transform:scale(1); } 80% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.9); } }
  .ask { display:flex; align-items:center; justify-content:center; gap:2vmin; }
  .ask .pip { width:26vmin; height:22vmin; }
  .bubble { min-width:26vmin; height:26vmin; border-radius:6vmin; background:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center; gap:1vmin; padding:2vmin 3vmin; position:relative; font-weight:bold; }
  .bubble::before { content:""; position:absolute; left:-3.5vmin; top:55%; border:2.2vmin solid transparent; border-right-color:#fff; border-left:none; }
  .bubble .art { width:20vmin; height:20vmin; }
  .bubble .art.small3 { width:19vmin; height:20vmin; margin:0 -3vmin; }
  .choices { display:flex; gap:3vmin; justify-content:center; align-items:center; flex-wrap:wrap; width:100%; }
  .choice { width:var(--cs,30vmin); height:var(--cs,30vmin); border-radius:5vmin; background:var(--card); border:1vmin solid #fff; box-shadow:0 1.4vmin 0 rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; font-size:14vmin; font-weight:bold; flex-direction:column; }
  .choice:active { transform:translateY(.8vmin); }
  .choice .art { width:78%; height:78%; }
  .choice.right { background:#d6ffc4; border-color:#55b85c; }
  .choice.dim { opacity:.35; }
  .dots { display:flex; gap:1.2vmin; height:3vmin; }
  .dots i { width:3vmin; height:3vmin; border-radius:50%; background:#ff8a3d; }

  /* eight places in the valley: four across, two rows */
  #map .places { display:grid; grid-template-columns:repeat(4, auto); gap:2.5vmin; }
  .place { width:21vmin; height:24vmin; border-radius:4vmin; }
  .place .pic { width:14vmin; height:13vmin; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  .place .name { font-size:2.3vmin; }
  .place .badge { top:-2vmin; right:-2vmin; width:8vmin; height:8vmin; }
  .nest { margin-top:2.5vmin; }
  /* newer games */
  .bubble .art.small5 { width:14vmin; height:15vmin; margin:0 -2.2vmin; }
  .bubble .seq { width:10vmin; height:10vmin; }
  .bubble .q { width:10vmin; height:10vmin; border:.8vmin dashed #ff8a3d; border-radius:2vmin; font-size:7vmin; line-height:8.4vmin; text-align:center; color:#ff8a3d; }
  .emoji { font-size:calc(var(--cs, 30vmin) * .58); line-height:1.25; }
  .bodypip { width:62vmin; height:52vmin; }
  .bodypip svg, .bodypip svg * { pointer-events:auto; cursor:pointer; }
  .bodypip .hit { fill:transparent; stroke:transparent; pointer-events:all; }
  .bodypip .glow > :not(.hit) { stroke:#ffd23f; stroke-width:5; }
  #grown select { font:inherit; padding:6px; margin-top:4px; max-width:300px; border-radius:8px; }
  /* learning help: the hint (💡), the "watch me" lesson (📖), and the big ▶ to skip a lesson */
  .corner.hint, .corner.lesson { left:auto; right:2vmin; opacity:1; font-size:6vmin; }
  .corner.hint { background:#fff3b0; } .corner.hint.used { opacity:.3; filter:grayscale(1); }
  .corner.lesson { top:15vmin; background:#d9ecff; }
  #myTurn { position:absolute; right:3vmin; bottom:3vmin; width:19vmin; height:19vmin; z-index:6; }
  @media (orientation:portrait) { #myTurn { right:auto; left:calc(50% - 9.5vmin); bottom:auto; top:61%; } } /* a phone held upright: in the empty space between Pip and the cards */
  #myTurn .tri { border-left-width:7vmin; border-top-width:4.6vmin; border-bottom-width:4.6vmin; margin-left:1.6vmin; }
  .glow { outline:1.2vmin solid #ffd23f; outline-offset:.5vmin; border-radius:3vmin; transform:scale(1.08); transition:transform .15s; }
  .choice.struck { opacity:.15; }
  #bubble .glow { outline:none; filter:drop-shadow(0 0 .8vmin #ffb300) drop-shadow(0 0 .8vmin #ffd23f); transform:scale(1.15); } /* pictures in Pip's bubble sit close together: a soft glow instead of a box */

  /* hatch + finale */
  #hatch .stage, #finale .stage { width:46vmin; height:46vmin; }
  #hatch .go, #finale .go { margin-top:3vmin; width:20vmin; height:20vmin; visibility:hidden; }
  #hatch .go.show, #finale .go.show { visibility:visible; }
  .row { display:flex; gap:2vmin; align-items:flex-end; justify-content:center; }
  #finale .row div { width:22vmin; height:19vmin; }
  .confetti { position:absolute; top:-5vmin; width:2.4vmin; height:3.4vmin; border-radius:.5vmin; animation:fall linear forwards; pointer-events:none; z-index:8; }
  @keyframes fall { to { transform:translateY(115vh) rotate(720deg); } }

  /* grown-ups */
  #grown { position:absolute; inset:0; background:rgba(43,45,66,.6); display:none; align-items:center; justify-content:center; z-index:20; }
  #grown.on { display:flex; }
  #grown .panel { background:#fff; border-radius:16px; padding:22px 26px; width:min(560px,92vw); max-height:92vh; overflow:auto; font-size:16px; }
  #grown h2 { margin:0 0 6px; } #grown p { margin:6px 0; line-height:1.4; }
  #grown .line { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid #eee; }
  #grown .pm { display:flex; align-items:center; gap:8px; }
  #grown button { background:#eef3ff; border-radius:10px; padding:10px 16px; font-weight:bold; min-width:44px; }
  #grown button.warn { background:#ffe3e0; } #grown button.main { background:#58b368; color:#fff; }
  #grown .soon { color:#888; }
  #grown .foot { display:flex; justify-content:space-between; margin-top:14px; gap:10px; flex-wrap:wrap; }
  /* celebration scenes: the clock balloon drifts across, dinosaur pictures pop up, and the fun fact shows as a caption */
  #scene { justify-content:flex-start; padding:0; }
  .scenestage { position:absolute; inset:0; overflow:hidden; }
  .sballoon { position:absolute; top:6vh; left:-30vmin; width:24vmin; height:30vmin; animation:sdrift 9s linear forwards; }
  @keyframes sdrift { 0% { left:-30vmin; transform:translateY(0); } 25% { transform:translateY(-2vmin); } 50% { transform:translateY(1.5vmin); } 75% { transform:translateY(-1vmin); } 100% { left:105vw; transform:translateY(0); } }
  .sitem { position:absolute; display:flex; align-items:flex-end; justify-content:center; opacity:0; animation:spop .6s ease forwards; transform-origin:50% 100%; }
  .sitem svg { width:100%; height:100%; overflow:visible; }
  .sitem .emo { line-height:1; }
  .sitem.gone { animation:sgone .5s ease forwards; }
  @keyframes spop { 0% { opacity:0; transform:scale(.3) translateY(4vmin); } 70% { opacity:1; transform:scale(1.08); } 100% { opacity:1; transform:scale(1); } }
  @keyframes sgone { to { opacity:0; transform:scale(.6); } }
  .scenecap { position:absolute; left:50%; transform:translateX(-50%); top:40vh; width:min(86vw, 120vmin); background:rgba(255,255,255,.92); border-radius:3vmin; padding:2vmin 3vmin; font-size:4.2vmin; line-height:1.3; font-weight:bold; text-align:center; box-shadow:0 1vmin 0 rgba(0,0,0,.12); z-index:3; }
  .bigbtn.sceneskip { position:absolute; right:3vmin; bottom:3vmin; width:15vmin; height:15vmin; z-index:4; }
  .bigbtn.sceneskip .tri { border-left-width:6vmin; border-top-width:4vmin; border-bottom-width:4vmin; margin-left:1.4vmin; }
  /* Upright phones (much taller than wide): two big place cards across, Pip above the bubble, bigger answer cards. Tablets are unchanged. */
  @media (max-aspect-ratio: 5/8) {
    #map #places { grid-template-columns:repeat(2, auto); gap:3vmin; }
    #places .place { width:42vmin; height:36vmin; }
    #places .place .pic { width:28vmin; height:23vmin; }
    #places .place .name { font-size:4vmin; }
    .ask { flex-direction:column; gap:3vmin; }
    .bubble::before { left:50%; top:-3.4vmin; margin-left:-2.2vmin; border:2.2vmin solid transparent; border-bottom-color:#fff; border-top:none; }
    #choices { --cs:42vmin !important; max-width:96vmin; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="layer"><div class="sun"></div><div class="cloud"></div><div class="cloud c2"></div>
  <div class="hill back"></div><div class="hill"></div></div>
  <div class="layer" id="fx"></div>

  <div class="screen on" id="title">
    <h1>Pip's Lost Eggs</h1>
    <p class="sub" id="titleSub">A dinosaur adventure</p>
    <div class="pip" id="titlePip"></div>
    <button class="bigbtn" id="playBtn" aria-label="Play"><span class="tri"></span></button>
  </div>

  <div class="screen" id="map">
    <div class="places" id="places"></div>
    <div class="nest" id="nest"></div>
    <div class="family" id="family"></div>
  </div>

  <div class="screen" id="game">
    <div class="stars" id="stars"></div>
    <div class="cheer" id="cheer"></div>
    <div class="ask">
      <button class="pip" id="gamePip" aria-label="Say it again"></button>
      <div class="bubble" id="bubble"></div>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="screen" id="hatch">
    <button class="stage" id="hatchStage" aria-label="Tap the egg"></button>
    <button class="bigbtn go" id="hatchGo" aria-label="Keep going"><span class="tri"></span></button>
  </div>

  <div class="screen" id="scene"><div class="scenestage" id="sceneStage"></div><div class="scenecap" id="sceneCap"></div><button class="bigbtn sceneskip" id="sceneGo" aria-label="Keep going"><span class="tri"></span></button></div>

  <div class="screen" id="finale">
    <h1>All the eggs are home!</h1>
    <div class="row" id="finaleRow"></div>
    <button class="bigbtn go" id="finaleGo" aria-label="Play again"><span class="tri"></span></button>
  </div>

  <button class="corner left" id="homeBtn" aria-label="Back to the valley" style="display:none">🏠</button>
  <button class="corner left" id="shelfBtn" aria-label="Back to the book shelf">📚</button>
  <button class="corner right" id="grownBtn" aria-label="Grown-ups: press and hold">⚙️</button>
  <button class="corner hint" id="hintBtn" aria-label="Hint (one each round)" style="display:none">💡</button>
  <button class="corner lesson" id="lessonBtn" aria-label="Show me how" style="display:none">📖</button>
  <button class="bigbtn" id="myTurn" aria-label="My turn" style="display:none"><span class="tri"></span></button>

  <div id="grown"><div class="panel" id="grownPanel"></div></div>
</div>

<script>
"use strict";
/* =====================================================================
   PIP'S LOST EGGS  -  an original learning game for Nash
   Everything (pictures, voice, sounds, saving) lives in this one file.
   ===================================================================== */

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const pick = arr => arr[rand(arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- saved progress (kept on this device) ----------
// Who is playing? (picked on the book shelf page). The first child added keeps the original saved progress.
let PLAYER = null;
try { const cur = localStorage.getItem("storyShelf.current");
  if (cur === "review") { const r = JSON.parse(localStorage.getItem("storyShelf.review") || "null"); if (r && Date.now() - r.since < 2 * 60 * 60 * 1000) PLAYER = { id: "review", name: "", review: true }; } // a grown-up looking through the game: saved apart, and thrown away afterwards
  else PLAYER = JSON.parse(localStorage.getItem("storyShelf.players") || "[]").find(p => p.id === cur) || null; } catch (e) {}
if (!PLAYER || (!PLAYER.review && !PLAYER.born)) try { location.replace("index.html?who=1"); } catch (e) {} // no name or no age yet: back to the shelf, which asks
const NAME = PLAYER ? PLAYER.name : "";
const SAVE_KEY = "pipsLostEggs.v1" + (PLAYER && PLAYER.id !== "p1" ? "." + PLAYER.id : "");
const fresh = () => ({ skill: { colors: 1, shapes: 1, count: 1, patterns: 1, shadows: 1, sizes: 1, body: 1, sounds: 1 }, found: {}, friends: [], clutches: 0, learned: {}, auto: true, voice: true, sound: true, voiceName: "" });
let S = fresh();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const old = JSON.parse(raw); S = Object.assign(fresh(), old); S.skill = Object.assign(fresh().skill, old.skill || {}); } // keeps old progress when new games are added
} catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
if (S.clutches > 0) stamp("pre"); // children who finished Pip's adventure before medals existed still get theirs

// ---------- voice settings (the device's own voice is no longer used) ----------
// The game looks through the voices this device has and picks the most natural-sounding female one.
// Grown-ups can choose a different one in the grown-ups panel.
let voice = null;
function voiceScore(v) {
  const n = v.name + " " + (v.voiceURI || "");
  let s = 0;
  if (/premium|enhanced|natural|neural/i.test(n)) s += 50;
  if (/Ava|Zoe|Allison|Samantha|Susan|Joelle|Nicky|Noelle|Aria|Jenny|Michelle|Ana\b|Sonia|Libby|Karen|Serena|Moira|Tessa|Google US English|Zira|Female/i.test(n)) s += 20;
  if (/^en.US/i.test(v.lang)) s += 5;
  if (/David|Mark\b|Guy\b|Daniel|Alex\b|Aaron|Tom\b|Evan|Nathan|Arthur|Oliver|Ryan|Christopher|Eric\b|Roger|Steffan|Brian|Andrew|Gordon|Rishi|\bMale/i.test(n)) s -= 30;
  if (/compact|eloquence|Eddy|Flo\b|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Good News|Bahh|Bells|Boing|Bubbles|Cellos|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Kathy|Ralph|Fred/i.test(n)) s -= 40;
  return s;
}
function englishVoices() { return []; } // the device voices are no longer used
function chooseVoice() {}
// Settings shared by every game on the shelf (the same place the other games keep them).
function sharedSettings() { try { return JSON.parse(localStorage.getItem("storyShelf.settings") || "{}") || {}; } catch (e) { return {}; } }
function shareVoice(name) { try { const s = sharedSettings(); s.voiceName = name; localStorage.setItem("storyShelf.settings", JSON.stringify(s)); } catch (e) {} }
// A medal on the book shelf for finishing the story (kept separately for each child).
function stamp(id) {
  try { const k = "storyShelf.stamps" + (PLAYER ? "." + PLAYER.id : ""), list = JSON.parse(localStorage.getItem(k) || "[]");
    if (!list.includes(id)) { list.push(id); localStorage.setItem(k, JSON.stringify(list)); finished("story"); } } catch (e) {}
}
// Notes the day a lesson (a place in the valley) or the whole story is first finished, for the progress report
// (the same record as "finish" and "storyDone" in shared/kit.js). what: "finished" with a lesson's id, or "story".
function finished(what, lesson) {
  try {
    const key = "storyShelf.progress" + (PLAYER ? "." + PLAYER.id : ""), P = JSON.parse(localStorage.getItem(key) || "null") || { v: 1, games: {}, days: {} };
    const g = P.games.pre || (P.games.pre = { title: "Pip's Lost Eggs", stations: {} });
    const d = new Date(), day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    if (what === "story") { if (g.story) return; g.story = day; } else { const f = g.finished || (g.finished = {}); if (f[lesson]) return; f[lesson] = day; }
    localStorage.setItem(key, JSON.stringify(P));

const GAME_IDS = ["colors", "shapes", "count", "patterns", "shadows", "sizes", "body", "sounds"]; // the order of places in the valley
const NEST_SIZE = 3; // eggs needed to finish one adventure
const STARS_TO_WIN = 4;
const foundList = () => Object.values(S.found);

// ---------- playing one place: Learn, then Try together, then Play ----------
// The first visit to a place starts with a short "watch me" lesson (the big ▶ skips it, 📖 shows it again).
// The next two questions come with Pip's help already showing. One 💡 hint per round. After a second wrong try,
// Pip shows the answer and why. A question that needed help comes back a little later, to practise it again.
let G = null; // the game being played right now
const REVIEW = {}; // questions to bring back, while the game is open: { place: [{ q, due }] }
function startGame(id) {
  G = { id, stars: 0, streak: 0, rough: 0, q: null, busy: false, first: true, lastSay: "", hints: 1, count: 0, guided: 0, seen: new Set(), run: 0, perfect: true, asked: false };
  $("stars").classList.remove("perfect");
  $("stars").innerHTML = Array(STARS_TO_WIN).fill('<div class="star">⭐</div>').join("");
  $("gamePip").innerHTML = PIP();
  $("hintBtn").classList.remove("used");
  show("game");
  if (GAMES[id].lesson && !(S.learned || {})[id]) runLesson(true);
  else nextQuestion(id);
}
// The tools Pip uses to show things during a lesson, a hint or her help. "alive" turns false once the child moves on.
function helper(alive) {
  const cards = () => [...$("choices").querySelectorAll(".choice")].filter(b => b._ch);
  return {
    alive,
    say: async words => { // with the voice off, a pause long enough to look at the picture instead
      if (!alive()) return false;
      if (!S.voice) { await wait(1100 + String(words).length * 35); return alive(); }
      return (await talk(words)) && alive();
    },
    glow: (el, on) => el && el.classList.toggle("glow", !!on),
    cards, right: () => cards().find(b => b._ch.ok),
    bubbleArt: () => $("bubble").firstElementChild, bubbleItems: () => [...$("bubble").children],
    part: name => $("choices").querySelector(`[data-part="${name}"]`),
    wait: ms => wait(ms),
    // a pretend question for a lesson: what is in Pip's bubble, and the cards (they cannot be tapped)
    demo(bubbleHtml, list) {
      $("bubble").innerHTML = bubbleHtml; animate($("bubble"), "pop");
      const box = $("choices"); box.innerHTML = ""; box.style.setProperty("--cs", list.length >= 3 ? "27vmin" : "32vmin");
      return list.map(h => { const b = document.createElement("div"); b.className = "choice pop"; b.innerHTML = h; box.appendChild(b); return b; });
    },
    demoBody() { $("bubble").innerHTML = `<span style="font-size:9vmin">👀</span>`; $("choices").innerHTML = `<div class="bodypip pop">${bodyPip(COLORS.green)}</div>`; }
  };
}
async function runLesson(first) { // "Learn": Pip does one herself, out loud
  const g = G; if (!g) return;
  hush(); g.lesson = true; g.busy = true; g.q = null;
  $("bubble").innerHTML = ""; $("choices").innerHTML = ""; $("myTurn").style.display = "";
  const P = helper(() => G === g && !!g.lesson);
  let ok = true;
  if (first) ok = (S.voice ? await speak("intro-" + g.id, GAMES[g.id].intro) : (await wait(1500), true)) && P.alive();
  if (ok) { await GAMES[g.id].lesson(P); ok = P.alive(); }
  if (ok && await P.say("Now you try!")) endLesson(g);
}
function endLesson(g) {
  if (G !== g || !g.lesson) return;
  hush(); g.lesson = false; g.busy = false; $("myTurn").style.display = "none";
  (S.learned || (S.learned = {}))[g.id] = true; save();
  g.guided = 2; // "Try together": the next two questions come with Pip's help already showing
  nextQuestion();
}
function nextQuestion(intro) { // "intro" is the place's id, only for the very first question: Pip says her welcome first, then asks
  let q, tries = 0, lead = null;
  const queue = REVIEW[G.id] || [], due = queue.findIndex(r => r.due <= G.count);
  if (due >= 0) { q = queue.splice(due, 1)[0].q; q.reviewed = true; q.explained = false; lead = "Let's try this one again!"; } // bring it back
  else {
    do { q = GAMES[G.id].makeQuestion(S.skill[G.id]); tries++; } while (tries < 14 && (q.say + q.bubble === G.lastSay || G.seen.has(q.say + q.bubble))); // not the last one, and none already asked this round
    G.seen.add(q.say + q.bubble);
  }
  G.lastSay = q.say + q.bubble;
  G.q = q; G.first = true; G.busy = false; G.hinted = false; G.asked = false; G.wrongs = 0;
  $("bubble").innerHTML = q.bubble; animate($("bubble"), "pop");
  const box = $("choices"); box.innerHTML = "";
  if (q.render) q.render(box); // a game can draw its own picture to tap (the body parts game does)
  else {
    box.style.setProperty("--cs", q.choices.length >= 4 ? "22vmin" : q.choices.length === 3 ? "27vmin" : "32vmin");
    q.choices.forEach(ch => {
      const b = document.createElement("button"); b.className = "choice pop"; b.innerHTML = ch.html; b._ch = ch; // (hints need to know which card is which)
      b.addEventListener("click", () => choose(b, ch));
      box.appendChild(b);
    });
  }
  loadClip(lineUrl(q.yay)).catch(() => {}); // get the cheer ready too
  const guide = G.guided > 0 && q.hint; // "Try together"
  if (guide) { G.guided--; G.hinted = true; }
  const g = G, parts = (lead ? [lead] : []).concat(q.sayParts || q.say);
  const asked = intro ? speak("intro-" + intro, GAMES[intro].intro).then(finished => finished && G === g && g.q === q ? talk(parts) : false) // asks only if the welcome played to its end
    : talk(parts);
  if (guide) asked.then(done => { if (G === g && g.q === q && !g.busy && (done || !S.voice)) q.hint(helper(() => G === g && g.q === q && !g.busy)); });
}
// el = what was tapped. "part" is true when it is a part of a bigger picture rather than a card.

    animate($("gamePip"), "bounce");
    if (part) { el.classList.add("glow"); animate(box.firstChild, "bounce"); }
    else { el.classList.add("right"); [...box.children].forEach(b => { if (b !== el) b.classList.add("dim"); }); }
    G.stars++; $("stars").children[G.stars - 1].classList.add("got"); G.count++;
    if ((!G.first || G.asked) && !q.reviewed) (REVIEW[G.id] || (REVIEW[G.id] = [])).push({ q, due: G.count + 2 }); // it needed help (a wrong tap or a hint asked for): try it again a little later
    if (G.first && !G.asked) G.run++; else G.run = 0; // right first time, in a row (Pip's own "try together" help does not break it)
    const last = G.stars >= STARS_TO_WIN;
    if (!(last && G.perfect) && (G.run === 3 || (G.run === 4 && STARS_TO_WIN === 4))) { cheer("⭐".repeat(G.run)); sfx.sparkle(); }
    const spoken = talkAndWait(q.yay, q.pause || 2100); // waits for Pip to finish; with the voice off, a short pause
    track(G.id, GAMES[G.id].name, S.skill[G.id], q, G.first && !G.hinted, G.hinted); // for the progress report
    adjust(G.first && !G.hinted);
    await spoken;
    if (q.after) await wait(q.after); // extra time when Pip asks the child to do something ("Where is your tummy?")
    if (!G || G.q !== q) return;
    if (G.stars >= STARS_TO_WIN) {
      if (G.perfect) { // every answer right the first time: the stars glow
        $("stars").classList.add("perfect"); sfx.party(); confetti(60); cheer("🌟");
        await wait(1500);
        if (!G || G.q !== q) return;
      }
      finishGame();
    } else nextQuestion();
  } else {
    sfx.oops(); G.first = false; G.perfect = false; G.run = 0; G.wrongs = (G.wrongs || 0) + 1;
    if (part) animate(box.firstChild, "wobble"); else { animate(el, "wobble"); el.classList.add("dim"); }
    if (G.hints > 0) animate($("hintBtn"), "wobble"); // a gentle nudge: a hint is there if they want it
    const wrong = ch.wrong || `That is the ${ch.name}.`, g = G;
    if (G.wrongs >= 2 && q.explain && !q.explained) { // a second wrong try: Pip shows how
      q.explained = true;
      talk(wrong).then(done => { if (G === g && g.q === q && !g.busy && (done || !S.voice)) q.explain(helper(() => G === g && g.q === q && !g.busy)); });
    } else talk([wrong].concat(q.sayParts || q.say));
  }
}
// Quietly make the game harder after 3 right in a row, easier after 2 hard questions in a row.
function adjust(firstTry) {
  if (!S.auto) return;
  if (firstTry) { G.streak++; G.rough = 0; if (G.streak >= 3 && S.skill[G.id] < 4) { S.skill[G.id]++; G.streak = 0; } }
  else { G.rough++; G.streak = 0; if (G.rough >= 2 && S.skill[G.id] > 1) { S.skill[G.id]--; G.rough = 0; } }
  save();
}
function finishGame() {
  const id = G.id; G = null; finished("finished", id); // a round was won here: the lesson is finished (for the progress report)
  if (S.found[id]) { // already rescued this egg: just celebrate
    sfx.party(); confetti(30);
    Promise.all([speak("replay", "Great job! You did it again!"), wait(2600)]).then(() => { if (current === "game") showMap(); }); // back to the valley once Pip has finished
  } else { // a short celebration scene first: a dinosaur fun fact (a different one each time). The very first time, Dr. Somebody drops by too.
    const k = (S.factAt || 0) % PIP_FACTS.length, stops = (S.metDoc ? [] : [DOC_HELLO]).concat(PIP_FACTS[k]);
    S.factAt = k + 1; S.metDoc = true; save();
    playScene(stops, () => startHatch(id));
  }
}

// ---------- celebration scenes ----------
// Dr. Somebody's clock balloon (a time machine, from the older grades' games) drifts across, dinosaur pictures pop up,
// and Pip says a fun fact. The big ▶ skips ahead. Pip's lines are recorded in audio/pip/l/; Dr. Somebody's in audio/pip/doc/.
const BALLOON = `<svg viewBox="0 0 160 200"><path d="M80 6 C28 6 14 50 20 82 C26 112 56 132 80 140 C104 132 134 112 140 82 C146 50 132 6 80 6 Z" fill="#ff5a5f"/>
  <path d="M80 6 C58 20 50 60 56 96 C60 118 72 134 80 140 C88 134 100 118 104 96 C110 60 102 20 80 6 Z" fill="#ffd23f"/>
  <circle cx="80" cy="70" r="34" fill="#fff" stroke="#39405a" stroke-width="5"/>
  <g stroke="#39405a" stroke-width="4" stroke-linecap="round"><line x1="80" y1="42" x2="80" y2="48"/><line x1="80" y1="92" x2="80" y2="98"/><line x1="52" y1="70" x2="58" y2="70"/><line x1="102" y1="70" x2="108" y2="70"/></g>
  <line x1="80" y1="70" x2="80" y2="50" stroke="#39405a" stroke-width="5" stroke-linecap="round"/><line x1="80" y1="70" x2="97" y2="79" stroke="#ff5a5f" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="70" r="4" fill="#39405a"/>
  <line x1="56" y1="130" x2="62" y2="162" stroke="#c9a37a" stroke-width="3"/><line x1="104" y1="130" x2="98" y2="162" stroke="#c9a37a" stroke-width="3"/>
  <circle cx="80" cy="154" r="13" fill="#9c6b3f"/><circle cx="75" cy="152" r="5" fill="#fff"/><circle cx="85" cy="152" r="5" fill="#fff"/><circle cx="75" cy="152" r="2" fill="#2b2d42"/><circle cx="85" cy="152" r="2" fill="#2b2d42"/>
  <rect x="56" y="160" width="48" height="32" rx="7" fill="#c48a4a"/><rect x="56" y="160" width="48" height="7" rx="3" fill="#9c6830"/></svg>`;
const sceneEmo = e => `<span class="emo">${e}</span>`;
const SCENE_ART = { pip: PIP(), egg: ART.egg(COLORS.teal), egg2: ART.egg(COLORS.pink), longneck: ART.longneck(COLORS.blue), spiky: ART.spiky(COLORS.purple), horned: ART.horned(COLORS.orange),
  leaf: ART.leaf(COLORS.green), fern: sceneEmo("🌿"), volcano: sceneEmo("🌋"), bird: sceneEmo("🐦"), feather: sceneEmo("🪶"), house: sceneEmo("🏠"), nest: sceneEmo("🪺") };
// [what is said, what pops up: [picture, left %, bottom %, size in vmin]]
const DOC_HELLO = { doc: true, say: "Doctor Somebody here! Oh dear. My clock balloon has landed in dinosaur times again! Hello, Pip!", show: [["pip", 20, 8, 30], ["fern", 56, 8, 16]] };
const PIP_FACTS = [
  { say: "Fun fact! Baby dinosaurs hatched from eggs, just like baby birds!", show: [["egg", 14, 8, 18], ["egg2", 30, 8, 16], ["nest", 46, 8, 18], ["pip", 60, 8, 18]] },
  { say: "Fun fact! Some dinosaurs were taller than a house!", show: [["longneck", 8, 6, 46], ["house", 58, 8, 14]] },
  { say: "Fun fact! Birds are a kind of dinosaur!", show: [["bird", 18, 30, 16], ["pip", 40, 8, 26], ["feather", 66, 30, 10]] },
  { say: "Fun fact! Some dinosaurs had feathers!", show: [["feather", 16, 26, 16], ["pip", 34, 8, 26], ["feather", 62, 34, 12]] },
  { say: "Fun fact! Lots of dinosaurs ate only plants, like leaves and ferns!", show: [["longneck", 6, 6, 36], ["fern", 48, 8, 16], ["leaf", 62, 8, 14]] },
  { say: "Fun fact! Some dinosaurs had big spikes on their backs!", show: [["spiky", 10, 6, 40], ["volcano", 58, 8, 18]] }
];
let SC = null;
async function playScene(stops, then) {
  const me = SC = { then, done: false }, alive = () => SC === me && !me.done;
  show("scene"); const stage = $("sceneStage"); stage.innerHTML = `<div class="sballoon">${BALLOON}</div>`; sfx.party(); confetti(25);
  for (const stop of stops) {
    if (!alive()) return;
    stage.querySelectorAll(".sitem").forEach(e => e.classList.add("gone"));
    stop.show.forEach(([name, x, y, size], i) => { const d = document.createElement("div"); d.className = "sitem"; d.style.cssText = `left:${x}%;bottom:${y}%;width:${size}vmin;height:${size}vmin;font-size:${(size * .85).toFixed(1)}vmin;animation-delay:${(i * .35).toFixed(2)}s`; d.innerHTML = SCENE_ART[name]; stage.appendChild(d); });
    $("sceneCap").textContent = stop.say;
    const said = S.voice ? await (stop.doc ? playClip("../audio/pip/doc/" + clipName(stop.say) + ".mp3", stop.say) : talk(stop.say)) : (await wait(1500 + stop.say.length * 45), true);
    if (!said || !alive()) return;
    await wait(700);
  }
  if (alive()) { await wait(600); endScene(me); }
}
function endScene(me) { if (!me || me.done || SC !== me) return; me.done = true; SC = null; hush(); me.then(); }
$("sceneGo").addEventListener("click", () => { sfx.tap(); endScene(SC); });

// ---------- hatching an egg ----------
let H = null;
function startHatch(id) {
  const colorName = FRIEND_COLORS[S.friends.length % FRIEND_COLORS.length];
  const kind = pick(["longneck", "spiky", "horned", "pip"]);
  H = { id, colorName, kind, taps: 0, done: false };
  $("hatchStage").innerHTML = ART.egg(COLORS[colorName]);
  $("hatchGo").classList.remove("show");
  show("hatch"); sfx.party(); confetti(25); animate($("hatchStage"), "pop");
  speak("found", "You found an egg! Tap the egg!");
  loadClip(`../audio/pip/hatch-${colorName}-${kind}.mp3`).catch(() => {}); // get the hatching line ready so it starts without a pause
}
$("hatchStage").addEventListener("click", () => {
  if (!H || H.done) return;
  H.taps++; sfx.crack(); animate($("hatchStage"), "wobble");
  if (H.taps >= 3) {
    H.done = true;
    S.found[H.id] = { color: H.colorName, kind: H.kind };
    S.friends.push({ color: H.colorName, kind: H.kind }); save();
    $("hatchStage").innerHTML = ART[H.kind](COLORS[H.colorName]); animate($("hatchStage"), "pop");
    sfx.party(); confetti(50);
    speak(`hatch-${H.colorName}-${H.kind}`, `Hello, baby dinosaur! ${/^[aeiou]/.test(H.colorName) ? "An" : "A"} ${H.colorName} ${DINO_NAMES[H.kind]}!`);
    setTimeout(() => $("hatchGo").classList.add("show"), 1200);
  }
});
$("hatchGo").addEventListener("click", () => {
  sfx.tap(); H = null;
  if (foundList().length >= NEST_SIZE) showFinale(); else showMap();
});

// ---------- the big finish (when the nest is full) ----------
function showFinale() {
  $("finaleRow").innerHTML = `<div>${PIP()}</div>` + foundList().slice(0, NEST_SIZE).map(f => `<div class="pop">${ART[f.kind](COLORS[f.color])}</div>`).join("");
  $("finaleGo").classList.remove("show");
  show("finale"); sfx.party(); confetti(80);
  speak("finale", "Hooray! All the eggs are home! Pip is so happy. Thank you!");
  setTimeout(() => $("finaleGo").classList.add("show"), 2500);
}
$("finaleGo").addEventListener("click", () => {
  sfx.tap(); S.found = {}; S.clutches++; save(); stamp("pre");
  showMap("again");
});

// ---------- the valley (map) ----------
function showMap(line) {
  const home = foundList();
  if (home.length >= NEST_SIZE) { showFinale(); return; } // nest is full: go to the celebration
  $("places").innerHTML = "";
  GAME_IDS.forEach(id => {
    const g = GAMES[id], b = document.createElement("button");
    b.className = "place" + (S.found[id] ? " done" : "");
    b.innerHTML = `<div class="pic">${typeof g.icon === "function" ? g.icon() : ART[g.icon](COLORS.blue)}</div><div class="name">${g.name}</div>` +
      (S.found[id] ? `<div class="badge">${ART[S.found[id].kind](COLORS[S.found[id].color])}</div>` : `<div class="badge">${ART.egg(COLORS.teal)}</div>`);
    b.addEventListener("click", () => { sfx.tap(); startGame(id); });
    $("places").appendChild(b);
  });
  $("nest").innerHTML = `<div class="pipslot">${PIP()}</div>` + Array.from({ length: NEST_SIZE }, (_, i) =>
    home[i] ? `<div class="slot">${ART[home[i].kind](COLORS[home[i].color])}</div>` : `<div class="slot empty"></div>`).join("");
  const earlier = S.friends.slice(0, Math.max(0, S.friends.length - home.length)).slice(-12);
  $("family").innerHTML = earlier.map(f => `<div>${ART[f.kind](COLORS[f.color])}</div>`).join("");
  show("map");
  const left = NEST_SIZE - home.length;
  if (line === "again") speak("again", "Oh no! More eggs rolled away! Let's find them!");
  else if (left === 3) speak("start", "Pip's eggs rolled away! Tap a place to find an egg.");
  else if (left === 1) speak("left1", "One more egg to find! Tap a place.");
  else speak("left2", "Two more eggs to find! Tap a place.");
}

// ---------- buttons ----------
$("titlePip").innerHTML = PIP();
if (NAME) $("titleSub").textContent = "A dinosaur adventure for " + NAME;
$("shelfBtn").addEventListener("click", () => { hush(); location.href = "index.html"; });
$("playBtn").addEventListener("click", () => {
  audio(); sfx.tap();
  // get the most-used recorded lines ready, so they start without a pause (a missing file is simply skipped)
  ["start", "left1", "left2", "again", "replay", "found", "finale"].concat(GAME_IDS.map(id => "intro-" + id)).forEach(n => loadClip("../audio/pip/" + n + ".mp3").catch(() => {}));
  showMap();
});
$("gamePip").addEventListener("click", () => { if (G && G.q && !G.busy) { animate($("gamePip"), "wobble"); talk(G.q.sayParts || G.q.say); } });
$("homeBtn").addEventListener("click", () => { sfx.tap(); G = null; hush(); showMap(); });
// little surprises: tap the scenery (the sun, a cloud) and it hops or spins
let pokes = 0;
$("app").addEventListener("click", e => {
  if (!e.target.classList || !e.target.classList.contains("screen")) return; // only taps on the empty background
  const things = [...document.querySelector("#app > .layer").children].reverse();
  const hit = things.find(el => { const r = el.getBoundingClientRect(); return r.width && r.width < innerWidth * .6 && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom && getComputedStyle(el).opacity !== "0"; });
  if (!hit || !hit.animate) return;
  sfx.boing(); pokes++;
  if (hit.classList.contains("sun")) hit.animate([{ rotate: "0deg", scale: "1" }, { rotate: "180deg", scale: "1.25" }, { rotate: "360deg", scale: "1" }], { duration: 800, easing: "ease-in-out" });
  else hit.animate([{ translate: "0 0", rotate: "0deg" }, { translate: "0 -4vmin", rotate: "-5deg" }, { translate: "0 0", rotate: "4deg" }, { translate: "0 -1.5vmin", rotate: "0deg" }, { translate: "0 0" }], { duration: 650, easing: "ease-out" });
  if (pokes % 7 === 0) { sfx.sparkle(); confetti(14); }
});
// The hint: one per round. It takes away one wrong card (only when 3 or more are left), then Pip shows how to think about it.
$("hintBtn").addEventListener("click", async () => {
  if (!G || G.busy || !G.q || G.hints <= 0) return;
  const q = G.q, g = G; G.hints--; G.hinted = true; G.asked = true; G.perfect = false; $("hintBtn").classList.add("used"); sfx.tap(); hush();
  const left = [...$("choices").querySelectorAll(".choice")].filter(b => b._ch && !b.classList.contains("dim"));
  if (left.length >= 3) pick(left.filter(b => !b._ch.ok)).classList.add("dim", "struck");
  const P = helper(() => G === g && g.q === q && !g.busy);
  if (q.hint) await q.hint(P); else await P.say(q.sayParts || q.say);
});
// 📖: watch Pip's lesson again. ▶: skip the lesson and start playing.
$("lessonBtn").addEventListener("click", () => { if (!G || G.lesson || !GAMES[G.id].lesson || (G.busy && G.q)) return; sfx.tap(); runLesson(false); });
$("myTurn").addEventListener("click", () => { if (G && G.lesson) { sfx.tap(); endLesson(G); } });

// ---------- grown-ups corner (press and hold the gear for 2 seconds) ----------
let holdTimer = null;
const gb = $("grownBtn");
const startHold = e => { e.preventDefault(); gb.classList.add("holding"); holdTimer = setTimeout(openGrown, 1500); };
const endHold = () => { gb.classList.remove("holding"); clearTimeout(holdTimer); };
gb.addEventListener("pointerdown", startHold); gb.addEventListener("pointerup", endHold); gb.addEventListener("pointerleave", endHold); gb.addEventListener("pointercancel", endHold);
gb.addEventListener("contextmenu", e => e.preventDefault());
// with a keyboard: hold Enter or the space bar on the gear
gb.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) startHold(e); });
gb.addEventListener("keyup", e => { if (e.key === "Enter" || e.key === " ") endHold(); });
gb.addEventListener("blur", endHold);
function openGrown() {
  endHold(); hush();
  const stepNames = {
    colors: ["2 colors", "3 colors", "3 of 6 colors", "4 colors"], shadows: ["dino or object", "2 dinos + object", "3 dinos", "4 dinos"],
    sizes: ["find big", "big or small", "biggest / smallest of 3", "biggest / smallest of 4"], count: ["count to 2", "count to 3", "count to 4", "count to 5"],
    shapes: ["circle, square, triangle", "adds star and heart", "8 shapes", "8 shapes, by name only"], patterns: ["2 colors taking turns", "2 things taking turns", "3 choices", "two-then-one pattern"],
    body: ["head, tummy, tail", "adds feet and eye", "adds arm and nose", "adds mouth"], sounds: ["4 animals, 2 choices", "6 animals, 3 choices", "10 animals, 3 choices", "10 animals, 4 choices"]
  };
  $("grownPanel").innerHTML = `<h2>Grown-ups</h2>
    <p><b>Preschool (ages 2-4).</b> ${NAME ? "Playing as <b>" + NAME.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) + "</b>." : `<span class="soon">No name picked. Pick one on the book shelf to keep each child's progress separate.</span>`}</p>
    <p><a href="progress.html" style="font-weight:bold">📊 Progress report</a>: what is going well and what to practise next.</p>
    <p>Eggs hatched so far: <b>${S.friends.length}</b> &nbsp;|&nbsp; Full adventures finished: <b>${S.clutches}</b></p>
    ${GAME_IDS.map(id => `<div class="line"><div><b>${GAMES[id].name}</b><br><small>Step ${S.skill[id]} of 4: ${stepNames[id][S.skill[id] - 1]}</small></div>
      <div class="pm"><button data-act="down" data-id="${id}">-</button><button data-act="up" data-id="${id}">+</button></div></div>`).join("")}
    <div class="line"><div>Adjust difficulty automatically</div><button data-act="auto">${S.auto ? "On" : "Off"}</button></div>
    <div class="line"><div>Pip's talking voice</div><button data-act="voice">${S.voice ? "On" : "Off"}</button></div>
    <div class="line"><div>Sound effects</div><button data-act="sound">${S.sound ? "On" : "Off"}</button></div>
    <div class="foot"><button class="warn" data-act="reset">Start over (erase progress)</button><button class="main" data-act="close">Done</button></div>`;
  $("grown").classList.add("on");
}
$("grownPanel").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === "up") S.skill[id] = Math.min(4, S.skill[id] + 1);
  if (act === "down") S.skill[id] = Math.max(1, S.skill[id] - 1);
  if (act === "auto") S.auto = !S.auto;
  if (act === "voice") S.voice = !S.voice;
  if (act === "sound") S.sound = !S.sound;
  if (act === "reset") { if (!confirm("Erase this game's progress and start over?")) return; S = fresh(); }
  save();
  if (act === "close") { $("grown").classList.remove("on"); if (current === "map") showMap(); return; }
  if (act === "reset") { $("grown").classList.remove("on"); show("title"); return; }
  openGrown();
});

$("grownPanel").addEventListener("change", e => {
});

// Stop pinch-zoom and double-tap zoom so little fingers can't shrink the game.
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());
</script>
