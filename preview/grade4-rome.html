<style>
  /* Blue sky, olive hills, a temple and an aqueduct. */
  :root { --sky1:#8fd3f4; --sky2:#fdebd0; --grass:#a9b665; --grass2:#7d9a4b; --title-shadow:#8e2f25; --strip:rgba(255,255,255,.45); --strip-line:rgba(90,100,40,.6); }
  h1 { font-size:7.4vmin; padding:0 14vmin; }
  .temple { position:absolute; left:6%; bottom:36vmin; width:30vmin; height:22vmin; }
  .aqueduct { position:absolute; right:-2%; bottom:35vmin; width:62vmin; height:18vmin; }
  .slot i { font-family:Georgia, serif; font-weight:bold; color:#8e2f25; }
  .roman { font-family:Georgia, "Times New Roman", serif; letter-spacing:.15vmin; }
  .frac { display:inline-flex; flex-direction:column; align-items:center; line-height:1; font-weight:bold; vertical-align:middle; }
  .frac b { border-bottom:.6vmin solid currentColor; padding:0 1vmin .4vmin; font-weight:bold; color:inherit; }
  .frac i { font-style:normal; padding-top:.4vmin; }
  .eq { font-size:7.4vmin; white-space:nowrap; display:flex; align-items:center; gap:1.6vmin; } .eq em { font-style:normal; color:#ff8a3d; }
  .strip { width:34vmin; height:6vmin; }
  .shapebox { width:26vmin; height:22vmin; }
  .graphbox { width:40vmin; height:27vmin; }
  .chips { display:flex; gap:1vmin; flex-wrap:wrap; justify-content:center; max-width:56vmin; }
  .places.many.lots { max-width:90vmin; } /* 15 places: three even rows of 5 */
  .mapbox { width:48vmin; height:40vmin; } .mapbox svg { width:100%; height:100%; }
  .tapgame #bubble > .mapbox, .tapgame #bubble > .rowx > .mapbox { width:58vmin; height:48vmin; } /* a bigger map when the answer is tapped on it */
  .lessonart .mapbox { width:38vmin; height:32vmin; display:inline-block; }
  .picto { display:flex; flex-direction:column; gap:.8vmin; font-size:3.4vmin; text-align:left; }
  .picto div { display:flex; align-items:center; gap:1.4vmin; } .picto b { width:13vmin; font-size:3vmin; } .picto span { font-size:4.2vmin; letter-spacing:.3vmin; }
  .picto .half { display:inline-block; font-style:normal; clip-path:inset(0 50% 0 0); } .picto small { font-size:2.8vmin; color:#5a5c70; margin-top:.6vmin; }
  .bag { display:grid; grid-template-columns:repeat(4, 5.4vmin); gap:1.2vmin; padding:2.4vmin; border-radius:4vmin 4vmin 7vmin 7vmin; background:#c9a46a; border:.7vmin solid #8a6a44; }
  .bag i { width:5.4vmin; height:5.4vmin; border-radius:50%; border:.4vmin solid rgba(0,0,0,.25); }
  .mosaic { display:flex; gap:.8vmin; flex-wrap:wrap; justify-content:center; max-width:60vmin; }
  .mtile { display:inline-block; width:6.4vmin; height:6.4vmin; border-radius:1vmin; border:.5vmin solid #6b5536; font-style:normal; vertical-align:middle; }
  .mtile.ask { background:#fff; border-style:dashed; color:#ff8a3d; font-weight:bold; font-size:4.6vmin; line-height:5.6vmin; text-align:center; }
  .forms { display:flex; align-items:flex-end; gap:3vmin; } .forms div { display:flex; flex-direction:column; align-items:center; gap:.8vmin; font-size:2.8vmin; font-weight:bold; }
  .ptable { border-collapse:collapse; font-size:4vmin; } .ptable th, .ptable td { border:.4vmin solid #b89a64; padding:.6vmin 1.6vmin; text-align:center; } .ptable th { background:#f3e6c4; font-size:2.8vmin; }
  .flipbox { display:flex; align-items:center; gap:2vmin; } .flipbox > div { width:16vmin; height:16vmin; } .flipbox svg { width:100%; height:100%; }
  .flipbox .river { width:3vmin; height:22vmin; background:#7cc3ec; border-radius:1.5vmin; } .flipbox .ask { font-size:9vmin; color:#ff8a3d; font-weight:bold; text-align:center; line-height:16vmin; }
  .chips div { min-width:7vmin; height:8.4vmin; padding:0 .8vmin; border-radius:2vmin; background:#eef3ff; border:.6vmin solid #c9d6ff; font-size:4.4vmin; line-height:7vmin; text-align:center; }
</style>

<body class="game">
<div id="app"></div>

<script src="shared/kit.js?v=62"></script>
<script src="shared/story.js?v=62"></script>
<script src="shared/newowl.js?v=62"></script>
<script>
"use strict";
/* =====================================================================
   DR. SOMEBODY IN ANCIENT ROME  -  the Grade 4 game
   Story: the clock balloon lands in ancient Rome, about two thousand
   years ago. The Roman numerals have fallen off the clock face! Win at a
   place and an animal friend brings one back. Six numerals fix the clock.
   The engine that runs the game is in shared/story.js.
   ===================================================================== */

// Dr. Somebody dressed for Rome: a crown of green leaves and a red sash.
const LEAVES = [-4, -3, -2, -1, 1, 2, 3, 4].map(i => { const x = 100 + i * 10.5, y = 16 + i * i * 1.3; return `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="7" ry="3.4" fill="#4c9f50" transform="rotate(${i * 14} ${x} ${y.toFixed(1)})"/>`; }).join("");
const HOST = owl("", LEAVES + `<path d="M70 86 Q100 100 132 120 L126 132 Q96 112 66 98 Z" fill="#b03a2e"/>`);
const TEMPLE = `<svg class="temple" viewBox="0 0 120 90"><polygon points="8,30 60,6 112,30" fill="#e9dcc3"/><rect x="10" y="30" width="100" height="6" fill="#d4c4a4"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${18 + i * 19}" y="36" width="8" height="40" fill="#f3ead7"/>`).join("")}<rect x="8" y="76" width="104" height="8" fill="#d4c4a4"/></svg>`;
const AQUEDUCT = `<svg class="aqueduct" viewBox="0 0 200 60"><path fill="#cdb89a" fill-rule="evenodd" d="M0 0 H200 V60 H0 Z ${[0, 1, 2, 3, 4].map(i => `M${8 + i * 40} 60 V32 A12 12 0 0 1 ${32 + i * 40} 32 V60 Z`).join(" ")}"/></svg>`;

// ---------- helpers ----------
const comma = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");                       // 1250 is written 1,250
const near = (ans, list) => numCards(ans, 0, 1000000, 4, list).map(c => ({ ...c, html: comma(c.html) }));
const wordCard = (w, color) => `<span style="font-size:${w.length <= 4 ? 8 : w.length <= 6 ? 6 : w.length <= 8 ? 4.6 : w.length <= 11 ? 3.4 : 2.6}vmin${color ? ";color:" + color : ""}">${w}</span>`;
const ansCard = text => `<span class="ans"${Math.max(...text.split(" ").map(w => w.length)) > 10 ? ` style="font-size:2.8vmin"` : ""}>${text}</span>`; // very long words get smaller writing
const pickCards = (right, wrongs, make, msg) => shuffle(wrongs.concat([right])).map(x => ({ html: make(x), ok: x === right, wrong: typeof msg === "function" ? msg(x) : msg }));
const passage = text => `<div class="passage">${text}</div>`;
// pick-the-word questions: a sentence with a gap
function gapQuestion(item, ask, count) {
  const [s, a, wrongs] = item, full = w => s.replace("___", w);
  return { bubble: `<div class="sentence">${s.replace("___", "<u>&nbsp;</u>")}</div>`, key: s, say: `${s.replace("___", "blank")} ${ask}`, read: ask, again: ask, yay: `Yes! ${full(a)}`,
    choices: pickCards(a, shuffle(wrongs).slice(0, count - 1), ansCard, "Not quite.") };
}
// Roman numerals: toRoman(27) gives ["XXVII", [10, 10, 5, 1, 1]]
function toRoman(n) {
  let s = ""; const parts = [];
  for (const [v, r] of [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]) while (n >= v) { s += r; parts.push(v); n -= v; }
  return [s, parts];
}
const roman = (s, size) => `<span class="roman" style="font-size:${size || (s.length <= 3 ? 14 : s.length <= 5 ? 10 : 7)}vmin">${s}</span>`;
// fractions and decimals. Decimals are kept as a number of tenths: 23 means 2.3
const PARTS = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["quarter", "quarters"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"], 12: ["twelfth", "twelfths"],
  16: ["sixteenth", "sixteenths"], 20: ["twentieth", "twentieths"], 24: ["twenty-fourth", "twenty-fourths"], 100: ["hundredth", "hundredths"] };
const fracSaid = (k, d) => `${k <= 20 ? NUM[k] : k} ${(PARTS[d] || ["over " + d, "over " + d])[k > 1 ? 1 : 0]}`;
const frac = (k, d) => `<span class="frac"><b>${k}</b><i>${d}</i></span>`;
const dec = t => (t / 10).toFixed(1), decSaid = t => `${Math.floor(t / 10)} point ${t % 10}`;
function pie(d, k) {
  const pt = a => `${(50 + 44 * Math.cos(a)).toFixed(1)},${(50 + 44 * Math.sin(a)).toFixed(1)}`;
  let s = "";
  for (let i = 0; i < d; i++) { const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
    s += `<path d="M50,50 L${pt(a0)} A44,44 0 0 1 ${pt(a1)} Z" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
function strip(d, k) { // a long bar cut into d equal parts, k of them orange
  let s = "";
  for (let i = 0; i < d; i++) s += `<rect x="${(2 + i * 196 / d).toFixed(1)}" y="2" width="${(196 / d).toFixed(1)}" height="30" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2"/>`;
  return `<div class="strip"><svg viewBox="0 0 200 34">${s}</svg></div>`;
}
// shapes
const ngon = (n, r) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2 + (n % 2 ? 0 : Math.PI / n); return `${(50 + (r || 42) * Math.cos(a)).toFixed(1)},${(50 + (r || 42) * Math.sin(a)).toFixed(1)}`; }).join(" ");
const SHAPES = { // name: [corner points, lines of symmetry]
  square: ["16,16 84,16 84,84 16,84", 4], rectangle: ["6,28 94,28 94,72 6,72", 2], rhombus: ["50,8 82,50 50,92 18,50", 2], parallelogram: ["26,28 96,28 74,72 4,72", 0], trapezoid: ["32,28 68,28 92,72 8,72", 1],
  pentagon: [ngon(5), 5], hexagon: [ngon(6), 6], octagon: [ngon(8), 8], "equilateral triangle": ["50,12 92,84 8,84", 3], "isosceles triangle": ["50,8 76,88 24,88", 1]
};
const shapeArt = name => `<div class="shapebox"><svg viewBox="0 0 100 100"><polygon points="${SHAPES[name][0]}" fill="#bfe1f6" stroke="#2f6fab" stroke-width="3" stroke-linejoin="round"/></svg></div>`;
function angleArt(deg) {
  const a = deg * Math.PI / 180, x = 50 + 46 * Math.cos(a), y = 80 - 46 * Math.sin(a), ax = 50 + 14 * Math.cos(a), ay = 80 - 14 * Math.sin(a);
  const mark = deg === 90 ? `<path d="M62 80 V68 H50" fill="none" stroke="#ff8a3d" stroke-width="2.5"/>` : `<path d="M64 80 A14 14 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#ff8a3d" stroke-width="2.5"/>`;
  return `<div class="shapebox"><svg viewBox="0 22 100 66">${mark}<g stroke="#2f6fab" stroke-width="4" stroke-linecap="round"><line x1="50" y1="80" x2="96" y2="80"/><line x1="50" y1="80" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/></g></svg></div>`;
}
// A bar graph: one bar for each name. "scale" is how much each line on the side is worth.
function barGraph(names, vals, scale) {
  const top = Math.max(...vals), x0 = 18, y0 = 78, unit = 66 / top;
  let s = "";
  for (let i = 0; i <= top; i++) { const y = (y0 - i * unit).toFixed(1); s += `<line x1="${x0}" y1="${y}" x2="126" y2="${y}" stroke="#d9dbe6" stroke-width=".6"/><text x="${x0 - 2}" y="${+y + 2}" font-size="5.5" text-anchor="end" fill="#2b2d42">${i * scale}</text>`; }
  names.forEach((n, i) => { const x = x0 + 5 + i * 27, h = vals[i] * unit; s += `<rect x="${x}" y="${(y0 - h).toFixed(1)}" width="18" height="${h.toFixed(1)}" fill="${INK[i]}"/><text x="${x + 9}" y="${y0 + 8}" font-size="6.4" text-anchor="middle" font-weight="bold" fill="#2b2d42">${n}</text>`; });
  return `<svg viewBox="0 0 130 90">${s}<line x1="${x0}" y1="${y0}" x2="126" y2="${y0}" stroke="#2b2d42" stroke-width="1.2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="8" stroke="#2b2d42" stroke-width="1.2"/></svg>`;
}
const chips = arr => `<div class="chips">${arr.map(x => `<div>${x}</div>`).join("")}</div>`;
// A double bar graph: two bars for each name (two legions side by side), with a key.
function doubleBars(names, a, b, scale, keys) {
  const top = Math.max(...a, ...b), x0 = 18, y0 = 74, unit = 60 / top;
  let s = "";
  for (let i = 0; i <= top; i++) { const y = (y0 - i * unit).toFixed(1); s += `<line x1="${x0}" y1="${y}" x2="126" y2="${y}" stroke="#d9dbe6" stroke-width=".6"/><text x="${x0 - 2}" y="${+y + 2}" font-size="5.5" text-anchor="end" fill="#2b2d42">${i * scale}</text>`; }
  names.forEach((n, i) => { const x = x0 + 6 + i * 36; [[a[i], INK[1]], [b[i], INK[0]]].forEach(([v, c], k) => { const h = v * unit; s += `<rect x="${x + k * 12}" y="${(y0 - h).toFixed(1)}" width="12" height="${h.toFixed(1)}" fill="${c}"/>`; });
    s += `<text x="${x + 12}" y="${y0 + 8}" font-size="6.2" text-anchor="middle" font-weight="bold" fill="#2b2d42">${n}</text>`; });
  s += `<rect x="30" y="1" width="6" height="5" fill="${INK[1]}"/><text x="38" y="5.5" font-size="5.4" fill="#2b2d42">${keys[0]}</text><rect x="78" y="1" width="6" height="5" fill="${INK[0]}"/><text x="86" y="5.5" font-size="5.4" fill="#2b2d42">${keys[1]}</text>`;
  return `<svg viewBox="0 0 130 90">${s}<line x1="${x0}" y1="${y0}" x2="126" y2="${y0}" stroke="#2b2d42" stroke-width="1.2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="9" stroke="#2b2d42" stroke-width="1.2"/></svg>`;
}
// A picture graph: each 🛡️ stands for "per" soldiers. A half shield stands for half of that.
const pictoGraph = (names, halves, per) => `<div class="picto">${names.map((n, i) => `<div><b>${n}</b><span>${"🛡️".repeat(Math.floor(halves[i] / 2))}${halves[i] % 2 ? `<i class="half">🛡️</i>` : ""}</span></div>`).join("")}<small>🛡️ = ${per} soldiers</small></div>`;
// a bag of tokens, for "how likely?"
const bag = counts => `<div class="bag">${shuffle(Object.entries(counts).flatMap(([c, n]) => Array(n).fill(c))).map(c => `<i style="background:${TOKEN[c]}"></i>`).join("")}</div>`;
const TOKEN = { red: "#ff5a5f", blue: "#4d9de0", gold: "#f4c430", green: "#58b368" };

// ---------- the Legion Camp map: a grid, with things placed on it ----------
// mode "squares": letters along the bottom and numbers up the side name the SQUARES (like C4).
// mode "points": numbers name the LINES, and things sit where lines cross, at coordinates like (3, 5).
const CAMP_THINGS = [["⛺", "tent"], ["🛡️", "shield"], ["🦅", "eagle standard"], ["🔥", "campfire"], ["🐎", "horse"], ["🏺", "water jar"], ["⚔️", "swords"], ["🌳", "tree"]];
const LETTERS = "ABCDEFGH";
const campXY = o => { const sq = o.mode === "squares", c = 12, x0 = 12, y0 = 6 + o.h * c; return { sq, c, x0, y0, X: x => x0 + x * c + (sq ? c / 2 : 0), Y: y => y0 - y * c - (sq ? c / 2 : 0) }; };
const campTrail = (o, path) => { const { X, Y } = campXY(o); return `<polyline class="trail" points="${path.map(([x, y]) => `${X(x)},${Y(y)}`).join(" ")}" fill="none" stroke="#ff5a5f" stroke-width="2.2" stroke-dasharray="3 2" stroke-linejoin="round" marker-end="url(#arrow)"/>`; };
// draws (or redraws) the dotted trail on the map that is showing in the bubble: used when the answer is tapped on the map itself
function trailOnMap(H, o, path) { const svg = H.bubble.querySelector(".mapbox svg"); if (!svg) return; svg.querySelectorAll(".trail").forEach(e => e.remove()); svg.insertAdjacentHTML("beforeend", campTrail(o, path)); }
function campMap(o) { // o: { mode, w, h, items: [[emoji, x, y, faded, pick]], path: [[x, y], ...], river: x }. An item with a "pick" key can be tapped.
  const { sq, c, x0, y0, X, Y } = campXY(o);
  let s = `<rect x="${x0}" y="6" width="${o.w * c}" height="${o.h * c}" fill="#f3e6c4" stroke="#b89a64" stroke-width="1"/>`;
  if (o.river != null) s += `<rect x="${x0 + o.river * c - 2.5}" y="6" width="5" height="${o.h * c}" fill="#7cc3ec"/>`;
  for (let i = 0; i <= o.w; i++) s += `<line x1="${x0 + i * c}" y1="6" x2="${x0 + i * c}" y2="${y0}" stroke="#b89a64" stroke-width=".6"/>`;
  for (let j = 0; j <= o.h; j++) s += `<line x1="${x0}" y1="${y0 - j * c}" x2="${x0 + o.w * c}" y2="${y0 - j * c}" stroke="#b89a64" stroke-width=".6"/>`;
  if (sq) { for (let i = 0; i < o.w; i++) s += `<text x="${X(i)}" y="${y0 + 7}" font-size="6" text-anchor="middle" font-weight="bold" fill="#8e2f25">${LETTERS[i]}</text>`;
    for (let j = 0; j < o.h; j++) s += `<text x="${x0 - 4}" y="${Y(j) + 2}" font-size="6" text-anchor="middle" font-weight="bold" fill="#8e2f25">${j + 1}</text>`; }
  else { for (let i = 0; i <= o.w; i++) s += `<text x="${X(i)}" y="${y0 + 7}" font-size="5.6" text-anchor="middle" font-weight="bold" fill="#8e2f25">${i}</text>`;
    for (let j = 1; j <= o.h; j++) s += `<text x="${x0 - 4}" y="${Y(j) + 2}" font-size="5.6" text-anchor="middle" font-weight="bold" fill="#8e2f25">${j}</text>`; }
  if (o.path && o.path.length > 1) s += campTrail(o, o.path);
  for (const [e, x, y, faded, pick] of o.items || []) { const pic = `<text x="${X(x)}" y="${Y(y) + 3.4}" font-size="11" text-anchor="middle"${faded ? ` opacity=".35"` : ""}>${e}</text>`;
    s += pick ? `<g data-pick="${pick}"><circle class="ring" cx="${X(x)}" cy="${Y(y)}" r="6.4"/>${pic}</g>` : pic; }
  return `<div class="mapbox"><svg viewBox="0 0 ${x0 + o.w * c + 4} ${y0 + 10}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff5a5f"/></marker></defs>${s}</svg></div>`;
}
const at = (x, y) => `(${x}, ${y})`, atSaid = at;
const coordCard = (x, y, color) => `<span style="font-size:6vmin;white-space:nowrap${color ? ";color:" + color : ""}">${at(x, y)}</span>`;
// coordinates that are close to the right ones, and never the same: the swapped pair (a very common mix-up) comes first
function nearPoints(x, y, w, h, extra) {
  const seen = new Set([x + "," + y]), out = [];
  for (const [a, b] of (extra || []).concat([[y, x], [x + 1, y], [x, y + 1], [x - 1, y], [x, y - 1], [x + 1, y + 1], [x - 1, y + 1]]))
    if (a >= 0 && b >= 0 && a <= w && b <= h && !seen.has(a + "," + b) && out.length < 3) { seen.add(a + "," + b); out.push([a, b]); }
  return out;
}
// a little flag, for flips: drawn facing right, or flipped to face left, or upside down
const flagArt = (flipX, flipY) => `<svg viewBox="0 0 40 40"><g transform="translate(20 20) scale(${flipX ? -1 : 1} ${flipY ? -1 : 1}) translate(-20 -20)"><rect x="10" y="6" width="3" height="30" fill="#6b4b2a"/><path d="M13 7 H32 L26 13 L32 19 H13 Z" fill="#b03a2e"/><circle cx="20" cy="13" r="2.4" fill="#f4c430"/></g></svg>`;
const moveWords = (dx, dy) => [dx ? `${Math.abs(dx)} ${dx > 0 ? "right" : "left"}` : "", dy ? `${Math.abs(dy)} ${dy > 0 ? "up" : "down"}` : ""].filter(Boolean).join(" and ");

// ---------- Legion Formations: patterns ----------
const TILE = { red: "#c0392b", gold: "#f4c430", blue: "#2e86c1", white: "#fbf6ea", green: "#58b368" };
const mtile = c => c === "?" ? `<i class="mtile ask">?</i>` : `<i class="mtile" style="background:${TILE[c]}"></i>`;
const mosaic = list => `<div class="mosaic">${list.map(mtile).join("")}</div>`;
// a formation: rows of soldiers (little red dots), drawn as a block
function formation(n, per) { const rows = Math.ceil(n / per); let s = "";
  for (let i = 0; i < n; i++) s += `<circle cx="${4 + (i % per) * 7}" cy="${4 + Math.floor(i / per) * 7}" r="2.6" fill="#b03a2e"/>`;
  return `<svg viewBox="0 0 ${per * 7 + 1} ${rows * 7 + 1}" style="height:${Math.min(17, 3.6 * rows + 1)}vmin">${s}</svg>`; }
const patternTable = (rows, head) => `<table class="ptable"><tr><th>${head[0]}</th>${rows.map(r => `<td>${r[0]}</td>`).join("")}</tr><tr><th>${head[1]}</th>${rows.map(r => `<td>${r[1]}</td>`).join("")}</tr></table>`;

const art = html => `<div class="lessonart">${html}</div>`;
async function frames(L, list) { for (const [html, words] of list) { L.frame(art(html)); if (!(await L.say(words))) return false; } return true; }
async function talkThrough(H, list) { for (const [html, words] of list) { H.show(art(html)); if (!(await H.say(words))) return false; } return true; }
function pointTo(H, words) { const c = H.cards().find(c => c.ch.ok); if (c) H.glow(c.el, true); return H.say(words); }
const STOP = new Set("the a an and of to in on is was were it its they them their what who why where which how did do does for with from that this there be by at as are has have".split(" "));
function answerSentence(text, ask, ans) {
  const sents = text.match(/[^.!?]+[.!?]/g) || [text], words = s => s.toLowerCase().replace(/'s\b/g, "").match(/[a-z]+/g) || [];
  const keys = [...words(ans).map(w => [w, 2]), ...words(ask).map(w => [w, 1])].filter(([w]) => w.length > 2 && !STOP.has(w));
  const score = s => { const ws = words(s); return keys.reduce((n, [k, v]) => n + (ws.some(w => w === k || w.startsWith(k.slice(0, Math.max(4, k.length - 2)))) ? v : 0), 0); };
  return sents.map(s => s.trim()).reduce((best, s) => score(s) > score(best) ? s : best, sents[0].trim());
}
