   Dr. Somebody is home in Canada, in his new flying gear. In each chapter a young guide shows him a place as it is
   today, and the clock balloon opens a WINDOW INTO THE PAST to show the same place long ago.
   A chapter is a row of "beats": story scenes to read, and challenges (3 right answers) that unlock the next scene.
   This first version shows every line in writing and says nothing aloud: the words are recorded once they are settled.
   The guide is Lily (the family chose the name).
   ===================================================================== */

    const add = pick([200, 250, 300]), n = 1784 + add; return { html: "", text: `The families arrived in <b>1784</b>. In what year is it exactly <b>${add} years</b> since they came?`, choices: cards(n, [n + 10, n - 10, n + 100, n - 100, n + 1]), why: `Add ${add} to 1784. 1784 + ${add} = ${n}.` };
  },
  home(g) { // the finale: one question from each friend, in the order we met them
    const [who, kinds] = FRIENDS[Math.min(g ? g.stars : 0, FRIENDS.length - 1)], q = ASK[pick(kinds)]();
    return { ...q, text: `<span class="from">${who}:</span> ${q.text}` };
  }
});
