"use strict";
/* =====================================================================
   DR. SOMEBODY IN ANCIENT ROME  -  the Grade 4 game
   Story: the clock balloon lands in ancient Rome, about two thousand
   years ago. The Roman numerals have fallen off the clock face! Win at a
   place and an animal friend brings one back. Six numerals fix the clock.
   The engine that runs the game is in shared/story.js.
   ===================================================================== */

// Dr. Somebody dressed for Rome: a crown of green leaves and a red sash.

const HOST = owl("", LEAVES + `<path d="M70 86 Q100 100 132 120 L126 132 Q96 112 66 98 Z" fill="#b03a2e"/>`);
const TEMPLE = `<svg class="temple" viewBox="0 0 120 90"><polygon points="8,30 60,6 112,30" fill="#e9dcc3"/><rect x="10" y="30" width="100" height="6" fill="#d4c4a4"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${18 + i * 19}" y="36" width="8" height="40" fill="#f3ead7"/>`).join("")}<rect x="8" y="76" width="104" height="8" fill="#d4c4a4"/></svg>`;
const AQUEDUCT = `<svg class="aqueduct" viewBox="0 0 200 60"><path fill="#cdb89a" fill-rule="evenodd" d="M0 0 H200 V60 H0 Z ${[0, 1, 2, 3, 4].map(i => `M${8 + i * 40} 60 V32 A12 12 0 0 1 ${32 + i * 40} 32 V60 Z`).join(" ")}"/></svg>`;

// ---------- helpers ----------
const comma = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");                       // 1250 is written 1,250
const near = (ans, list) => numCards(ans, 0, 1000000, 4, list).map(c => ({ ...c, html: comma(c.html) }));
const wordCard = (w, color) => `<span style="font-size:${w.length <= 4 ? 8 : w.length <= 6 ? 6 : w.length <= 8 ? 4.6 : w.length <= 11 ? 3.4 : 2.6}vmin${color ? ";color:" + color : ""}">${w}</span>`;
const ansCard = text => `<span class="ans"${Math.max(...text.split(" ").map(w => w.length)) > 10 ? ` style="font-size:2.8vmin"` : ""}>${text}</span>`; // very long words get smaller writing
const pickCards = (right, wrongs, make, msg) => shuffle(wrongs.concat([right])).map(x => ({ html: make(x), ok: x === right, wrong: typeof msg === "function" ? msg(x) : msg }));
const passage = text => `<div class="passage">${text}</div>`;
// pick-the-word questions: a sentence with a gap
function gapQuestion(item, ask, count) {
  const [s, a, wrongs] = item, full = w => s.replace("___", w);
  return { bubble: `<div class="sentence">${s.replace("___", "<u>&nbsp;</u>")}</div>`, key: s, say: `${s.replace("___", "blank")} ${ask}`, again: ask, yay: `Yes! ${full(a)}`,
    choices: pickCards(a, shuffle(wrongs).slice(0, count - 1), ansCard, "Not quite.") };
}
// Roman numerals: toRoman(27) gives ["XXVII", [10, 10, 5, 1, 1]]
function toRoman(n) {
  let s = ""; const parts = [];
  for (const [v, r] of [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]) while (n >= v) { s += r; parts.push(v); n -= v; }
  return [s, parts];
}
const roman = (s, size) => `<span class="roman" style="font-size:${size || (s.length <= 3 ? 14 : s.length <= 5 ? 10 : 7)}vmin">${s}</span>`;
// fractions and decimals. Decimals are kept as a number of tenths: 23 means 2.3
const PARTS = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["quarter", "quarters"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"], 12: ["twelfth", "twelfths"],
  16: ["sixteenth", "sixteenths"], 20: ["twentieth", "twentieths"], 24: ["twenty-fourth", "twenty-fourths"], 100: ["hundredth", "hundredths"] };
const fracSaid = (k, d) => `${k <= 20 ? NUM[k] : k} ${(PARTS[d] || ["over " + d, "over " + d])[k > 1 ? 1 : 0]}`;
const frac = (k, d) => `<span class="frac"><b>${k}</b><i>${d}</i></span>`;
const dec = t => (t / 10).toFixed(1), decSaid = t => `${Math.floor(t / 10)} point ${t % 10}`;
function pie(d, k) {
  const pt = a => `${(50 + 44 * Math.cos(a)).toFixed(1)},${(50 + 44 * Math.sin(a)).toFixed(1)}`;
  let s = "";
  for (let i = 0; i < d; i++) { const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
    s += `<path d="M50,50 L${pt(a0)} A44,44 0 0 1 ${pt(a1)} Z" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
function strip(d, k) { // a long bar cut into d equal parts, k of them orange
  let s = "";
  for (let i = 0; i < d; i++) s += `<rect x="${(2 + i * 196 / d).toFixed(1)}" y="2" width="${(196 / d).toFixed(1)}" height="30" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2"/>`;
  return `<div class="strip"><svg viewBox="0 0 200 34">${s}</svg></div>`;
}
// shapes
const ngon = (n, r) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2 + (n % 2 ? 0 : Math.PI / n); return `${(50 + (r || 42) * Math.cos(a)).toFixed(1)},${(50 + (r || 42) * Math.sin(a)).toFixed(1)}`; }).join(" ");
const SHAPES = { // name: [corner points, lines of symmetry]
  square: ["16,16 84,16 84,84 16,84", 4], rectangle: ["6,28 94,28 94,72 6,72", 2], rhombus: ["50,8 82,50 50,92 18,50", 2], parallelogram: ["26,28 96,28 74,72 4,72", 0], trapezoid: ["32,28 68,28 92,72 8,72", 1],
  pentagon: [ngon(5), 5], hexagon: [ngon(6), 6], octagon: [ngon(8), 8], "equilateral triangle": ["50,12 92,84 8,84", 3], "isosceles triangle": ["50,8 76,88 24,88", 1]
};
const shapeArt = name => `<div class="shapebox"><svg viewBox="0 0 100 100"><polygon points="${SHAPES[name][0]}" fill="#bfe1f6" stroke="#2f6fab" stroke-width="3" stroke-linejoin="round"/></svg></div>`;
function angleArt(deg) {
  const a = deg * Math.PI / 180, x = 50 + 46 * Math.cos(a), y = 80 - 46 * Math.sin(a), ax = 50 + 14 * Math.cos(a), ay = 80 - 14 * Math.sin(a);
  const mark = deg === 90 ? `<path d="M62 80 V68 H50" fill="none" stroke="#ff8a3d" stroke-width="2.5"/>` : `<path d="M64 80 A14 14 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#ff8a3d" stroke-width="2.5"/>`;
  return `<div class="shapebox"><svg viewBox="0 22 100 66">${mark}<g stroke="#2f6fab" stroke-width="4" stroke-linecap="round"><line x1="50" y1="80" x2="96" y2="80"/><line x1="50" y1="80" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/></g></svg></div>`;
}
// A bar graph: one bar for each name. "scale" is how much each line on the side is worth.
function barGraph(names, vals, scale) {
  const top = Math.max(...vals), x0 = 18, y0 = 78, unit = 66 / top;
  let s = "";
  for (let i = 0; i <= top; i++) { const y = (y0 - i * unit).toFixed(1); s += `<line x1="${x0}" y1="${y}" x2="126" y2="${y}" stroke="#d9dbe6" stroke-width=".6"/><text x="${x0 - 2}" y="${+y + 2}" font-size="5.5" text-anchor="end" fill="#2b2d42">${i * scale}</text>`; }
  names.forEach((n, i) => { const x = x0 + 5 + i * 27, h = vals[i] * unit; s += `<rect x="${x}" y="${(y0 - h).toFixed(1)}" width="18" height="${h.toFixed(1)}" fill="${INK[i]}"/><text x="${x + 9}" y="${y0 + 8}" font-size="6.4" text-anchor="middle" font-weight="bold" fill="#2b2d42">${n}</text>`; });
  return `<svg viewBox="0 0 130 90">${s}<line x1="${x0}" y1="${y0}" x2="126" y2="${y0}" stroke="#2b2d42" stroke-width="1.2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="8" stroke="#2b2d42" stroke-width="1.2"/></svg>`;
}
const chips = arr => `<div class="chips">${arr.map(x => `<div>${x}</div>`).join("")}</div>`;
const clockText = mins => `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, "0")}`, clockSaid = mins => timeSaid(Math.floor(mins / 60), mins % 60);

// ---------- words, grammar and facts ----------

// ---------- teaching helpers: lessons ("watch me do one"), hints and step-by-step explanations ----------
const art = html => `<div class="lessonart">${html}</div>`;
async function frames(L, list) { for (const [html, words] of list) { L.frame(art(html)); if (!(await L.say(words))) return false; } return true; }
async function talkThrough(H, list) { for (const [html, words] of list) { H.show(art(html)); if (!(await H.say(words))) return false; } return true; }
function pointTo(H, words) { const c = H.cards().find(c => c.ch.ok); if (c) H.glow(c.el, true); return H.say(words); }
const STOP = new Set("the a an and of to in on is was were it its they them their what who why where which how did do does for with from that this there be by at as are has have".split(" "));
function answerSentence(text, ask, ans) {
  const sents = text.match(/[^.!?]+[.!?]/g) || [text], words = s => s.toLowerCase().replace(/'s\b/g, "").match(/[a-z]+/g) || [];
  const keys = [...words(ans).map(w => [w, 2]), ...words(ask).map(w => [w, 1])].filter(([w]) => w.length > 2 && !STOP.has(w));
  const score = s => { const ws = words(s); return keys.reduce((n, [k, v]) => n + (ws.some(w => w === k || w.startsWith(k.slice(0, Math.max(4, k.length - 2)))) ? v : 0), 0); };
  return sents.map(s => s.trim()).reduce((best, s) => score(s) > score(best) ? s : best, sents[0].trim());
}
const passageHtml = (text, ask) => `<div class="passage">${(text.match(/[^.!?]+[.!?]/g) || [text]).map(s => `<span class="sent">${s.trim()}</span>`).join(" ")}${ask ? `<b>${ask}</b>` : ""}</div>`;
const litSentence = (H, s) => { const el = [...H.bubble.querySelectorAll(".sent")].find(x => x.textContent === s); H.glow(el, true); return el; };
const ROMAN_VAL = { I: 1, V: 5, X: 10, L: 50, C: 100 };

        return { bubble: passage(text), tall: true, key: text, say: `${text} Is that spending, saving, earning, donating, or investing?`, again: "Which money word fits?", yay: `Yes! That's ${word}.`,

        return { bubble: passage(text), tall: true, key: text, say: `${text} What is this way of paying called?`, again: "What is this way of paying called?", yay: `Yes! That's paying with ${way}.`,
          hint: H => H.say("Cash is coins and bills. A debit card takes money straight from your bank account. With a credit card, the bank pays now, and you pay the bank back later."),

      return { bubble: passage(text), tall: true, key: text, say: text.replace(/\$(\d+)/g, (_, n) => dollars(+n)), again: "Which pack costs less for each one?", yay: `Yes! Pack ${best} is the better deal.`,

  roots: {
    name: "Latin Words", icon: "🔤", intro: "The Romans spoke Latin. Lots of English words have little pieces of Latin inside them!",

    name: "Orator's Grammar", icon: "🗣️", intro: "An orator was a great public speaker. Good speakers know their grammar!",

        [`<div class="sentence">We stayed inside <u>&nbsp;</u> it was cold.</div>`, "Watch me pick a joining word. Each one does a different job."],
        [`because = the reason`, "Because gives the reason. Why did we stay inside? It was cold."], [`<div class="sentence">We stayed inside <b>because</b> it was cold.</div>`, "We stayed inside because it was cold!"]]

          hint: H => H.say("A noun names. A verb is the action. An adjective describes a noun. An adverb tells how, and often ends in l y."),
          explain: H => pointTo(H, `${cap(noun)} is the noun. ${cap(verb)} is the verb. ${cap(adj)} is the adjective. ${cap(adv)} is the adverb.`),
          choices: shuffle([noun, verb, adj, adv]).map((w, i) => ({ html: wordCard(w, cols[i]), ok: w === right, wrong: `${cap(w)} is ${what[w]}.` })) }; }
