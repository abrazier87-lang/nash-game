<script>
"use strict";
/* =====================================================================
   DR. SOMEBODY IN ANCIENT ROME  -  the Grade 4 game
   Story: the clock balloon lands in ancient Rome, about two thousand
   years ago. The Roman numerals have fallen off the clock face! Win at a
   place and an animal friend brings one back. Six numerals fix the clock.
   The engine that runs the game is in shared/story.js.
   ===================================================================== */

// Dr. Somebody dressed for Rome: a crown of green leaves and a red sash.
const LEAVES = [-4, -3, -2, -1, 1, 2, 3, 4].map(i => { const x = 100 + i * 10.5, y = 16 + i * i * 1.3; return `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="7" ry="3.4" fill="#4c9f50" transform="rotate(${i * 14} ${x} ${y.toFixed(1)})"/>`; }).join("");
const HOST = owl("", LEAVES + `<path d="M70 86 Q100 100 132 120 L126 132 Q96 112 66 98 Z" fill="#b03a2e"/>`);
const TEMPLE = `<svg class="temple" viewBox="0 0 120 90"><polygon points="8,30 60,6 112,30" fill="#e9dcc3"/><rect x="10" y="30" width="100" height="6" fill="#d4c4a4"/>${[0, 1, 2, 3, 4].map(i => `<rect x="${18 + i * 19}" y="36" width="8" height="40" fill="#f3ead7"/>`).join("")}<rect x="8" y="76" width="104" height="8" fill="#d4c4a4"/></svg>`;
const AQUEDUCT = `<svg class="aqueduct" viewBox="0 0 200 60"><path fill="#cdb89a" fill-rule="evenodd" d="M0 0 H200 V60 H0 Z ${[0, 1, 2, 3, 4].map(i => `M${8 + i * 40} 60 V32 A12 12 0 0 1 ${32 + i * 40} 32 V60 Z`).join(" ")}"/></svg>`;

// ---------- helpers ----------
const comma = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");                       // 1250 is written 1,250
const near = (ans, list) => numCards(ans, 0, 1000000, 4, list).map(c => ({ ...c, html: comma(c.html) }));
const wordCard = (w, color) => `<span style="font-size:${w.length <= 4 ? 8 : w.length <= 6 ? 6 : w.length <= 8 ? 4.6 : w.length <= 11 ? 3.4 : 2.6}vmin${color ? ";color:" + color : ""}">${w}</span>`;
const ansCard = text => `<span class="ans"${Math.max(...text.split(" ").map(w => w.length)) > 10 ? ` style="font-size:2.8vmin"` : ""}>${text}</span>`; // very long words get smaller writing
const pickCards = (right, wrongs, make, msg) => shuffle(wrongs.concat([right])).map(x => ({ html: make(x), ok: x === right, wrong: typeof msg === "function" ? msg(x) : msg }));
const passage = text => `<div class="passage">${text}</div>`;
// pick-the-word questions: a sentence with a gap
function gapQuestion(item, ask, count) {
  const [s, a, wrongs] = item, full = w => s.replace("___", w);
  return { bubble: `<div class="sentence">${s.replace("___", "<u>&nbsp;</u>")}</div>`, key: s, say: `${s.replace("___", "blank")} ${ask}`, again: ask, yay: `Yes! ${full(a)}`,
    choices: pickCards(a, shuffle(wrongs).slice(0, count - 1), ansCard, "Not quite.") };
}
// Roman numerals: toRoman(27) gives ["XXVII", [10, 10, 5, 1, 1]]
function toRoman(n) {
  let s = ""; const parts = [];
  for (const [v, r] of [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]) while (n >= v) { s += r; parts.push(v); n -= v; }
  return [s, parts];
}
const roman = (s, size) => `<span class="roman" style="font-size:${size || (s.length <= 3 ? 14 : s.length <= 5 ? 10 : 7)}vmin">${s}</span>`;
// fractions and decimals. Decimals are kept as a number of tenths: 23 means 2.3
const PARTS = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["quarter", "quarters"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"], 12: ["twelfth", "twelfths"],
  16: ["sixteenth", "sixteenths"], 20: ["twentieth", "twentieths"], 24: ["twenty-fourth", "twenty-fourths"], 100: ["hundredth", "hundredths"] };
const fracSaid = (k, d) => `${k <= 20 ? NUM[k] : k} ${(PARTS[d] || ["over " + d, "over " + d])[k > 1 ? 1 : 0]}`;
const frac = (k, d) => `<span class="frac"><b>${k}</b><i>${d}</i></span>`;
const dec = t => (t / 10).toFixed(1), decSaid = t => `${Math.floor(t / 10)} point ${t % 10}`;
function pie(d, k) {
  const pt = a => `${(50 + 44 * Math.cos(a)).toFixed(1)},${(50 + 44 * Math.sin(a)).toFixed(1)}`;
  let s = "";
  for (let i = 0; i < d; i++) { const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
    s += `<path d="M50,50 L${pt(a0)} A44,44 0 0 1 ${pt(a1)} Z" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2.5" stroke-linejoin="round"/>`; }
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
function strip(d, k) { // a long bar cut into d equal parts, k of them orange
  let s = "";
  for (let i = 0; i < d; i++) s += `<rect x="${(2 + i * 196 / d).toFixed(1)}" y="2" width="${(196 / d).toFixed(1)}" height="30" fill="${i < k ? "#ff9f43" : "#fff"}" stroke="#2b2d42" stroke-width="2"/>`;
  return `<div class="strip"><svg viewBox="0 0 200 34">${s}</svg></div>`;
}
// shapes
const ngon = (n, r) => Array.from({ length: n }, (_, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2 + (n % 2 ? 0 : Math.PI / n); return `${(50 + (r || 42) * Math.cos(a)).toFixed(1)},${(50 + (r || 42) * Math.sin(a)).toFixed(1)}`; }).join(" ");
const SHAPES = { // name: [corner points, lines of symmetry]
  square: ["16,16 84,16 84,84 16,84", 4], rectangle: ["6,28 94,28 94,72 6,72", 2], rhombus: ["50,8 82,50 50,92 18,50", 2], parallelogram: ["26,28 96,28 74,72 4,72", 0], trapezoid: ["32,28 68,28 92,72 8,72", 1],
  pentagon: [ngon(5), 5], hexagon: [ngon(6), 6], octagon: [ngon(8), 8], "equilateral triangle": ["50,12 92,84 8,84", 3], "isosceles triangle": ["50,8 76,88 24,88", 1]
};
const shapeArt = name => `<div class="shapebox"><svg viewBox="0 0 100 100"><polygon points="${SHAPES[name][0]}" fill="#bfe1f6" stroke="#2f6fab" stroke-width="3" stroke-linejoin="round"/></svg></div>`;
function angleArt(deg) {
  const a = deg * Math.PI / 180, x = 50 + 46 * Math.cos(a), y = 80 - 46 * Math.sin(a), ax = 50 + 14 * Math.cos(a), ay = 80 - 14 * Math.sin(a);
  const mark = deg === 90 ? `<path d="M62 80 V68 H50" fill="none" stroke="#ff8a3d" stroke-width="2.5"/>` : `<path d="M64 80 A14 14 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#ff8a3d" stroke-width="2.5"/>`;
  return `<div class="shapebox"><svg viewBox="0 22 100 66">${mark}<g stroke="#2f6fab" stroke-width="4" stroke-linecap="round"><line x1="50" y1="80" x2="96" y2="80"/><line x1="50" y1="80" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/></g></svg></div>`;
}
// A bar graph: one bar for each name. "scale" is how much each line on the side is worth.
function barGraph(names, vals, scale) {
  const top = Math.max(...vals), x0 = 18, y0 = 78, unit = 66 / top;
  let s = "";
  for (let i = 0; i <= top; i++) { const y = (y0 - i * unit).toFixed(1); s += `<line x1="${x0}" y1="${y}" x2="126" y2="${y}" stroke="#d9dbe6" stroke-width=".6"/><text x="${x0 - 2}" y="${+y + 2}" font-size="5.5" text-anchor="end" fill="#2b2d42">${i * scale}</text>`; }
  names.forEach((n, i) => { const x = x0 + 5 + i * 27, h = vals[i] * unit; s += `<rect x="${x}" y="${(y0 - h).toFixed(1)}" width="18" height="${h.toFixed(1)}" fill="${INK[i]}"/><text x="${x + 9}" y="${y0 + 8}" font-size="6.4" text-anchor="middle" font-weight="bold" fill="#2b2d42">${n}</text>`; });
  return `<svg viewBox="0 0 130 90">${s}<line x1="${x0}" y1="${y0}" x2="126" y2="${y0}" stroke="#2b2d42" stroke-width="1.2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="8" stroke="#2b2d42" stroke-width="1.2"/></svg>`;
}
const chips = arr => `<div class="chips">${arr.map(x => `<div>${x}</div>`).join("")}</div>`;
const clockText = mins => `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, "0")}`, clockSaid = mins => timeSaid(Math.floor(mins / 60), mins % 60);

// ---------- words, grammar and facts ----------
const COUNT_WORDS = [["How many wheels does a tricycle have?", 3, "Tri means three."], ["How many sides does an octagon have?", 8, "Oct means eight."], ["How many years are in a century?", 100, "Cent means one hundred."],
  ["How many years are in a decade?", 10, "Dec means ten."], ["How many wheels does a unicycle have?", 1, "Uni means one."], ["How many legs does a quadruped walk on?", 4, "Quad means four."],
  ["How many languages does a bilingual person speak?", 2, "Bi means two."], ["How many horns did a triceratops have?", 3, "Tri means three."], ["How many singers are in a duet?", 2, "Duo means two."],
  ["How many babies are triplets?", 3, "Tri means three."], ["How many centimetres are in a metre?", 100, "Cent means one hundred."], ["How many wheels does a bicycle have?", 2, "Bi means two."],
  ["How many arms does an octopus have?", 8, "Oct means eight."], ["How many events are in a decathlon?", 10, "Dec means ten."]];
const ROOTS = [["aqua", "water", ["aquarium", "aquatic"]], ["port", "to carry", ["transport", "portable"]], ["spect", "to look", ["spectator", "inspect"]], ["scrib", "to write", ["scribble", "describe"]],
  ["aud", "to hear", ["audience", "audio"]], ["ped", "foot", ["pedal", "pedestrian"]], ["dict", "to say", ["dictate", "dictionary"]], ["terr", "earth or land", ["territory", "terrain"]],
  ["vis", "to see", ["visible", "vision"]], ["nav", "ship", ["navy", "navigate"]], ["mar", "the sea", ["marine", "submarine"]], ["sol", "the sun", ["solar", "solstice"]]];
const ROOT_SENTENCES = [["The Romans built an ___ to carry water into the city.", "aqueduct", ["audience", "orbit", "manual"]], ["A ___ walks along the road on foot.", "pedestrian", ["spectator", "navigator", "scribe"]],
  ["The ___ cheered at the chariot race.", "spectators", ["pedals", "aquariums", "dictionaries"]], ["The sailors used the stars to ___ their ship.", "navigate", ["dictate", "inspect", "describe"]],
  ["The emperor would ___ his letters to a scribe.", "dictate", ["navigate", "pedal", "inspect"]], ["Carts were used to ___ grain to Rome.", "transport", ["inspect", "predict", "describe"]],
  ["The ___ listened to the speech.", "audience", ["aquarium", "terrain", "vision"]], ["A ___ is one hundred years.", "century", ["decade", "pedal", "marine"]], ["___ panels turn sunlight into power.", "Solar", ["Marine", "Portable", "Audio"]],
  ["The stars were ___ in the clear night sky.", "visible", ["portable", "aquatic", "audio"]], ["The soldiers crossed rough ___ to reach the fort.", "terrain", ["audio", "vision", "navy"]]];
// [sentence, noun, verb, adjective, adverb]
const SENTENCE_PARTS = [["The brave soldiers marched quickly.", "soldiers", "marched", "brave", "quickly"], ["A hungry lion roared loudly.", "lion", "roared", "hungry", "loudly"], ["The old senator spoke slowly.", "senator", "spoke", "old", "slowly"],
  ["The fast chariots raced wildly.", "chariots", "raced", "fast", "wildly"], ["A young scribe wrote neatly.", "scribe", "wrote", "young", "neatly"], ["The tired builders worked carefully.", "builders", "worked", "tired", "carefully"],
  ["The proud emperor waved grandly.", "emperor", "waved", "proud", "grandly"], ["A clever girl answered correctly.", "girl", "answered", "clever", "correctly"]];
const JOINING = [["I wanted to see the race, ___ it rained.", "but", ["so", "because"]], ["She was tired, ___ she went to bed.", "so", ["but", "or"]], ["We stayed inside ___ it was cold.", "because", ["but", "or"]], ["You can walk ___ you can ride.", "or", ["because", "so"]],
  ["He studied hard, ___ he passed the test.", "so", ["but", "or"]], ["The road was long, ___ the soldiers kept marching.", "but", ["so", "because"]], ["They cheered ___ their team won.", "because", ["but", "or"]],
  ["Wait here ___ I come back.", "until", ["but", "so"]], ["I will help you ___ you ask nicely.", "if", ["but", "so"]]];
const VERB_FORMS = [["Yesterday the Romans ___ a bridge.", "built", ["builded", "build"]], ["Last week she ___ a letter.", "wrote", ["writed", "written"]], ["The soldiers have ___ home.", "gone", ["went", "goed"]], ["He ___ the race yesterday.", "won", ["winned", "wins"]],
  ["They ___ their lunch an hour ago.", "ate", ["eated", "eat"]], ["The emperor ___ a speech last night.", "gave", ["gived", "given"]], ["We ___ the mosaics last summer.", "saw", ["seen", "seed"]], ["The lion has ___ the meat.", "eaten", ["ate", "eated"]],
  ["The children ___ to the market yesterday.", "ran", ["runned", "run"]], ["She ___ the answer straight away.", "knew", ["knowed", "known"]], ["Each of the boys ___ a toga.", "has", ["have", "having"]], ["The group of soldiers ___ marching.", "is", ["are", "am"]]];
const WRITTEN_RIGHT = [["Marcus said, \"Follow me.\"", "Marcus said, Follow me.", "Marcus said \"follow me\"."], ["The girl's toga was white.", "The girls toga was white.", "The girls' toga, was white."],
  ["We saw lions, bears and elephants.", "We saw lions bears and elephants.", "We saw, lions bears and elephants."], ["It's a long road to Rome.", "Its a long road to Rome.", "It's a long road to rome."],
  ["Julia, the baker, sells bread.", "Julia the baker, sells bread.", "julia, the baker sells bread."], ["\"Where are you going?\" asked Livia.", "Where are you going? asked Livia.", "\"Where are you going\" asked Livia?"],
  ["The soldiers' shields were heavy.", "The soldier's shields was heavy.", "The soldiers shields were heavy."], ["After the race, we ate figs.", "After the race we, ate figs.", "after the race, we ate figs"]];
// [what the scroll says, the question, the right answer, three wrong answers]
const SCROLLS = [
  ["Rome began as a small village beside the River Tiber. Over hundreds of years it grew into a huge empire. At its largest, the empire stretched across three continents. Millions of people lived under Roman rule.", "How did Rome begin?", "as a small village", ["as a huge empire", "as an island", "as a desert camp"]],
  ["The Romans built long, straight roads. The roads were made of layers of stone so they would last. Soldiers could march quickly along them. Some Roman roads are still used today.", "Why were the roads built from layers of stone?", "so they would last", ["so they looked pretty", "so carts would go slowly", "so rain would collect"]],
  ["Aqueducts carried fresh water into Roman cities. The water flowed gently downhill through stone channels. Some aqueducts were built on tall arches to cross valleys. The water filled fountains and public baths.", "What did aqueducts carry?", "fresh water", ["soldiers", "grain", "stone blocks"]],
  ["The Colosseum was a giant arena in Rome. It could hold about fifty thousand people. Crowds came to watch shows and contests. It had eighty entrances so people could get in and out quickly.", "Why did the Colosseum have so many entrances?", "so crowds could move quickly", ["to let in more light", "to keep animals out", "for decoration only"]],
  ["Roman soldiers were called legionaries. They marched long distances carrying heavy packs. Each night they built a camp with a ditch and a wall. Their training made the army very strong.", "What did legionaries do each night?", "built a camp", ["sailed a ship", "planted crops", "wrote poems"]],
  ["Romans spoke a language called Latin. Many English words come from Latin. French, Spanish and Italian grew out of Latin too. That is why some words look alike in those languages.", "Which languages grew out of Latin?", "French, Spanish and Italian", ["Chinese and Japanese", "only English", "Greek and Egyptian"]],
  ["Wealthy Romans decorated their floors with mosaics. A mosaic is a picture made from tiny coloured tiles. Some mosaics showed animals, gods or sea creatures. Thousands of tiles were needed for one floor.", "What is a mosaic made from?", "tiny coloured tiles", ["painted cloth", "melted glass sheets", "carved wood"]],
  ["Children from richer Roman families learned reading, writing and arithmetic. They wrote on wax tablets with a pointed stick. The wax could be smoothed over and used again. Papyrus, the paper of the time, was far too costly to waste.", "Why were wax tablets useful?", "they could be used again", ["they were very heavy", "they never melted", "they were made of gold"]],
  ["Public baths were an important part of Roman life. People went there to wash, exercise and meet friends. The baths had hot rooms, warm rooms and cold pools. Hot air under the floors kept the rooms warm.", "How were the rooms kept warm?", "hot air under the floors", ["big wool blankets", "sunlight through the roof", "fires on the roof"]],
  ["The Romans used letters for numbers. I stands for one, V for five and X for ten. We still see Roman numerals on some clocks. They are also used in the names of kings and queens.", "Where can we still see Roman numerals?", "on some clocks", ["on every coin", "only on road signs", "nowhere at all"]],
  ["Mount Vesuvius is a volcano in Italy. In the year 79, it erupted and buried the town of Pompeii in ash. The ash kept buildings and objects safe for centuries. Today visitors can walk through the ancient streets.", "What buried the town of Pompeii?", "ash from a volcano", ["a great flood", "a sandstorm", "deep snow"]],
  ["Romans ate their main meal in the late afternoon. Poor families ate bread, beans and porridge. Rich families held feasts with many courses. They often ate lying on couches around a low table.", "How did rich Romans often eat their feasts?", "lying on couches", ["standing in the street", "sitting on the floor", "riding in chariots"]]

// ---------- the places (mini-games) ----------
// Each has 4 difficulty steps. makeQuestion(step) returns { bubble, say, yay, choices: [{ html, ok, wrong }], pause, key, again, tall, help }.
const GAMES = {
  numerals: {
    name: "Roman Numerals", icon: `<span class="roman">XII</span>`, intro: "Romans wrote numbers with letters. I is 1. V is 5. X is 10. A smaller letter in front means take it away, so I V is 4.",
    makeQuestion(step) {
      const n = step === 1 ? 1 + rand(12) : step === 2 ? 1 + rand(39) : step === 3 ? 40 + rand(61) : 1 + rand(100), [r, parts] = toRoman(n);
      if (step === 4) { // see the number, find its numeral
        const opts = [...new Set([n, n + (n % 5 === 4 ? 2 : n % 5 === 1 && n > 1 ? -2 : 1), n > 10 ? n - 10 : n + 10, n + 20, n > 1 ? n - 1 : n + 3])].filter(k => k > 0).slice(0, 4), longest = Math.max(...opts.map(k => toRoman(k)[0].length)), size = longest <= 3 ? 7 : longest <= 5 ? 5 : longest <= 6 ? 4 : 3;
        return { bubble: big(n, 14), key: "r" + n, say: `Which Roman numeral shows ${n}?`, yay: `Yes! ${parts.join(" plus ")} makes ${n}.`, pause: 3000, choices: shuffle(opts).map(k => ({ html: roman(toRoman(k)[0], size), ok: k === n, wrong: `That one is ${k}.` })) };
      }
      return { bubble: roman(r), key: n, say: (step === 3 ? "L is 50. C is 100. " : "") + "What number is this Roman numeral?", again: "What number is this Roman numeral?", yay: parts.length > 1 ? `Yes! ${parts.join(" plus ")} makes ${n}.` : `Yes! That is ${n}.`, pause: 3000,
        choices: near(n, step === 1 ? [n + 1, n - 1, n + 2, n - 2] : [n + 1, n - 1, n + 10, n - 10, n + 2, n - 2].filter(k => k > 0)) };
    }
  },
  multiply: {
    name: "Legion Lines", icon: "🛡️", intro: "A Roman legion stood in neat rows. Let's multiply!",
    makeQuestion(step) {
      let a, b;
      if (step === 1) { a = 6 + rand(4); b = rand(3) ? 2 + rand(8) : pick([10, 100]); }                              // tricky tables, and times 10 and 100
      else if (step === 2) { do { a = 10 * (1 + rand(4)) + 1 + rand(4); b = 2 + rand(3); } while ((a % 10) * b > 9 || Math.floor(a / 10) * b > 9); } // 23 x 3 (no carrying)
      else if (step === 3) { a = 12 + rand(88); b = 3 + rand(7); }                                                    // 47 x 6
      else if (rand(2)) { a = 10 * (2 + rand(8)); b = 10 * (2 + rand(8)); }                                           // 30 x 40
      else { a = 101 + rand(899); b = 2 + rand(5); }                                                                  // 325 x 4
      const n = a * b;
      return { bubble: `<span class="sum" style="font-size:9vmin">${a} × ${b} = <b>?</b></span>`, key: a + "x" + b, say: `What is ${a} times ${b}?`, yay: `Yes! ${a} times ${b} is ${comma(n)}!`, choices: near(n, [n + a, n - a, n + 10, n - 10, n + b, n + 100].filter(k => k > 0)) };
    }
  },
  divide: {
    name: "Aqueduct Sharing", icon: "💧", intro: "Aqueducts shared water out fairly. Let's divide!",
    makeQuestion(step) {
      if (step <= 2) { const b = step === 1 ? 2 + rand(8) : 2 + rand(5), q = step === 1 ? 2 + rand(9) : 11 + rand(Math.floor(99 / b) - 10), n = b * q; // facts, then 84 divided by 4
        return { bubble: `<span class="sum">${n} ÷ ${b} = <b>?</b></span>`, key: n + "/" + b, say: `What is ${n} divided by ${b}?`, yay: `Yes! ${n} divided by ${b} is ${q}, because ${q} times ${b} is ${n}.`, choices: near(q, [q + 1, q - 1, q + 10, q - 10, q + 2].filter(k => k > 0)) }; }

      return { bubble: `<div class="col"><div class="sentence">${words.join(" &nbsp;·&nbsp; ")}</div><div class="cap">What does <b>${root}</b> mean?</div></div>`, tall: true, key: root, say: `${cap(words[0])} and ${words[1]} share a word part. What does it mean?`, yay: `Yes! ${cap(root)} means ${means}.`,
        choices: pickCards(means, picks.slice(1).map(p => p[1]), ansCard, "Not quite. Think about what both words have in common.") };
    }
  },
  grammar: {
    name: "Orator's Grammar", icon: "🗣️", intro: "An orator was a great public speaker. Good speakers know their grammar!",
    makeQuestion(step) {
      const cols = shuffle(INK);
      if (step === 1) { const [s, noun, verb, adj, adv] = pick(SENTENCE_PARTS), kinds = { noun: [noun, "the noun, the naming word", "a noun"], verb: [verb, "the verb, the action word", "a verb"], adjective: [adj, "the adjective, which describes the noun", "an adjective"], adverb: [adv, "the adverb, which tells how it was done", "an adverb"] };
        const kind = pick(Object.keys(kinds)), right = kinds[kind][0], what = Object.fromEntries(Object.values(kinds).map(v => [v[0], v[2]]));
        return { bubble: `<div class="col"><div class="sentence">${s}</div><div class="cap">${kind}</div></div>`, key: s + kind, say: `${s} Which word is ${kinds[kind][1]}?`, again: `Which word is ${kinds[kind][1]}?`, yay: `Yes! ${cap(right)} is ${what[right]}.`,
          choices: shuffle([noun, verb, adj, adv]).map((w, i) => ({ html: wordCard(w, cols[i]), ok: w === right, wrong: `${cap(w)} is ${what[w]}.` })) }; }
      if (step === 2) return gapQuestion(pick(JOINING), "Which joining word fits?", 3);
      if (step === 3) return gapQuestion(pick(VERB_FORMS), "Which word fits?", 3);
      const [right, x, y] = pick(WRITTEN_RIGHT); // commas, apostrophes and speech marks
      return { bubble: big("✒️", 12), key: right, say: "Which sentence is written correctly? Look at the commas, the apostrophes and the speech marks.", yay: "Yes! Every mark is in the right place.",
        choices: pickCards(right, [x, y], ansCard, "Look again at the capital letters and the punctuation marks.") };
    }
  },
  scroll: {
    name: "Explorer's Scroll", icon: "📜", intro: "Let's read about ancient Rome!",
    makeQuestion(step) {
      const [text, ask, a, wrongs] = pick(SCROLLS), aloud = step === 1; // only step 1 reads the scroll out loud
      return { bubble: `<div class="passage">${text}<b>${ask}</b></div>`, tall: true, key: ask, say: aloud ? `${text} ${ask}` : `Read the scroll. ${ask}`, again: ask, yay: `Yes! ${cap(a)}.`,
        choices: pickCards(a, shuffle(wrongs).slice(0, step <= 2 ? 2 : 3), ansCard, "Not quite. Look at the scroll again.") };
    }
  }
};
